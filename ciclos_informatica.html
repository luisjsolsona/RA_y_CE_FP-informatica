 de los elementos paratextuales de los textos icónico-verbales y multimodales."},{"letra":"—","texto":"Interacción oral y escrita de carácter informal y formal. Cooperación conversacional, cortesía lingüística y etiqueta digital. Escucha activa, asertividad y resolución dialogada de los conflictos. Estrategias discursivas y dialógicas para la expresión de ideas, la confrontación y el consenso."},{"letra":"—","texto":"Comprensión oral: sentido global del texto. Selección de la información relevante. La intención del emisor. Producción oral formal. Adecuación a la audiencia y al tiempo de exposición. Elementos no verbales. Rasgos discursivos y lingüísticos de la oralidad formal. La deliberación oral argumentada."},{"letra":"—","texto":"Comprensión lectora: sentido global del texto. La intención del emisor."},{"letra":"—","texto":"Producción escrita. Planificación, redacción, revisión y edición en diferentes soportes."},{"letra":"—","texto":"Corrección gramatical y ortográfica. Los signos de puntuación como mecanismo organizador del texto escrito. Su relación con el significado. Uso de diccionarios, manuales de consulta y correctores ortográficos en soporte digital."},{"letra":"—","texto":"Autoconfianza: puesta en valor de los puntos fuertes. El error en la comunicación como oportunidad de mejora."},{"letra":"—","texto":"Lectura guiada de obras relevantes del patrimonio literario nacional y universal y de la literatura actual inscritas en un itinerario temático o de género."},{"letra":"—","texto":"Expresión, a través de modelos, de la experiencia lectora y de diferentes formas de apropiación y recreación de los textos leídos."},{"letra":"—","texto":"Lectura expresiva, dramatización y recitación de los textos atendiendo a los procesos de comprensión, apropiación y oralización implicados."},{"letra":null,"texto":"Reflexión sobre la lengua."},{"letra":"—","texto":"Reconocimiento de las lenguas de España y de las variedades dialectales del español. Las lenguas de signos. Exploración y cuestionamiento de prejuicios y estereotipos lingüísticos."},{"letra":"—","texto":"Aproximación a la lengua como sistema y a sus unidades básicas teniendo en cuenta los diferentes niveles: el sonido y sistema de escritura, las palabras (forma y significado) y su organización en el discurso (orden de las palabras y conexión entre los componentes oracionales)."}]},{"descripcion":"C. Comunicación en Lengua Extranjera.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Autoconfianza. El error como instrumento de mejora."},{"letra":"—","texto":"Funciones comunicativas básicas tanto del ámbito personal como del ámbito profesional de especialización: saludar, despedirse y presentarse; describir a personas, objetos y lugares; situar eventos en el tiempo; situar objetos, personas y lugares en el espacio; pedir e intercambiar información; dar instrucciones y órdenes; ofrecer, aceptar y rechazar ayuda, proposiciones o sugerencias; etc."},{"letra":"—","texto":"Unidades lingüísticas básicas y significados asociados a dichas unidades tales como la expresión de la entidad y sus propiedades; la cantidad y la cualidad; el espacio y las relaciones espaciales; el tiempo y las relaciones temporales; la afirmación; la negación; la interrogación y la exclamación; relaciones lógicas básicas."},{"letra":"—","texto":"Léxico, frases y expresiones de uso común en el ámbito personal y en el ámbito profesional de especialización."},{"letra":"—","texto":"Convenciones ortográficas básicas y significados e intenciones comunicativas asociados a los formatos, patrones y elementos gráficos."},{"letra":"—","texto":"Cortesía lingüística y etiqueta digital."},{"letra":"—","texto":"Aspectos socioculturales y sociolingüísticos básicos relativos a la vida cotidiana y a las situaciones propias del ámbito profesional de especialización."},{"letra":"—","texto":"Estrategias básicas para entender y apreciar la diversidad lingüística y cultural."}]}]},{"cod":"3015","nombre":"Equipos eléctricos y electrónicos","horasSem":"5","horasTotal":"167","ras":[{"descripcion":"Identifica el material, herramientas y equipo necesarios para el montaje y ensamblado de equipos eléctricos y electrónicos, describiendo sus principales características y funcionalidad.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han identificado y clasificado los elementos y componentes tipo de un equipo eléctrico o electrónico."},{"letra":"b)","texto":"Se han identificado y clasificado los anclajes y sujeciones tipo (tornillos, clips, pestañas, entre otros) de un equipo eléctrico o electrónico en función de su aplicación, rigidez y estabilidad."},{"letra":"c)","texto":"Se han identificado y clasificado las herramientas (atornillador eléctrico, atornilladores planos y de estrella y llaves, entre otros) normalmente empleadas en el ensamblado de un equipo eléctrico o electrónico en función de su aplicación e idoneidad."},{"letra":"d)","texto":"Se han identificado y clasificado los diferentes medios y equipos de seguridad personal (guantes de protección, gafas y mascarilla, entre otros) en función de su aplicación y teniendo en cuenta las herramientas a utilizar."}]},{"descripcion":"Determina la secuencia de las operaciones de montaje y desmontaje de equipos eléctricos y electrónicos, interpretando esquemas e identificando los pasos a seguir.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se ha reconocido la simbología de representación gráfica de los elementos y componentes de los equipos eléctricos y electrónicos."},{"letra":"b)","texto":"Se ha interpretado el procedimiento y secuencia de montaje/conexión, a partir de esquemas o guías de montaje."},{"letra":"c)","texto":"Se ha identificado cada uno de los elementos representados en el esquema con el elemento real."},{"letra":"d)","texto":"Se ha identificado el procedimiento y secuencia de montaje/conexión de los distintos elementos (inserción de tarjetas, fijación de elementos, entre otros)."},{"letra":"e)","texto":"Se ha definido el proceso y secuencia de montaje/conexión a partir del esquema o guía de montaje."}]},{"descripcion":"Monta y desmonta elementos de equipos eléctricos o electrónicos, interpretando esquemas y guías de montaje.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han seleccionado los esquemas y guías de montaje indicados para un modelo determinado."},{"letra":"b)","texto":"Se han seleccionado las herramientas indicadas en los esquemas y guías de montaje."},{"letra":"c)","texto":"Se han preparado los elementos y materiales que se van a utilizar, siguiendo procedimientos normalizados."},{"letra":"d)","texto":"Se ha identificado la ubicación de los distintos elementos en el equipo."},{"letra":"e)","texto":"Se han ensamblado los distintos componentes siguiendo procedimientos normalizados, aplicando las normas de seguridad de los mismos."},{"letra":"f)","texto":"Se han fijado los componentes con los elementos de sujeción indicados en los esquemas o guías de montaje y aplicando el par de apriete o presión establecidos."},{"letra":"g)","texto":"Se ha aplicado técnicas de montaje de componentes y conectores electrónicos en placas de circuito impreso."},{"letra":"h)","texto":"Se han aplicado técnicas de desmontaje de equipos eléctricos o electrónicos."},{"letra":"i)","texto":"Se han observado los requerimientos de seguridad establecidos."},{"letra":"j)","texto":"Se ha elaborado un informe recogiendo las actividades desarrolladas y resultados obtenidos."}]},{"descripcion":"Conexiona elementos en equipos eléctricos o electrónicos aplicando técnicas básicas y verificando la continuidad.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han seleccionado los esquemas y guías de montaje indicados para un modelo determinado de conexión."},{"letra":"b)","texto":"Se ha seleccionado las herramientas indicadas en los esquemas y guías de conexión."},{"letra":"c)","texto":"Se han dispuesto y colocado las piezas del conector y los cables."},{"letra":"d)","texto":"Se han dispuesto y colocado las protecciones personales y de los elementos."},{"letra":"e)","texto":"Se han acondicionado los cables (pelar, estirar, ordenar) siguiendo procedimientos."},{"letra":"f)","texto":"Se han insertado las piezas del conector en el orden correcto y unir los cables (soldar, crimpar, embornar, entre otros) de la forma establecida en el procedimiento."},{"letra":"g)","texto":"Se ha realizado la conexión (soldadura, embornado, conector) según el procedimiento establecido (posición de elementos, inserción del elemento, maniobra de fijación, entre otros)."},{"letra":"h)","texto":"Se han observado las medidas de seguridad en la utilización de equipos y herramientas."},{"letra":"i)","texto":"Se han dispuesto y colocado las etiquetas en los cables, según el procedimiento establecido"},{"letra":"j)","texto":"Se han tratado los residuos generados de acuerdo a la normativa sobre medioambiente."}]},{"descripcion":"Realiza el mantenimiento básico de equipos eléctricos y electrónicos, aplicando las técnicas establecidas en condiciones de calidad y seguridad.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han seleccionado los esquemas y guías indicados para un modelo determinado."},{"letra":"b)","texto":"Se han seleccionado las herramientas según las operaciones a realizar."},{"letra":"c)","texto":"Se han identificado los elementos a sustituir."},{"letra":"d)","texto":"Se han acopiado los elementos de sustitución."},{"letra":"e)","texto":"Se han seleccionado las herramientas necesarias para las operaciones a realizar."},{"letra":"f)","texto":"Se han desmontado los elementos a sustituir, empleando las técnicas y herramientas apropiadas según los requerimientos de cada intervención."},{"letra":"g)","texto":"Se han montado los elementos de sustitución, empleando las técnicas y herramientas apropiadas según los requerimientos de cada intervención."},{"letra":"h)","texto":"Se han realizado las operaciones observando las medidas de seguridad previstas para los componentes y personales."},{"letra":"i)","texto":"Se ha elaborado un informe con las operaciones realizadas en un documento con el formato establecido."}]}]},{"cod":"3159","nombre":"Itinerario personal para la empleabilidad","horasSem":"2","horasTotal":"67","ras":[{"descripcion":"Desarrolla actividades de autoconocimiento que le permiten orientarse a campos profesionales motivadores en los que puede desplegar todas sus capacidades.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han evaluado los propios intereses, motivaciones, habilidades y destrezas en el marco de un proceso de autoconocimiento."},{"letra":"b)","texto":"Se han determinado las competencias personales y sociales con valor para el empleo."},{"letra":"c)","texto":"Se ha valorado el concepto de autoestima en el proceso de búsqueda de empleo."},{"letra":"d)","texto":"Se han identificado las fortalezas, debilidades, amenazas y oportunidades propias para la inserción profesional, así como las estrategias para sacarles el mayor aprovechamiento."},{"letra":"e)","texto":"Se han identificado expectativas de futuro para la inserción profesional analizando competencias, intereses y destrezas personales."}]},{"descripcion":"Desarrolla habilidades sociales concretas que se han demostrado como fundamentales a la hora de encontrar un empleo y mantenerlo.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se ha valorado la importancia de las competencias personales y sociales en la empleabilidad."},{"letra":"b)","texto":"Se han aplicado estrategias para canalizar las emociones de manera asertiva en las relaciones con otras personas, diferenciándolas de conductas agresivas y/o pasivas."},{"letra":"c)","texto":"Se han puesto en práctica técnicas de presentación, orales y escritas, para una comunicación efectiva y afectiva valorando su importancia como recurso personal para la empleabilidad."},{"letra":"d)","texto":"Se han identificado los beneficios del trabajo en equipo, así como las diferentes formas de llevarlo a cabo."},{"letra":"e)","texto":"Se ha reaccionado de forma flexible y positiva ante conflictos y situaciones nuevas, aprovechando las oportunidades y gestionando las dificultades haciendo uso de estrategias relacionadas con la inteligencia emocional."}]},{"descripcion":"Accede a la información de los posibles itinerarios académicos y/o profesionales que tiene a su alcance a través de la investigación y la reflexión libre de estereotipos vocacionales.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se ha determinado la realidad del entorno sociolaboral actual."},{"letra":"b)","texto":"Se han identificado los itinerarios académicos y profesionales afines a sus intereses y se han valorado las opciones que mejor se ajustan a sus perfiles profesionales y sus preferencias."},{"letra":"c)","texto":"Se ha valorado la importancia de la formación permanente como factor clave para el empleo y la adaptación al cambio."}]},{"descripcion":"Pone en marcha un itinerario propio analizando las distintas opciones educativas y profesionales, valorando las ventajas e inconvenientes de cada una de ellas y examinando aquellas que mejor se ajustan a sus posibilidades y preferencias.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han valorado las ventajas e inconvenientes de cada una de las opciones posibles."},{"letra":"b)","texto":"Se han analizado y seleccionado las opciones que más se ajustan a sus perfiles profesionales."},{"letra":"c)","texto":"Se ha realizado un proceso de toma de decisiones identificando el itinerario académico y profesional personal, a partir de sus preferencias profesionales, intereses y metas en el marco de un proyecto profesional."}]},{"descripcion":"Conoce las estrategias de acceso al mercado de trabajo por cuenta ajena y utiliza las herramientas necesarias para el proceso de inserción laboral.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se ha analizado la búsqueda de empleo como un proceso."},{"letra":"b)","texto":"Se han identificado las diferentes fuentes de información de acceso al empleo."},{"letra":"c)","texto":"Se han analizado las distintas técnicas utilizadas para la búsqueda de empleo por cuenta ajena."},{"letra":"d)","texto":"Se han puesto en práctica las diferentes herramientas que permitan una búsqueda de empleo óptima."}]}]},{"cod":"3029","nombre":"Montaje y mantenimiento de sistemas y componentes informáticos","horasSem":"7","horasTotal":"233","ras":[{"descripcion":"Selecciona los componentes y herramientas para la realización del montaje y mantenimiento de sistemas microinformáticos, describiéndolos y relacionándolos con su función y aplicación en la instalación.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han descrito las características de los elementos eléctricos y electrónicos utilizados en el montaje de sistemas."},{"letra":"b)","texto":"Se han descrito las operaciones y comprobaciones previas a la manipulación segura de componentes eléctricos y/o electrónicos."},{"letra":"c)","texto":"Se han identificado los dispositivos y herramientas necesarios en la manipulación segura de sistemas electrónicos."},{"letra":"d)","texto":"Se han seleccionado las herramientas necesarias para el procedimiento de montaje, sustitución o conexión de componentes hardware de un sistema microinformático."},{"letra":"e)","texto":"Se han identificado funcionalmente los componentes hardware para el ensamblado y/o mantenimiento de un equipo microinformático."},{"letra":"f)","texto":"Se han descrito las características técnicas de cada uno de los componentes hardware (internos y externos) utilizados en el montaje y/o mantenimiento de un equipo microinformático."},{"letra":"g)","texto":"Se han localizado los bloques funcionales en placas bases utilizadas en los sistemas microinformáticos."},{"letra":"h)","texto":"Se han identificado los tipos de puertos, bahías internas y cables de conexión (de datos y eléctricos, entre otros) existentes de un equipo microinformático."},{"letra":"i)","texto":"Se han seguido las instrucciones recibidas."}]},{"descripcion":"Ensambla los componentes hardware de un equipo microinformático, interpretando guías e instrucciones y aplicando técnicas de montaje.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se ha comprobado cada componente antes de su utilización, siguiendo las normas de seguridad establecidas."},{"letra":"b)","texto":"Se han interpretado las guías de instrucciones referentes a los procedimientos de integración o ensamblado, sustitución y conexión del componente hardware de un sistema microinformático."},{"letra":"c)","texto":"Se han reconocido en distintas placas base cada uno de los zócalos de conexión de microprocesadores y los disipadores, entre otros."},{"letra":"d)","texto":"Se han ensamblado los componentes hardware internos (memoria, procesador, tarjeta de video, pila, entre otros) en la placa base del sistema microinformático."},{"letra":"e)","texto":"Se ha fijado cada dispositivo o tarjeta en la ranura o bahía correspondiente, según guías detalladas de instalación."},{"letra":"f)","texto":"Se han conectado adecuadamente aquellos componentes hardware internos (disco duro, DVD, CD-ROM, entre otros) que necesiten cables de conexión para su integración en el sistema microinformático."}]},{"descripcion":"Instala sistemas operativos monopuesto identificando las fases del proceso y relacionándolas con la funcionalidad de la instalación.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han descrito los pasos a seguir para la instalación o actualización."},{"letra":"b)","texto":"Se ha verificado la ausencia de errores durante el proceso de carga del sistema operativo."},{"letra":"c)","texto":"Se han utilizado las herramientas de control para la estructura de directorios y la gestión de permisos."},{"letra":"d)","texto":"Se han instalado actualizaciones y parches del sistema operativo según las instrucciones recibidas."},{"letra":"e)","texto":"Se han realizado copias de seguridad de los datos"},{"letra":"f)","texto":"Se han anotado los posibles fallos producidos en la fase de arranque del equipo microinformático."},{"letra":"g)","texto":"Se han descrito las funciones de replicación física (“clonación”) de discos y particiones en sistemas microinformáticos."},{"letra":"h)","texto":"Se han utilizado herramientas software para la instalación de imágenes de discos o particiones señalando las restricciones de aplicación de las mismas."},{"letra":"i)","texto":"Se ha verificado la funcionalidad de la imagen instalada, teniendo en cuenta el tipo de “clonación” realizada."}]},{"descripcion":"Comprueba la funcionalidad de los sistemas, soportes y periféricos instalados relacionando las intervenciones con los resultados a conseguir.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se ha aplicado a cada componente hardware y periférico el procedimiento de testeo adecuado."},{"letra":"b)","texto":"Se ha verificado que el equipo microinformático realiza el procedimiento de encendido y de POST (Power On Self Test), identificando el origen de los problemas, en su caso."},{"letra":"c)","texto":"Se ha comprobado la funcionalidad de los soportes para almacenamiento de información."},{"letra":"d)","texto":"Se ha verificado la funcionalidad en la conexión entre componentes del equipo microinformático y con los periféricos."},{"letra":"e)","texto":"Se han utilizado herramientas de configuración, testeo y comprobación para verificar el funcionamiento del sistema."},{"letra":"f)","texto":"Se han utilizado las herramientas y guías de uso para comprobar el estado de los soportes y de la información contenida en los mismos."},{"letra":"g)","texto":"Se han registrado los resultados y las incidencias producidas en los procesos de comprobación."}]},{"descripcion":"Realiza el mantenimiento básico de sistemas informáticos, soportes y periféricos, relacionando las intervenciones con los resultados que hay que conseguir.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se ha comprobado por medio de indicadores luminosos, que los periféricos conectados tienen alimentación eléctrica y las conexiones de datos."},{"letra":"b)","texto":"Se han descrito los elementos consumibles necesarios para ser utilizados en los periféricos de sistemas microinformáticos."},{"letra":"c)","texto":"Se han utilizado las guías técnicas detalladas para sustituir elementos consumibles."},{"letra":"d)","texto":"Se han descrito las características de los componentes, de los soportes y de los periféricos para conocer los aspectos que afecten a su mantenimiento."},{"letra":"e)","texto":"Se han utilizado las guías de los fabricantes para identificar los procedimientos de limpieza de componentes, soportes y periféricos."},{"letra":"f)","texto":"Se ha realizado la limpieza de componentes, soportes y periféricos respetando las disposiciones técnicas establecidas por el fabricante manteniendo su funcionalidad."},{"letra":"g)","texto":"Se han recogido los residuos y elementos desechables de manera adecuada para su eliminación o reciclaje."}]},{"descripcion":"Almacena equipos, periféricos y consumibles, describiendo las condiciones de conservación y etiquetado.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han descrito las condiciones para manipular, transportar y almacenar componentes y periféricos de un sistema microinformático."},{"letra":"b)","texto":"Se han identificado los tipos de embalaje para el transporte y/o almacenaje de cada dispositivo, periférico y consumible."},{"letra":"c)","texto":"Se han utilizado las herramientas necesarias para realizar las tareas de etiquetado previas al embalaje y/o almacenamiento de sistemas, periféricos y consumibles."},{"letra":"d)","texto":"Se han utilizado los medios auxiliares adecuados a los elementos a transportar."},{"letra":"e)","texto":"Se han aplicado las normas de seguridad en la manipulación y el transporte de elementos y equipos."},{"letra":"f)","texto":"Se ha comprobado que los componentes recepcionados se corresponden con el albarán de entrega y que se encuentran en buen estado."},{"letra":"g)","texto":"Se han registrado las operaciones realizadas siguiendo los formatos establecidos."},{"letra":"h)","texto":"Se han recogido los elementos desechables para su eliminación o reciclaje."}]}]},{"cod":"A123","nombre":"Prevención de riesgos laborales","horasSem":"1","horasTotal":"33","ras":[{"descripcion":"Conoce los conceptos básicos sobre seguridad y salud en el trabajo.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Diferencia entre los conceptos de prevención y protección."},{"letra":"b)","texto":"Conoce los conceptos de riesgo y daño profesional."},{"letra":"c)","texto":"Reconoce los factores que pueden provocar un riesgo."},{"letra":"d)","texto":"Conoce y diferencia los conceptos de accidente laboral y enfermedad profesional."},{"letra":"e)","texto":"Valora la importancia de la seguridad."},{"letra":"f)","texto":"Conoce sus derechos y obligaciones en materia de prevención de riesgos laborales."},{"letra":"g)","texto":"Conoce la importancia del orden y la limpieza en el trabajo como medida preventiva de accidentes y enfermedades laborales."},{"letra":"h)","texto":"Reconoce la importancia de un buen mantenimiento de los equipos para la eliminación de riesgos profesionales."}]},{"descripcion":"Conoce los aspectos básicos de la prevención y las técnicas generales de evaluación y control de riesgos.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Conoce los factores de riesgo inherentes a los lugares de trabajo."},{"letra":"b)","texto":"Reconoce los riesgos producidos por parámetros físicos (temperatura, ruido, iluminación), químicos y biológicos."},{"letra":"c)","texto":"Conoce el concepto de carga de trabajo y diferencia entre carga física y mental."},{"letra":"d)","texto":"Reconoce los organismos que establecen los planes de emergencia."}]},{"descripcion":"Identifica los riesgos específicos y aplica las medidas de seguridad correspondientes.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Identifica las causas, los riesgos y las medidas que hubieran evitado un accidente, a partir de casos reales."},{"letra":"b)","texto":"Conoce la señalización industrial y la importancia que tiene."},{"letra":"c)","texto":"Reconoce los sistemas de protección colectiva e individual."},{"letra":"d)","texto":"Identifica los equipos de protección individual más comunes que deberá utilizar en el desempeño de su trabajo."},{"letra":"e)","texto":"Detecta los puntos críticos que se deben vigilar en la puesta en marcha de los equipos."},{"letra":"f)","texto":"Identifica los sistemas de detección y extinción de un incendio."},{"letra":"g)","texto":"Identifica los riesgos asociados a contactos eléctricos no deseados."},{"letra":"h)","texto":"Identifica los riesgos asociados al trabajo con gases y recipientes a presión."},{"letra":"i)","texto":"Sabe cómo actuar en caso de accidente y en situaciones de emergencia."},{"letra":"j)","texto":"Conoce los primeros auxilios y cómo se realiza la respiración artificial."}]},{"descripcion":"Aplica las medidas de prevención y seguridad medioambientales correspondientes.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Reconoce la importancia de la recogida selectiva de residuos para el medio ambiente."},{"letra":"b)","texto":"Aplica las normas de prevención de riesgos laborales y protección ambiental requeridas."},{"letra":"c)","texto":"Aplica las medidas de seguridad en la limpieza, funcionamiento y mantenimiento básico de los equipos."}]}]},{"cod":"A127","nombre":"Taller de montaje de equipos informáticos","horasSem":"5","horasTotal":"167","ras":[{"descripcion":"Determinar de forma práctica los componentes y herramientas imprescindibles para el montaje y mantenimiento de sistemas microinformáticos.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han descrito los parámetros físicos y características técnicas de los elementos utilizados en el montaje de sistemas, incluyendo herramientas y dispositivos externos e internos."},{"letra":"b)","texto":"Se han utilizado los componentes hardware para el ensamblado y/o mantenimiento de un equipo microinformático."},{"letra":"c)","texto":"Se han realizado prácticas con las herramientas necesarias para el procedimiento de montaje, sustitución o conexión de componentes hardware de un sistema microinformático."},{"letra":"d)","texto":"Se ha trabajado con los distintas interfaces de entrada y cables de conexión (de datos y eléctricos, entre otros) de un equipo microinformático."},{"letra":"e)","texto":"Se han puesto en práctica las instrucciones recibidas."}]},{"descripcion":"Monta los componentes hardware de un equipo microinformático siguiendo los manuales de cada elemento.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se ha verificado cada componente antes de su montaje o ensamblado."},{"letra":"b)","texto":"Se han seguido correctamente las guías de instrucciones tanto para el ensamblado como para la sustitución y conexión de los distintos componentes."},{"letra":"c)","texto":"Se han identificado los componentes de una placa base incluyendo zócalos de conexión de microprocesadores y disipadores, entre otros."},{"letra":"d)","texto":"Se han conectado correctamente componentes internos (memoria, procesador, tarjeta de video, pila, entre otros) a la placa base del sistema microinformático."},{"letra":"e)","texto":"Se ha practicado la conexión de dispositivos externos mediante tarjeta u otros interfaces siguiendo las guías detalladas de instalación."},{"letra":"f)","texto":"Se ha realizado la conexión de aquellos componentes hardware internos (disco duro, lector de tarjetas, fuente de alimentación, entre otros) que necesiten cables de conexión para su integración en el sistema microinformático."}]},{"descripcion":"Practica el funcionamiento correcto de los sistemas, soportes y periféricos instalados con distintos parámetros de configuración y funcionamiento.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se ha testeado adecuadamente cada elemento de hardware y periférico."},{"letra":"b)","texto":"Se han probado distintos errores en el procedimiento de encendido y de POST (Power On Self Test) así como su detección y corrección."},{"letra":"c)","texto":"Se ha practicado con los soportes para almacenamiento de información probando su funcionamiento en distintas circunstancias."},{"letra":"d)","texto":"Se ha verificado el funcionamiento íntegro del equipo microinformático y los periféricos conectados."},{"letra":"e)","texto":"Se han puesto a prueba las diferentes herramientas de comprobación para verificar el funcionamiento del sistema en su conjunto."}]}]},{"cod":"A998","nombre":"Tutoría I","horasSem":"2","horasTotal":"67","ras":[]}]},{"cursoNombre":"Curso 2º","modulos":[{"cod":"3164","nombre":"Ámbito de Ciencias Aplicadas II","horasSem":"4","horasTotal":"133","ras":[{"descripcion":"A. Destrezas científicas básicas.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Metodologías de la investigación científica: identificación y formulación de cuestiones, elaboración de hipótesis y comprobación mediante experimentación. Proyectos de investigación."},{"letra":"—","texto":"Entornos y recursos de aprendizaje científico (como el laboratorio y los entornos virtuales): utilización adecuada que asegure la conservación de la salud propia y la comunitaria, la seguridad y el respeto al medio ambiente."},{"letra":"—","texto":"Lenguaje científico: interpretación, producción y comunicación eficaz de información de carácter científico en el contexto escolar y profesional en diferentes formatos."},{"letra":"—","texto":"Valoración de la ciencia y de la actividad desarrollada por las personas que se dedican a ella y reconocimiento de su contribución a los distintos ámbitos del saber humano y en el avance y la mejora de la sociedad."},{"letra":"—","texto":"La medida y la expresión numérica de las magnitudes físicas: orden de magnitud, notación científica, indicadores de precisión de las mediciones y los resultados y relevancia de las unidades de medida."},{"letra":"—","texto":"Estrategias de resolución de problemas."}]},{"descripcion":"C. Sentido de la medida.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Estrategias de estimación o cálculo de medidas indirectas de formas planas y tridimensionales y objetos de la vida cotidiana y profesional."},{"letra":"—","texto":"Perímetros, áreas y volúmenes: interpretación, obtención de fórmulas y aplicación en formas planas y tridimensionales."},{"letra":"—","texto":"Representación plana de objetos tridimensionales: visualización y utilización en la resolución de problemas."},{"letra":"—","texto":"Instrumentos de dibujo y herramientas digitales: utilización, realización de dibujos de objetos geométricos con medidas fijadas."}]},{"descripcion":"D. Sentido espacial.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Formas geométricas de dos y tres dimensiones: descripción y clasificación en función de sus propiedades o características."},{"letra":"—","texto":"Objetos geométricos: construcción con instrumentos de dibujo, con herramientas manipulativas y digitales (programas de geometría dinámica, realidad aumentada...)."},{"letra":"—","texto":"Coordenadas cartesianas: localización y descripción de relaciones espaciales."}]},{"descripcion":"E. Sentido algebraico.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Variable: comprensión y expresión de relaciones sencillas mediante lenguaje algebraico. Equivalencia entre expresiones algebraicas de primer y segundo grado."},{"letra":"—","texto":"Ecuaciones lineales y cuadráticas: resolución algebraica y gráfica en contextos de resolución de problemas e interpretación de las soluciones."},{"letra":"—","texto":"Relaciones lineales, cuadráticas y de proporcionalidad inversa: interpretación en situaciones contextualizadas descritas mediante un enunciado, tabla, gráfica o expresión analítica."},{"letra":"—","texto":"Herramientas tecnológicas: utilización en la resolución de problemas."},{"letra":"—","texto":"Estrategias para la interpretación y modificación de algoritmos. Formulación de problemas susceptibles de ser analizados utilizando programas y otras herramientas."}]},{"descripcion":"G. La materia y sus cambios.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Nomenclatura de sustancias químicas de mayor relevancia o relacionadas con la familia profesional correspondiente, según las normas de la IUPAC."},{"letra":"—","texto":"Ecuaciones químicas sencillas: interpretación cualitativa y cuantitativa. Cálculos estequiométricos sencillos e interpretación de los factores que las afectan. Relevancia en el mundo cotidiano y profesional."}]},{"descripcion":"H. Las interacciones y la energía.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Movimiento de los cuerpos: descripción y uso de las magnitudes cinemáticas adecuadas a cada caso."},{"letra":"—","texto":"Relación de las fuerzas con los cambios que producen sobre los sistemas y aplicación a la resolución de problemas de la vida cotidiana y profesional relacionados con las fuerzas presentes en la naturaleza."},{"letra":"—","texto":"La energía: análisis y formulación de hipótesis, propiedades, transferencia y manifestaciones de la energía, relacionando la obtención y consumo de la energía con las repercusiones medioambientales que produce."},{"letra":"—","texto":"La electricidad: corriente eléctrica en circuitos simples. Obtención experimental de magnitudes y relación entre ellas. Medidas de seguridad y prevención."}]},{"descripcion":"K. Sentido socioafectivo.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Estrategias de reconocimiento de las emociones que intervienen en el aprendizaje y desarrollo de la curiosidad, la iniciativa, la perseverancia y la resiliencia, así como del placer de aprender y comprender la ciencia."},{"letra":"—","texto":"Estrategias que aumenten la flexibilidad cognitiva y la apertura a cambios y que ayuden a transformar el error en oportunidad de aprendizaje."},{"letra":"—","texto":"Técnicas cooperativas que optimicen el trabajo en equipo, despliegue de conductas empáticas y estrategias para la gestión de conflictos."},{"letra":"—","texto":"Actitudes inclusivas como la igualdad efectiva de género, la corresponsabilidad, el respeto por las minorías y la valoración de la diversidad presente en el aula y en la sociedad como una riqueza cultural."},{"letra":"—","texto":"Estrategias de identificación y prevención de abusos, de agresiones, de situaciones de violencia o de vulneración de la integridad física, psíquica y emocional."}]}]},{"cod":"3162","nombre":"Ámbito de Comunicación y ciencias sociales II","horasSem":"4","horasTotal":"133","ras":[{"descripcion":"A. Ciencias Sociales","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Riesgos del uso de las tecnologías de la información y de la comunicación. Uso ético de la información. El problema de la desinformación."},{"letra":"—","texto":"Principales hitos de la historia mundial, europea y nacional: causas y consecuencias sociales, políticas, económicas y culturales."},{"letra":"—","texto":"Las relaciones internacionales y el estudio de conflictos y violencias. El Holocausto."},{"letra":"—","texto":"Las formaciones identitarias (ideologías, nacionalismos y movimientos supranacionales)."},{"letra":"—","texto":"La huella humana y la conservación, protección y defensa del patrimonio histórico-artístico, cultural y natural. Significado y función de las expresiones artísticas y culturales en las distintas civilizaciones. La relación del ser humano y la naturaleza a lo largo de la historia."},{"letra":"—","texto":"La contribución del Estado y sus instituciones a la paz, a la seguridad integral ciudadana y a la convivencia social."},{"letra":"—","texto":"España en Europa y el mundo. La seguridad y la cooperación internacional. Los compromisos internacionales de España. La resolución pacífica de los conflictos."},{"letra":"—","texto":"El sistema democrático: su construcción, sus principios básicos y distintos modelos. Instituciones y organizaciones democráticas. La Constitución española y el ordenamiento normativo autonómico, nacional y supranacional."},{"letra":"—","texto":"Diversidad social, multiculturalidad e interculturalidad. El respeto por las minorías etnoculturales. La crítica al eurocentrismo."},{"letra":"—","texto":"El logro de una efectiva igualdad de género. Manifestaciones y conductas no sexistas. El reconocimiento de los derechos LGTBQ+."}]},{"descripcion":"B. Comunicación en Lengua Castellana.","etiqueta":"(SB)","ces":[{"letra":null,"texto":"Alfabetización mediática e informacional."},{"letra":"—","texto":"Estrategias de búsqueda y selección de información fiable, pertinente y de calidad."},{"letra":"—","texto":"Riesgos y consecuencias de la manipulación y la desinformación."},{"letra":"—","texto":"Tecnologías de la información. Dispositivos, aplicaciones informáticas y plataformas digitales de búsqueda de información."},{"letra":null,"texto":"Comunicación."},{"letra":"—","texto":"Secuencias textuales básicas, con especial atención a las expositivas y argumentativas."},{"letra":"—","texto":"Mecanismos de coherencia, cohesión y adecuación textual."},{"letra":"—","texto":"Géneros discursivos propios del ámbito personal: la conversación, con especial atención a los actos de habla que amenazan la imagen del interlocutor (la discrepancia, la queja, la orden, la reprobación)."},{"letra":"—","texto":"Géneros discursivos propios del ámbito profesional: el currículo vitae, la carta de motivación y la entrevista de trabajo."},{"letra":"—","texto":"Interacción oral y escrita de carácter informal y formal. Cooperación conversacional, cortesía lingüística y etiqueta digital. Escucha activa, asertividad y resolución dialogada de los conflictos. Estrategias discursivas y dialógicas para la expresión de ideas, la confrontación y el consenso."},{"letra":"—","texto":"Comprensión oral: sentido global del texto. Selección de la información relevante. La intención del emisor. Producción oral formal. Adecuación a la audiencia y al tiempo de exposición. Elementos no verbales. Rasgos discursivos y lingüísticos de la oralidad formal. La deliberación oral argumentada."},{"letra":"—","texto":"Comprensión lectora: sentido global del texto. La intención del emisor."},{"letra":"—","texto":"Producción escrita. Planificación, redacción, revisión y edición en diferentes soportes."},{"letra":"—","texto":"Corrección gramatical y ortográfica. Los signos de puntuación como mecanismo organizador del texto escrito. Su relación con el significado. Uso de diccionarios, manuales de consulta y correctores ortográficos en soporte digital."},{"letra":"—","texto":"Estrategias de construcción compartida de la interpretación de las obras. Discusiones o conversaciones literarias."},{"letra":"—","texto":"Construcción del sentido de la obra a partir del análisis de sus elementos formales y contextuales. Efectos de sus recursos expresivos en la recepción."},{"letra":"—","texto":"Estrategias de movilización de la experiencia personal, lectora y cultural para establecer vínculos de manera argumentada entre la obra leída y aspectos de la actualidad, así como con otros textos y manifestaciones artísticas."},{"letra":"—","texto":"Reflexión sobre la lengua."},{"letra":"—","texto":"Procedimientos de adquisición y formación de palabras. Reflexión sobre los cambios en su significado, las relaciones semánticas entre palabras y sus valores denotativos y connotativos en función del contexto y el propósito comunicativo."},{"letra":"—","texto":"Análisis de la diversidad lingüística del entorno. Biografía lingüística."}]},{"descripcion":"C. Comunicación en lengua extranjera.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Estrategias básicas para la planificación, ejecución, control y reparación de la comprensión, la producción y la coproducción de textos orales, escritos y multimodales."},{"letra":"—","texto":"Modelos contextuales y géneros discursivos comunes en la comprensión, producción y coproducción de textos orales, escritos y multimodales breves y sencillos tanto del ámbito personal como del ámbito profesional de especialización."},{"letra":"—","texto":"Patrones sonoros, acentuales, rítmicos y de entonación básicos, y significados e intenciones comunicativas generales asociadas a dichos patrones."},{"letra":"—","texto":"Herramientas analógicas y digitales básicas para la comprensión, producción y coproducción oral, escrita y multimodal; y plataformas virtuales de interacción y colaboración para el aprendizaje y la comunicación tanto en el ámbito personal como en el ámbito profesional de especialización."},{"letra":"—","texto":"Estrategias y técnicas para responder eficazmente a una necesidad comunicativa básica y concreta de forma comprensible, a pesar de las limitaciones derivadas del nivel de competencia en la lengua extranjera y en las demás lenguas del repertorio lingüístico propio."},{"letra":"—","texto":"Estrategias básicas para identificar, recuperar y utilizar unidades lingüísticas (léxico, morfosintaxis, patrones sonoros, etc.) a partir de la comparación de las lenguas y variedades que conforman el repertorio lingüístico personal."}]}]},{"cod":"3016","nombre":"Instalación y mantenimiento de redes para transmisión de datos","horasSem":"8","horasTotal":"267","ras":[{"descripcion":"Selecciona los elementos que configuran las redes para la transmisión de voz y datos, describiendo sus principales características y funcionalidad.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han identificado los tipos de instalaciones relacionados con las redes de transmisión de voz y datos."},{"letra":"b)","texto":"Se han identificado los elementos (canalizaciones, cableados, antenas, armarios, «racks» y cajas, entre otros) de una red de transmisión de datos."},{"letra":"c)","texto":"Se han clasificado los tipos de conductores (par de cobre, cable coaxial, fibra óptica, entre otros)."},{"letra":"d)","texto":"Se ha determinado la tipología de las diferentes cajas (registros, armarios, «racks», cajas de superficie, de empotrar, entre otros)."},{"letra":"e)","texto":"Se han descrito los tipos de fijaciones (tacos, bridas, tornillos, tuercas, grapas, entre otros) de canalizaciones y sistemas."},{"letra":"f)","texto":"Se han relacionado las fijaciones con el elemento a sujetar."}]},{"descripcion":"Monta canalizaciones, soportes y armarios en redes de transmisión de voz y datos, identificando los elementos en el plano de la instalación y aplicando técnicas de montaje.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han seleccionado las técnicas y herramientas empleadas para la instalación de canalizaciones y su adaptación."},{"letra":"b)","texto":"Se han tenido en cuenta las fases típicas para el montaje de un «rack»."},{"letra":"c)","texto":"Se han identificado en un croquis del edificio o parte del edificio los lugares de ubicación de los elementos de la instalación."},{"letra":"d)","texto":"Se ha preparado la ubicación de cajas y canalizaciones."},{"letra":"e)","texto":"Se han preparado y/o mecanizado las canalizaciones y cajas."},{"letra":"f)","texto":"Se han montado los armarios («racks») interpretando el plano."},{"letra":"g)","texto":"Se han montado canalizaciones, cajas y tubos, entre otros, asegurando su fijación mecánica."},{"letra":"h)","texto":"Se han aplicado normas de seguridad en el uso de herramientas y sistemas."}]},{"descripcion":"Despliega el cableado de una red de voz y datos analizando su trazado.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han diferenciado los medios de transmisión empleados para voz y datos."},{"letra":"b)","texto":"Se han reconocido los detalles del cableado de la instalación y su despliegue (categoría del cableado, espacios por los que discurre, soporte para las canalizaciones, entre otros)."},{"letra":"c)","texto":"Se han utilizado los tipos de guías pasacables, indicando la forma óptima de sujetar cables y guía."},{"letra":"d)","texto":"Se ha cortado y etiquetado el cable."},{"letra":"e)","texto":"Se han montado los armarios de comunicaciones y sus accesorios."},{"letra":"f)","texto":"Se han montado y conexionado las tomas de usuario y paneles de parcheo."},{"letra":"g)","texto":"Se ha trabajado con la calidad y seguridad requeridas."}]},{"descripcion":"Instala elementos y sistemas de transmisión de voz y datos, reconociendo y aplicando las diferentes técnicas de montaje.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han ensamblado los elementos que consten de varias piezas."},{"letra":"b)","texto":"Se han identificado el cableado en función de su etiquetado o colores."},{"letra":"c)","texto":"Se han colocado los sistemas o elementos (antenas, amplificadores, entre otros) en su lugar de ubicación."},{"letra":"d)","texto":"Se han seleccionado herramientas."},{"letra":"e)","texto":"Se han fijado los sistemas o elementos."},{"letra":"f)","texto":"Se ha conectado el cableado con los sistemas y elementos, asegurando un buen contacto."},{"letra":"g)","texto":"Se han colocado los embellecedores, tapas y elementos decorativos."},{"letra":"h)","texto":"Se han aplicado normas de seguridad, en el uso de herramientas y sistemas."}]},{"descripcion":"Realiza operaciones básicas de configuración en redes locales cableadas relacionándolas con sus aplicaciones.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han descrito los principios de funcionamiento de las redes locales."},{"letra":"b)","texto":"Se han identificado los distintos tipos de redes y sus estructuras alternativas."},{"letra":"c)","texto":"Se han reconocido los elementos de la red local identificándolos con su función."},{"letra":"d)","texto":"Se han descrito los medios de transmisión."},{"letra":"e)","texto":"Se ha interpretado el mapa físico de la red local."},{"letra":"f)","texto":"Se ha representado el mapa físico de la red local."},{"letra":"g)","texto":"Se han utilizado aplicaciones informáticas para representar el mapa físico de la red local."}]},{"descripcion":"Cumple las normas de prevención de riesgos laborales y de protección ambiental, identificando los riesgos asociados, las medidas y sistemas para prevenirlos.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han identificado los riesgos y el nivel de peligrosidad que suponen la manipulación de los materiales, herramientas, útiles, máquinas y medios de transporte."},{"letra":"b)","texto":"Se han operado las máquinas respetando las normas de seguridad."},{"letra":"c)","texto":"Se han identificado las causas más frecuentes de accidentes en la manipulación de materiales, herramientas, máquinas de corte y conformado, entre otras."},{"letra":"d)","texto":"Se han descrito los elementos de seguridad (protecciones, alarmas, pasos de emergencia, entre otros) de las máquinas y los sistemas de protección individual (calzado, protección ocular, indumentaria, entre otros) que se deben emplear en las operaciones de montaje y mantenimiento."},{"letra":"e)","texto":"Se ha relacionado la manipulación de materiales, herramientas y máquinas con las medidas de seguridad y protección personal requeridos."},{"letra":"f)","texto":"Se han identificado las posibles fuentes de contaminación del entorno ambiental."},{"letra":"g)","texto":"Se han clasificado los residuos generados para su retirada selectiva."},{"letra":"h)","texto":"Se ha valorado el orden y la limpieza de instalaciones y sistemas como primer factor de prevención de riesgos."}]}]},{"cod":"3030","nombre":"Operaciones auxiliares para la configuración y la explotación","horasSem":"10","horasTotal":"333","ras":[{"descripcion":"Configura equipos informáticos para su funcionamiento en un entorno monousuario, identificando la funcionalidad de la instalación.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han configurado los parámetros básicos de la instalación."},{"letra":"b)","texto":"Se han aplicado las preferencias en la configuración del entorno personal."},{"letra":"c)","texto":"Se han utilizado los elementos de la interfaz de usuario para preparar el entorno de trabajo."},{"letra":"d)","texto":"Se han reconocido los atributos y los permisos en el sistema de archivos y directorios."},{"letra":"e)","texto":"Se han identificado las funcionalidades para el manejo del sistema de archivos y periféricos"},{"letra":"f)","texto":"Se han utilizado las herramientas del sistema operativo para explorar los soportes de almacenamiento de datos."},{"letra":"g)","texto":"Se han realizado operaciones básicas de protección (instalación de antivirus, realización de copias de seguridad, entre otras)."}]},{"descripcion":"Configura equipos informáticos para su funcionamiento en un entorno de red, identificando los permisos del usuario.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han aplicado preferencias en la configuración del entorno personal."},{"letra":"b)","texto":"Se han configurado y gestionado cuentas de usuario."},{"letra":"c)","texto":"Se ha comprobado la conectividad del servidor con los equipos del cliente."},{"letra":"d)","texto":"Se han utilizado los servicios para compartir recurso."},{"letra":"e)","texto":"Se han asignado permisos a los recursos del sistema que se van a compartir."},{"letra":"f)","texto":"Se ha accedido a los recursos compartidos."},{"letra":"g)","texto":"Se han aplicado normas básicas de seguridad sobre recursos compartidos."}]},{"descripcion":"Utiliza aplicaciones de un paquete ofimático, relacionándolas con sus aplicaciones.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han descrito las funciones y características de un procesador de textos relacionándolas con los tipos de documentos a elaborar."},{"letra":"b)","texto":"Se han utilizado los procedimientos de creación, modificación y manipulación de documentos utilizando las herramientas del procesador de textos."},{"letra":"c)","texto":"Se ha formateado un texto mejorando su presentación utilizando distintos tipos de letras y alineaciones."},{"letra":"d)","texto":"Se han utilizado las funciones para guardar e imprimir documentos elaborados."},{"letra":"e)","texto":"Se han realizado operaciones básicas para el uso de aplicaciones ofimáticas de hoja de cálculo y base de datos, sobre documentos previamente elaborados."},{"letra":"f)","texto":"Se han identificado las funciones básicas una aplicación para presentaciones."},{"letra":"g)","texto":"Se han elaborado presentaciones multimedia aplicando normas básicas de composición y diseño."}]},{"descripcion":"Emplea utilidades proporcionadas por Internet, configurándolas e identificando su funcionalidad y restaciones.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han utilizado las herramientas para la navegación por páginas Web reconociendo la estructura de Internet."},{"letra":"b)","texto":"Se ha personalizado el navegador adecuándolo a las necesidades establecidas."},{"letra":"c)","texto":"Se ha transferido información utilizando los recursos de Internet para descargar, enviar y almacenar ficheros."},{"letra":"d)","texto":"Se han identificado los medios y procedimientos de seguridad durante el acceso a páginas web describiendo los riesgos y fraudes posibles."},{"letra":"e)","texto":"Se han descrito las funcionalidades que ofrecen las herramientas de correo electrónico."},{"letra":"f)","texto":"Se ha creado una cuenta de correo a través de un servidor web que proporcione el servicio."},{"letra":"g)","texto":"Se han utilizado otros servicios disponibles en Internet (foro, mensajería instantánea, redes p2p, videoconferencia; entre otros)."},{"letra":"h)","texto":"Se han configurado las opciones básicas de las aplicaciones."}]}]},{"cod":"3160","nombre":"Proyecto Intermodular de aprendizaje colaborativo","horasSem":"2","horasTotal":"67","ras":[{"descripcion":"Busca información en internet sobre empresas «tipo» del sector/es relacionados con los estándares (unidades) de competencia incluidos en el ámbito profesional del título, elaborando un mapa de las mismas y los servicios o productos que ofrecen.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se ha elaborado conjuntamente un esquema que contemple el conjunto de las empresas tipo del sector."},{"letra":"b)","texto":"Se han constituido equipos de trabajo y se han distribuido entre los grupos las empresas que se analizarán."},{"letra":"c)","texto":"Se ha identificado para la empresa seleccionada los productos o servicios que ofrece."},{"letra":"d)","texto":"Se han relacionado los productos o servicios ofertados con la consecución de los ODS (Objetivos de Desarrollo Sostenible)."},{"letra":"e)","texto":"Se ha realizado un diagrama de bloques de los posibles departamentos que conforman la empresa."},{"letra":"f)","texto":"Se han tenido en cuenta las áreas transversales y su relación con las demás."},{"letra":"g)","texto":"Se ha presentado al gran grupo la configuración de la empresa y productos que ofrece."},{"letra":"h)","texto":"Se ha hecho una valoración de los recursos necesarios para cada unidad."},{"letra":"i)","texto":"Se ha elaborado un informe en un formato establecido con la información recabada, indicando al menos: el sector en el que se encuadra, los principales países donde opera, y las áreas de las que se compone."}]},{"descripcion":"Selecciona un servicio o producto de una empresa del sector relacionándolo con su contribución a los ODS y sus destinatarios a nivel global.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se ha seleccionado un producto/servicio de la empresa a estudio."},{"letra":"b)","texto":"Se ha discutido en grupo con qué ODS pueda estar relacionado."},{"letra":"c)","texto":"Se han identificado las características del público objetivo al que está destinado."},{"letra":"d)","texto":"Se ha comparado el producto con otros de empresas similares."},{"letra":"e)","texto":"Se ha desarrollado una propuesta innovadora para potenciar el producto o servicio."}]},{"descripcion":"Hace una propuesta de una empresa tipo «spin off» indicando los aspectos diferenciales con la empresa de referencia y elaborando un dossier con sus características.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se ha planteado en el grupo el concepto de una empresa tipo «spin off», indicando sus ventajas e inconvenientes."},{"letra":"b)","texto":"Se ha discutido en grupo con qué ODS pueda estar relacionado."},{"letra":"c)","texto":"Se ha propuesto una posible organización de la empresa, atendiendo a una estructura lineal o circular."},{"letra":"d)","texto":"Se han indicado que tecnologías se incluirían para aumentar su competitividad."},{"letra":"e)","texto":"Se han propuesto aspectos innovadores sobre algún producto de la empresa de referencia."}]},{"descripcion":"Relaciona cada unidad de una empresa tipo con la prevención de riesgos profesionales identificando los equipos/sistemas de protección generales y los propios de cada actividad.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se ha analizado la responsabilidad de la empresa y los trabajadores en la consecución de entornos de trabajo seguros."},{"letra":"b)","texto":"Se han identificado los sistemas de protección generales e individuales de cada unidad en función de las actividades a realizar."},{"letra":"c)","texto":"Se ha estimado el coste de los elementos de protección individual."},{"letra":"d)","texto":"Se han propuesto posibles elementos de mejora en relación con la seguridad."}]},{"descripcion":"Transmite información con claridad de manera ordenada y estructurada.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se ha mantenido una actitud ordenada y metódica en la transmisión de la información."},{"letra":"b)","texto":"Se ha transmitido información verbal tanto horizontal como verticalmente."},{"letra":"c)","texto":"Se ha transmitido información entre los miembros del grupo utilizando medios informáticos."},{"letra":"d)","texto":"Se han conocido los términos técnicos en otras lenguas que sean estándares del sector."}]}]},{"cod":"A999","nombre":"Tutoría II","horasSem":"2","horasTotal":"67","ras":[]}]}]},"IFC201":{"codigo":"IFC201","nombre":"Sistemas Microinformáticos y Redes","categoria":"Ciclo Formativo de Grado Medio","cursos":[{"cursoNombre":"Curso 1º","modulos":[{"cod":"0223","nombre":"Aplicaciones ofimáticas","horasSem":"6","horasTotal":"200","ras":[{"descripcion":"Instala y actualiza aplicaciones ofimáticas, interpretando especificaciones y describiendo los pasos a seguir en el proceso.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han identificado y establecido las fases del proceso de instalación."},{"letra":"b)","texto":"Se han respetado las especificaciones técnicas del proceso de instalación."},{"letra":"c)","texto":"Se han configurado las aplicaciones según los criterios establecidos."},{"letra":"d)","texto":"Se han documentado las incidencias."},{"letra":"e)","texto":"Se han solucionado problemas en la instalación o integración con el sistema informático."},{"letra":"f)","texto":"Se han eliminado y/o añadido componentes de la instalación en el equipo."},{"letra":"g)","texto":"Se han actualizado las aplicaciones."},{"letra":"h)","texto":"Se han respetado las licencias software."},{"letra":"i)","texto":"Se han propuesto soluciones software para entornos de aplicación."}]},{"descripcion":"Elabora documentos y plantillas, describiendo y aplicando las opciones avanzadas de procesadores de textos.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se ha personalizado las opciones de software y barra de herramientas."},{"letra":"b)","texto":"Se han diseñado plantillas."},{"letra":"c)","texto":"Se han utilizado aplicaciones y periféricos para introducir textos e imágenes."},{"letra":"d)","texto":"Se han importado y exportado documentos creados con otras aplicaciones y en otros formatos."},{"letra":"e)","texto":"Se han creado y utilizado macros en la realización de documentos."},{"letra":"f)","texto":"Se han elaborado manuales específicos."}]},{"descripcion":"Elabora documentos y plantillas de cálculo, describiendo y aplicando opciones avanzadas de hojas de cálculo.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se ha personalizado las opciones de software y barra de herramientas."},{"letra":"b)","texto":"Se han utilizado los diversos tipos de datos y referencia para celdas, rangos, hojas y libros."},{"letra":"c)","texto":"Se han aplicado fórmulas y funciones."},{"letra":"d)","texto":"Se han generado y modificado gráficos de diferentes tipos."},{"letra":"e)","texto":"Se han empleado macros para la realización de documentos y plantillas."},{"letra":"f)","texto":"Se han importado y exportado hojas de cálculo creadas con otras aplicaciones y en otros formatos."},{"letra":"g)","texto":"Se ha utilizado la hoja de cálculo como base de datos: formularios, creación de listas, filtrado, protección y ordenación de datos."},{"letra":"h)","texto":"Se han utilizado aplicaciones y periféricos para introducir textos, números, códigos e imágenes."}]},{"descripcion":"Elabora documentos con bases de datos ofimáticas describiendo y aplicando operaciones de manipulación de datos.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han identificado los elementos de las bases de datos relacionales."},{"letra":"b)","texto":"Se han creado bases de datos ofimáticas."},{"letra":"c)","texto":"Se han utilizado las tablas de la base de datos (insertar, modificar y eliminar registros)."},{"letra":"d)","texto":"Se han utilizado asistentes en la creación de consultas."},{"letra":"e)","texto":"Se han utilizado asistentes en la creación de formularios."},{"letra":"f)","texto":"Se han utilizado asistentes en la creación de informes."},{"letra":"g)","texto":"Se ha realizado búsqueda y filtrado sobre la información almacenada."},{"letra":"h)","texto":"Se han creado y utilizado macros."}]},{"descripcion":"Manipula imágenes digitales analizando las posibilidades de distintos programas y aplicando técnicas de captura y edición básicas.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han analizado los distintos formatos de imágenes."},{"letra":"b)","texto":"Se ha realizado la adquisición de imágenes con periféricos."},{"letra":"c)","texto":"Se ha trabajado con imágenes a diferentes resoluciones, según su finalidad."},{"letra":"d)","texto":"Se han empleado herramientas para la edición de imagen digital."},{"letra":"e)","texto":"Se han importado y exportado imágenes en diversos formatos."}]},{"descripcion":"Manipula secuencias de vídeo analizando las posibilidades de distintos programas y aplicando técnicas de captura y edición básicas.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han reconocido los elementos que componen una secuencia de vídeo."},{"letra":"b)","texto":"Se han estudiado los tipos de formatos y codecs más empleados."},{"letra":"c)","texto":"Se han importado y exportado secuencias de vídeo."},{"letra":"d)","texto":"Se han capturado secuencias de vídeo con recursos adecuados."},{"letra":"e)","texto":"Se han elaborado vídeo tutoriales."}]},{"descripcion":"Elabora presentaciones multimedia describiendo y aplicando normas básicas de composición y diseño.","etiqueta":"(RA7)","ces":[{"letra":"a)","texto":"Se han identificado las opciones básicas de las aplicaciones de presentaciones."},{"letra":"b)","texto":"Se han reconocido los distintos tipos de vista asociados a una presentación."},{"letra":"c)","texto":"Se han aplicado y reconocido las distintas tipografías y normas básicas de composición, diseño y utilización del color."},{"letra":"d)","texto":"Se han diseñado plantillas de presentaciones."},{"letra":"e)","texto":"Se han creado presentaciones."},{"letra":"f)","texto":"Se han utilizado periféricos para ejecutar presentaciones."}]},{"descripcion":"Realiza operaciones de gestión del correo y la agenda electrónica, relacionando necesidades de uso con su configuración.","etiqueta":"(RA8)","ces":[{"letra":"a)","texto":"Se han descrito los elementos que componen un correo electrónico."},{"letra":"b)","texto":"Se han analizado las necesidades básicas de gestión de correo y agenda electrónica."},{"letra":"c)","texto":"Se han configurado distintos tipos de cuentas de correo electrónico."},{"letra":"d)","texto":"Se han conectado y sincronizado agendas del equipo informático con dispositivos móviles."},{"letra":"e)","texto":"Se ha operado con la libreta de direcciones."},{"letra":"f)","texto":"Se ha trabajado con todas las opciones de gestión de correo electrónico (etiquetas, filtros, carpetas, entre otros)."},{"letra":"g)","texto":"Se han utilizado opciones de agenda electrónica."}]},{"descripcion":"Aplica técnicas de soporte en el uso de aplicaciones, identificando y resolviendo incidencias.","etiqueta":"(RA9)","ces":[{"letra":"a)","texto":"Se han elaborado guías visuales con los conceptos básicos de uso de una aplicación."},{"letra":"b)","texto":"Se han identificado problemas relacionados con el uso de aplicaciones ofimáticas."},{"letra":"c)","texto":"Se han utilizado manuales de usuario para instruir en el uso de aplicaciones."},{"letra":"d)","texto":"Se han aplicado técnicas de asesoramiento en el uso de aplicaciones."},{"letra":"e)","texto":"Se han realizado informes de incidencias."},{"letra":"f)","texto":"Se han aplicado los procedimientos necesarios para salvaguardar la información y su recuperación."},{"letra":"g)","texto":"Se han utilizado los recursos disponibles (documentación técnica, ayudas en línea, soporte técnico, entre otros) para solventar incidencias."},{"letra":"h)","texto":"Se han solventando las incidencias en el tiempo adecuado y con el nivel de calidad esperado."}]}]},{"cod":"1664","nombre":"Digitalización aplicada a los sectores productivos (GM)","horasSem":"1","horasTotal":"33","ras":[{"descripcion":"Establece las diferencias entre la Economía Lineal (EL) y la Economía Circular (EC), identificando las ventajas de la EC en relación con el medioambiente y el desarrollo sostenible.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han identificado las etapas «típicas» de los modelos basados en EL y modelos basados en EC."},{"letra":"b)","texto":"Se ha analizado cada etapa de los modelos EL y EC y su repercusión en el medio ambiente."},{"letra":"c)","texto":"Se ha valorado la importancia del reciclaje en los modelos económicos."},{"letra":"d)","texto":"Se han identificado procesos reales basados en EL."},{"letra":"e)","texto":"Se han identificado procesos reales basados en EC."},{"letra":"f)","texto":"Se han comparado los modelos anteriores en relación con su impacto medioambiental y los ODS (Objetivos de Desarrollo Sostenible)."}]},{"descripcion":"Caracteriza los principales aspectos de la 4.ª Revolución Industrial indicando los cambios y las ventajas que se producen tanto desde el punto de vista de los clientes como de las empresas.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han relacionado los sistemas ciber físicos con la evolución industrial."},{"letra":"b)","texto":"Se ha analizado el cambio producido en los sistemas automatizados."},{"letra":"c)","texto":"Se ha descrito la combinación de la parte física de las industrias con el software, IoT (Internet de las cosas), comunicaciones, entre otros."},{"letra":"d)","texto":"Se ha descrito la interrelación entre el mundo físico y el virtual."},{"letra":"e)","texto":"Se ha relacionado la migración a entornos 4.0 con la mejora de los resultados de las empresas."},{"letra":"f)","texto":"Se han identificado las ventajas para clientes y empresas."}]},{"descripcion":"Identifica la estructura de los sistemas basados en cloud/nube describiendo su tipología y campo de aplicación.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han identificado los diferentes niveles de la cloud/nube."},{"letra":"b)","texto":"Se han identificado las principales funciones de la cloud/nube (procesamiento de datos, intercambio de información, ejecución de aplicaciones, entre otros)."},{"letra":"c)","texto":"Se ha descrito el concepto de edge computing y su relación con la cloud/nube."},{"letra":"d)","texto":"Se han definido los conceptos de fog y mist y sus zonas de aplicación en el conjunto."},{"letra":"e)","texto":"Se han identificado las ventajas que proporciona la utilización de la cloud/nube en los sistemas conectados."}]},{"descripcion":"Compara los sistemas de producción/prestación de servicios digitalizados con los sistemas clásicos identificando las mejoras introducidas.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han identificado las tecnologías habilitadoras (THD) actuales que definen un sistema digitalizado."},{"letra":"b)","texto":"Se han descrito las características y aplicaciones del IoT, IA (Inteligencia Artificial), Big Data, tecnología 5G, la robótica colaborativa, Blockchain, Ciberseguridad, fabricación aditiva, realidad virtual, gemelos digitales, entre otras."},{"letra":"c)","texto":"Se ha descrito la contribución de las THD a la mejora de la productividad y la eficiencia de los sistemas productivos o de prestación de servicios."},{"letra":"d)","texto":"Se ha relacionado la alineación entre las unidades funcionales de las empresas que conforman el sistema y el objetivo del mismo."},{"letra":"e)","texto":"Se ha relacionado la implantación de las tecnologías habilitadoras (sensórica, tratamiento de datos, automatización y comunicaciones, entre otras) con la reducción de costes y la mejora de la competitividad."},{"letra":"f)","texto":"Se han relacionado las tecnologías disruptivas con aplicaciones concretas en los sectores productivos."},{"letra":"g)","texto":"Se han definido los sistemas de almacenamiento de datos no convencionales y el acceso a los mismos desde cada unidad."},{"letra":"h)","texto":"Se han descrito las mejoras producidas en el sistema y en cada una de sus etapas."}]},{"descripcion":"Elabora un plan de transformación de una empresa clásica del sector en el que se enmarca el título, basada en una EL, al concepto 4.0, determinando los cambios a introducir en las principales fases del sistema e indicando como afectaría a los recursos humanos.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se ha definido a nivel de bloques el diagrama de funcionamiento de la empresa clásica."},{"letra":"b)","texto":"Se han identificado las etapas susceptibles de ser digitalizadas."},{"letra":"c)","texto":"Se han definido las tecnologías implicadas en cada una de las etapas."},{"letra":"d)","texto":"Se ha establecido la conexión de las etapas digitalizadas con el resto del sistema."},{"letra":"e)","texto":"Se ha elaborado un diagrama de bloques del sistema digitalizado."},{"letra":"f)","texto":"Se ha elaborado un informe de viabilidad y de las mejoras introducidas."},{"letra":"g)","texto":"Se ha analizado la mejora en la producción y gestión de residuos, entre otras."},{"letra":"h)","texto":"Se ha elaborado un documento con la secuencia del plan de transformación y los recursos empleados."}]}]},{"cod":"0156","nombre":"Inglés Profesional (GM)","horasSem":"2","horasTotal":"67","ras":[{"descripcion":"Comprende información, de índole profesional y cotidiana, contenida en discursos orales sencillos, emitidos en lengua estándar, descifrando el contenido global del mensaje, y relacionándolo con los recursos lingüísticos correspondientes.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se ha situado el mensaje en su contexto por medio del análisis de sus características textuales y contextuales."},{"letra":"b)","texto":"Se ha identificado el hilo argumental de mensajes orales y determinado los roles que aparecen en los mismos."},{"letra":"c)","texto":"Se ha reconocido la finalidad del mensaje, ya se trate de un mensaje directo, telefónico o en cualquier otro medio auditivo."},{"letra":"d)","texto":"Se ha extraído información específica contenida en discursos orales, en lengua estándar, relacionados con la vida social, profesional o académica."},{"letra":"e)","texto":"Se han secuenciado los elementos constituyentes del mensaje."},{"letra":"f)","texto":"Se han identificado y resumido con claridad las ideas principales de un discurso sobre temas conocidos, transmitido por los medios de comunicación y emitido en lengua estándar."},{"letra":"g)","texto":"Se han reconocido las instrucciones orales y se han seguido las indicaciones siendo capaz de concluir si precisan de una respuesta verbal o de una no verbal."},{"letra":"h)","texto":"Se ha tomado conciencia de la importancia de comprender globalmente un mensaje, sin necesidad de entender todos y cada uno de los elementos del mismo."},{"letra":"i)","texto":"Se ha servido del análisis de la entonación y de los elementos visuales para identificar los diversos significados e intenciones comunicativas del emisor."}]},{"descripcion":"Comprende información profesional contenida en textos escritos sencillos, analizando de forma comprensiva su contenido.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han seleccionado los materiales de consulta y diccionarios técnicos. para la comprensión del texto."},{"letra":"b)","texto":"Se han leído de forma comprensiva textos claros en lengua estándar."},{"letra":"c)","texto":"Se ha relacionado el texto con el ámbito del sector a que se refiere."},{"letra":"d)","texto":"Se han reconocido las ideas principales de un texto escrito identificando la información relevante, sin necesidad de entender todos y cada uno de los elementos de dicho texto."},{"letra":"e)","texto":"Se ha identificado la terminología utilizada, así como las estructuras gramaticales y demás elementos característicos de cada tipología discursiva."},{"letra":"f)","texto":"Se han realizado traducciones de textos en lengua estándar utilizando material de apoyo en caso necesario."},{"letra":"g)","texto":"Se ha interpretado el mensaje recibido a través de soportes telemáticos o cualquier otro tipo de soporte."},{"letra":"h)","texto":"Se ha reconocido la finalidad de distintos textos escritos en cualquier soporte, en lengua estándar y relacionados con la actividad profesional."},{"letra":"i)","texto":"Se ha extraído información específica de textos de diferente naturaleza, relativos a su profesión y contenidos en distintos soportes."}]},{"descripcion":"Produce mensajes orales sencillos, claros y estructurados, participando como agente activo en conversaciones profesionales.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han determinado los registros más adecuados para la emisión del mensaje."},{"letra":"b)","texto":"Se ha comunicado utilizando fórmulas, nexos de unión, marcadores discursivos y estrategias de interacción acordes a la situación de comunicación."},{"letra":"c)","texto":"Se han descrito hechos breves e imprevistos relacionados con su profesión."},{"letra":"d)","texto":"Se ha utilizado correctamente la terminología de la profesión."},{"letra":"e)","texto":"Se han expresado sentimientos, ideas u opiniones."},{"letra":"f)","texto":"Se han enumerado las actividades propias de la tarea profesional."},{"letra":"g)","texto":"Se ha descrito y secuenciado un proceso de trabajo de su competencia."},{"letra":"h)","texto":"Se ha justificado la aceptación o no de propuestas realizadas haciendo uso de normas de cortesía y de modales apropiados."},{"letra":"i)","texto":"Se ha intercambiado, con relativa fluidez, información específica y detallada utilizando frases de estructura sencilla y diferentes soportes telemáticos."},{"letra":"j)","texto":"Se han realizado, de manera clara, presentaciones breves y preparadas sobre un tema dentro de su especialidad, haciendo uso de los protocolos adecuados."},{"letra":"k)","texto":"Se ha comunicado espontáneamente adoptando un nivel de formalidad adecuado a las circunstancias."},{"letra":"l)","texto":"Se han respondido preguntas relativas a su vida socio-profesional, incluidas las propias de una entrevista de trabajo."},{"letra":"m)","texto":"Se ha solicitado la reformulación del discurso o la aclaración de parte del mismo cuando se ha considerado necesario para una mejor comprensión."}]},{"descripcion":"Redacta textos sencillos en lengua estándar, relacionando las reglas gramaticales con la finalidad de los mismos.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han seleccionado las estrategias, estructuras, vocabulario y convenciones más adecuadas para el tipo de texto que se va a crear (fax, nota, carta o correo electrónico, entre otros)."},{"letra":"b)","texto":"Se han redactado textos breves relacionados con aspectos cotidianos y/o profesionales."},{"letra":"c)","texto":"Se ha organizado la información de manera coherente y cohesionada."},{"letra":"d)","texto":"Se han realizado resúmenes de textos relacionados con su entorno profesional, identificando las ideas principales de los mismos."},{"letra":"e)","texto":"Se ha cumplimentado documentación específica de su campo profesional, aplicando las fórmulas establecidas y el vocabulario específico."},{"letra":"f)","texto":"Se ha cumplimentado un texto dado con apoyos visuales y claves lingüísticas aportadas."},{"letra":"g)","texto":"Se han utilizado las fórmulas de cortesía propias del documento que se va a elaborar."},{"letra":"h)","texto":"Se ha escrito correspondencia formal básica en formato físico o digital destinada principalmente a pedir información, solicitar un servicio o llevar a cabo una reclamación u otra gestión sencilla, siempre atendiendo a las convenciones de la tipología textual."},{"letra":"i)","texto":"Se han tomado notas, y mensajes, con información sencilla sobre aspectos propios de su labor profesional."},{"letra":"j)","texto":"Se ha solicitado, de forma escrita, información referente a aspectos relacionados con su campo profesional (página web y correo electrónico, entre otros)."}]},{"descripcion":"Aplica actitudes y comportamientos profesionales en situaciones de comunicación, describiendo las relaciones típicas características del país de la lengua extranjera.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han definido los rasgos más significativos de las costumbres y usos de la comunidad donde se habla la lengua extranjera."},{"letra":"b)","texto":"Se han descrito los protocolos y normas de relación social propios del país."},{"letra":"c)","texto":"Se han identificado los valores y creencias propios de la comunidad donde se habla la lengua extranjera."},{"letra":"d)","texto":"Se han identificado los aspectos socio-profesionales propios del sector, en cualquier tipo de texto."},{"letra":"e)","texto":"Se han aplicado los protocolos y normas de relación social propios del país de la lengua extranjera."}]}]},{"cod":"1709","nombre":"Itinerario personal para la empleabilidad I","horasSem":"3","horasTotal":"100","ras":[{"descripcion":"Distingue las características del sector productivo y define los puestos de trabajo relacionándolos con las competencias profesionales expresadas en el título.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han analizado las principales oportunidades de empleo y de inserción laboral en el sector profesional, identificando las posibilidades de empleo y analizado sus requerimientos actuales para el perfil profesional."},{"letra":"b)","texto":"Se ha comparado los diferentes requerimientos exigidos por el mercado laboral con las exigencias para el trabajo en la función pública relacionados con el sector privado."},{"letra":"c)","texto":"Se ha reflexionado sobre las actitudes y aptitudes requeridas actualmente para la actividad profesional relacionadas con el título, así como las competencias personales y sociales más relevantes para el sector identificando nuestra zona de desarrollo próximo."}]},{"descripcion":"Adquiere las competencias necesarias para el desempeño de las funciones de nivel básico en Prevención de Riesgos Laborales.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se ha valorado la importancia de la cultura preventiva en todos los ámbitos actividades de la empresa u organismo equiparado relacionado las condiciones laborales con la salud de la persona trabajadora identificando y clasificando los factores de riesgo en la actividad y los daños derivados de los mismos, especialmente las situaciones de riesgo más habituales en los entornos de trabajo del sector profesional relacionado con el título."},{"letra":"b)","texto":"Se han clasificado y descrito los tipos de daños profesionales, con especial referencia a accidentes de trabajo y enfermedades profesionales, relacionados con el perfil profesional del título."},{"letra":"c)","texto":"Se ha determinado la evaluación de riesgos en la empresa u organismo equiparado y definido las técnicas de prevención y de protección que deben aplicarse para evitar los daños en su origen y minimizar sus consecuencias."},{"letra":"d)","texto":"Se han analizado los protocolos de actuación en caso de emergencia."},{"letra":"e)","texto":"Se han determinado los principales derechos y deberes en materia de prevención de riesgos laborales."},{"letra":"f)","texto":"Se han clasificado las distintas formas de gestión de la prevención en la empresa u organismo equiparado, en función de los distintos criterios establecidos en la normativa sobre prevención de riesgos laborales y determinado las formas de representación de las personas trabajadoras en la empresa u organismo equiparado en materia de prevención de riesgos."},{"letra":"g)","texto":"Se ha valorado la importancia de la existencia de un plan preventivo en la empresa u organismo equiparado que incluya la secuenciación de actuaciones a realizar en caso de emergencia y reflexionado sobre el contenido del mismo."},{"letra":"h)","texto":"Se han determinado los requisitos y condiciones para la vigilancia de la salud de la persona trabajadora y su importancia como medida de prevención."},{"letra":"i)","texto":"Se han identificado las técnicas básicas de primeros auxilios que han de ser aplicadas en el lugar del accidente ante distintos tipos de daños y la composición y uso del botiquín."}]},{"descripcion":"Analiza sus condiciones laborales como persona trabajadora por cuenta ajena identificándolas en los principales tipos de cambios y vicisitudes relevantes que se pueden presentar en la relación laboral en la normativa laboral y especialmente en e

l convenio colectivo del sector.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han analizado los derechos y obligaciones derivados de la relación laboral, así como las condiciones de trabajo pactadas en un convenio colectivo aplicable al sector profesional relacionado con el título."},{"letra":"b)","texto":"Se han comparado las principales modalidades de contratación, localizando los diferentes modelos en las fuentes oficiales."},{"letra":"c)","texto":"Se han identificado las características definitorias de los nuevos entornos de organización del trabajo y los derechos que conlleva."},{"letra":"d)","texto":"Se han identificado los diferentes componentes del recibo de salario."},{"letra":"e)","texto":"Se han identificado los recursos laborales existentes ante las diferentes vicisitudes que se pueden dar en la relación laboral."},{"letra":"f)","texto":"Se ha valorado el papel de la Seguridad Social como pilar esencial para la mejora de la calidad de vida de los ciudadanos."},{"letra":"g)","texto":"Se han analizado las principales prestaciones derivadas de la suspensión y extinción de la relación laboral."}]},{"descripcion":"Analiza y evalúa su potencial profesional y sus intereses para guiarse en el proceso de autoorientación y elabora una hoja de ruta para la inserción profesional en base al análisis de las competencias, intereses y destrezas personales.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han evaluado los propios intereses, motivaciones, habilidades y destrezas en el marco de un proceso de autoconocimiento."},{"letra":"b)","texto":"Se han analizado las cualidades y competencias personales afines a la actividad profesional relacionada con el perfil del título."},{"letra":"c)","texto":"Se han determinado las competencias personales y sociales con valor para el empleo."},{"letra":"d)","texto":"Se han señalado las preferencias profesionales, intereses y metas en el marco de un proyecto profesional."},{"letra":"e)","texto":"Se ha valorado el concepto de autoestima en el proceso de búsqueda de empleo."},{"letra":"f)","texto":"Se han identificado las fortalezas, debilidades, amenazas y oportunidades propias para la inserción profesional."},{"letra":"g)","texto":"Se han identificado expectativas de futuro para inserción profesional analizando competencias, intereses y destrezas personales."},{"letra":"h)","texto":"Se han valorado hitos importantes en la trayectoria vital con valor profesionalizador."},{"letra":"i)","texto":"Se han identificado los itinerarios formativos profesionales relacionados con el perfil profesional."},{"letra":"j)","texto":"Se han formulado objetivos profesionales y se ha determinado metas personales y profesionales para la mejora de la empleabilidad y las condiciones de inserción laboral."},{"letra":"k)","texto":"Se ha trazado un plan de acción para desarrollar las áreas de mejora y potenciar las fortalezas personales con valor para el empleo."}]},{"descripcion":"Aplica las estrategias para el aprendizaje autónomo reconociendo su valor profesionalizador, diseñando y optimizando su propio entorno de aprendizaje haciendo uso de las tecnologías digitales como herramientas de aprendizaje autónomo, siendo coherente con su identidad digital y sus propios objetivos profesionales planteados en su plan de desarrollo individual.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se ha tomado conciencia de la responsabilidad individual en el desarrollo profesional valorando la actitud de aprendizaje permanente para el desarrollo de propias y nuevas competencias."},{"letra":"b)","texto":"Se ha identificado la empleabilidad como capacidad de adaptación al entorno laboral."},{"letra":"c)","texto":"Se han conocido y utilizado herramientas, fuentes de información, conexiones y actividades para la configuración de un entorno personal de aprendizaje para la empleabilidad."},{"letra":"d)","texto":"Se ha puesto en práctica la competencia digital para configurar un entorno personal de aprendizaje para la empleabilidad."},{"letra":"e)","texto":"Se ha analizado el concepto de identidad digital y su impacto en la empleabilidad."},{"letra":"f)","texto":"Se ha justificado el diseño de su entorno de aprendizaje basado en cómo este mejora la empleabilidad."},{"letra":"g)","texto":"Se ha elaborado su plan de desarrollo individual como herramienta para la mejora de la empleabilidad."},{"letra":"h)","texto":"Se han aplicado las herramientas de aprendizaje autónomo para su desarrollo personal y profesional."},{"letra":"i)","texto":"Se ha diseñado el entorno de aprendizaje que permite alcanzar el plan de desarrollo individual."}]}]},{"cod":"0221","nombre":"Montaje y mantenimiento de equipos informáticos","horasSem":"6","horasTotal":"200","ras":[{"descripcion":"Selecciona los componentes de integración de un equipo microinformático estándar, describiendo sus funciones y comparando prestaciones de distintos fabricantes.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han descrito los bloques que componen un equipo microinformático y sus funciones."},{"letra":"b)","texto":"Se ha reconocido la arquitectura de buses."},{"letra":"c)","texto":"Se han descrito las características de los tipos de microprocesadores (frecuencia, tensiones, potencia, zócalos, entre otros)."},{"letra":"d)","texto":"Se ha descrito la función de los disipadores y ventiladores."},{"letra":"e)","texto":"Se han descrito las características y utilidades más importantes de la configuración de la placa base."},{"letra":"f)","texto":"Se han evaluado tipos de chasis para la placa base y el resto de componentes."},{"letra":"g)","texto":"Se han identificado y manipulado los componentes básicos (módulos de memoria, discos fijos y sus controladoras, soportes de memorias auxiliares, entre otros)."},{"letra":"h)","texto":"Se ha analizado la función del adaptador gráfico y el monitor."},{"letra":"i)","texto":"Se han identificado y manipulado distintos adaptadores (gráficos, LAN, modems, entre otros)."},{"letra":"j)","texto":"Se han identificado los elementos que acompañan a un componente de integración (documentación, controladores, cables y utilidades, entre otros)."}]},{"descripcion":"Ensambla un equipo microinformático, interpretando planos e instrucciones del fabricante aplicando técnicas de montaje.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han seleccionado las herramientas y útiles necesarios para el ensamblado de equipos microinformáticos."},{"letra":"b)","texto":"Se ha interpretado la documentación técnica de todos los componentes a ensamblar."},{"letra":"c)","texto":"Se ha determinado el sistema de apertura / cierre del chasis y los distintos sistemas de fijación para ensamblar-desensamblar los elementos del equipo."},{"letra":"d)","texto":"Se han ensamblado diferentes conjuntos de placa base, microprocesador y elementos de refrigeración en diferentes modelos de chasis, según las especificaciones dadas."},{"letra":"e)","texto":"Se han ensamblado los módulos de memoria RAM, los discos fijos, las unidades de lectura / grabación en soportes de memoria auxiliar y otros componentes."},{"letra":"f)","texto":"Se han configurado parámetros básicos del conjunto accediendo a la configuración de la placa base."},{"letra":"g)","texto":"Se han ejecutado utilidades de chequeo y diagnóstico para verificar las prestaciones del conjunto ensamblado."},{"letra":"h)","texto":"Se ha realizado un informe de montaje."}]},{"descripcion":"Mide parámetros eléctricos, identificando el tipo de señal y relacionándola con sus unidades características.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se ha identificado el tipo de señal a medir con el aparato correspondiente."},{"letra":"b)","texto":"Se ha seleccionado la magnitud, el rango de medida y se ha conectado el aparato según la magnitud a medir."},{"letra":"c)","texto":"Se ha relacionado la medida obtenida con los valores típicos."},{"letra":"d)","texto":"Se han identificado los bloques de una fuente de alimentación (F.A.) para un ordenador personal."},{"letra":"e)","texto":"Se han enumerado las tensiones proporcionadas por una F.A. típica."},{"letra":"f)","texto":"Se han medido las tensiones en F.A. típicas de ordenadores personales."},{"letra":"g)","texto":"Se han identificado los bloques de un sistema de alimentación ininterrumpida."},{"letra":"h)","texto":"Se han medido las señales en los puntos significativos de un SAI."}]},{"descripcion":"Mantiene equipos informáticos interpretando las recomendaciones de los fabricantes y relacionando las disfunciones con sus causas.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han reconocido las señales acústicas y/o visuales que avisan de problemas en el hardware de un equipo."},{"letra":"b)","texto":"Se han identificado y solventado las averías producidas por sobrecalentamiento del microprocesador."},{"letra":"c)","texto":"Se han identificado y solventado averías típicas de un equipo microinformático (mala conexión de componentes, incompatibilidades, problemas en discos fijos, suciedad, entre otras)."},{"letra":"d)","texto":"Se han sustituido componentes deteriorados."},{"letra":"e)","texto":"Se ha verificado la compatibilidad de los componentes sustituidos."},{"letra":"f)","texto":"Se han realizado actualizaciones y ampliaciones de componentes."},{"letra":"g)","texto":"Se han elaborado informes de avería (reparación o ampliación)."}]},{"descripcion":"Instala software en un equipo informático utilizando una imagen almacenada en un soporte de memoria y justificando el procedimiento a seguir.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se ha reconocido la diferencia entre una instalación estándar y una preinstalación de software."},{"letra":"b)","texto":"Se han identificado y probado las distintas secuencias de arranque configurables en la placa base."},{"letra":"c)","texto":"Se han inicializado equipos desde distintos soportes de memoria auxiliar."},{"letra":"d)","texto":"Se han realizado imágenes de una preinstalación de software."},{"letra":"e)","texto":"Se han restaurado imágenes sobre el disco fijo desde distintos soportes."},{"letra":"f)","texto":"Se han descrito las utilidades para la creación de imágenes de partición/disco."}]},{"descripcion":"Reconoce nuevas tendencias en el ensamblaje de equipos microinformáticos describiendo sus ventajas y adaptándolas a las características de uso de los equipos.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han reconocido las nuevas posibilidades para dar forma al conjunto chasis-placa base."},{"letra":"b)","texto":"Se han descrito las prestaciones y características de algunas de las plataformas semiensambladas («barebones») más representativas del momento."},{"letra":"c)","texto":"Se han descrito las características de los ordenadores de entretenimiento multimedia (HTPC), los chasis y componentes específicos empleados en su ensamblado."},{"letra":"d)","texto":"Se han descrito las características diferenciales que demandan los equipos informáticos empleados en otros campos de aplicación específicos."},{"letra":"e)","texto":"Se ha evaluado la presencia de la informática móvil como mercado emergente, con una alta demanda en equipos y dispositivos con características específicas: móviles, PDA, navegadores, entre otros."},{"letra":"f)","texto":"Se ha evaluado la presencia del «modding» como corriente alternativa al ensamblado de equipos microinformáticos."}]},{"descripcion":"Mantiene periféricos, interpretando las recomendaciones de los fabricantes de equipos y relacionando disfunciones con sus causas.","etiqueta":"(RA7)","ces":[{"letra":"a)","texto":"Se han identificado y solucionado problemas mecánicos en periféricos de impresión estándar."},{"letra":"b)","texto":"Se han sustituido consumibles en periféricos de impresión estándar."},{"letra":"c)","texto":"Se han identificado y solucionado problemas mecánicos en periféricos de entrada."},{"letra":"d)","texto":"Se han asociado las características y prestaciones de los periféricos de captura de imágenes )","ces":[{"letra":"a)","texto":"Se ha establecido la utilidad de las aplicaciones de ofimática web."},{"letra":"b)","texto":"Se han descrito diferentes aplicaciones de ofimática web (procesador de textos, hoja de cálculo, entre otras)."},{"letra":"c)","texto":"Se han instalado aplicaciones de ofimática web."},{"letra":"d)","texto":"Se han gestionado las cuentas de usuario."},{"letra":"e)","texto":"Se han aplicado criterios de seguridad en el acceso de los usuarios."},{"letra":"f)","texto":"Se han reconocido las prestaciones específicas de cada una de las aplicaciones instaladas."},{"letra":"g)","texto":"Se han utilizado las aplicaciones de forma colaborativa."}]},{"descripcion":"Instala aplicaciones web de escritorio, describiendo sus características y entornos de uso.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han descrito diferentes aplicaciones web de escritorio."},{"letra":"b)","texto":"Se han instalado aplicaciones para proveer de acceso web al servicio de correo electrónico."},{"letra":"c)","texto":"Se han configurado las aplicaciones para integrarlas con un servidor de correo."},{"letra":"d)","texto":"Se han gestionado las cuentas de usuario."},{"letra":"e)","texto":"Se ha verificado el acceso al correo electrónico."},{"letra":"f)","texto":"Se han instalado aplicaciones de calendario web."},{"letra":"g)","texto":"Se han reconocido las prestaciones específicas de las aplicaciones instaladas (citas, tareas, entre otras)."}]}]},{"cod":"1710","nombre":"Itinerario personal para la empleabilidad II","horasSem":"2","horasTotal":"67","ras":[{"descripcion":"Planifica y pone en marcha estrategias en los diferentes procesos selectivos de empleo que le permiten mejorar sus posibilidades de inserción laboral.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han determinado las técnicas utilizadas actualmente en el sector para el proceso de selección de personal."},{"letra":"b)","texto":"Se han desarrollado estrategias para la búsqueda de empleo relacionadas xible y positiva ante conflictos y situaciones nuevas, aprovechando las oportunidades y gestionando las dificultades haciendo uso de estrategias relacionadas con la inteligencia emocional."}]},{"descripcion":"Pone en práctica las habilidades emprendedoras necesarias para el desarrollo de procesos de innovación e investigación aplicadas que promuevan la modernización del sector productivo hacia un modelo sostenible.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se ha identificado el concepto de innovación y su relación con la construcción de una sociedad más sostenible que mejore en el bienestar de los individuos."},{"letra":"b)","texto":"Se han analizado las distintas metodologías para emprender y su importancia para favorecer la innovación y como fuente de creación de empleo y bienestar social."},{"letra":"c)","texto":"Se han aplicado las habilidades emprendedoras necesarias para promover el emprendimiento y el intraemprendimiento."},{"letra":"d)","texto":"Se ha puesto en práctica el trabajo colaborativo como requisito para el desarrollo de procesos de innovación."},{"letra":"e)","texto":"Se ha desarrollado la competencia digital necesaria para la mejora de los procesos de innovación e investigación aplicadas que promuevan la modernización del sector productivo."},{"letra":"f)","texto":"Se han incorporado los objetivos de las políticas e iniciativas relacionadas con la sostenibilidad y el medio ambiente a la estrategia empresarial enfocada al desarrollo de un modelo económico y social sostenible."}]},{"descripcion":"Identifica, define y valida ideas de emprendimiento generadoras de nuevas oportunidades a partir de estrategias de análisis del entorno socio productivo utilizando metodologías ágiles para el emprendimiento.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han identificado los problemas de las personas destinatarias potenciales del proyecto emprendedor como paso previo a la propuesta de soluciones que se conviertan en oportunidades."},{"letra":"b)","texto":"Se ha puesto en práctica el proceso creativo con el fin de conseguir una idea emprendedora que aporte valor económico, social y/o cultural."},{"letra":"c)","texto":"Se ha diseñado un modelo de negocio y/o gestión derivado de la idea emprendedora."},{"letra":"d)","texto":"Se han incorporado valores éticos y sociales a la idea emprendedora analizando modelos de balance social."},{"letra":"e)","texto":"Se ha analizado la contribución de la Economía Circular y la Economía del Bien Común al desarrollo de un modelo económico y social basado en la equidad, la justicia social y la sostenibilidad."},{"letra":"f)","texto":"Se han analizado los principales componentes del entorno general y específico, y su impacto en la idea emprendedora."},{"letra":"g)","texto":"Se han realizado entrevistas de problema para validar el perfil y el problema de las personas destinatarias de la idea emprendedora."},{"letra":"h)","texto":"Se ha validado la solución mediante la creación de prototipos buscando el encaje problema-solución."},{"letra":"i)","texto":"Se ha experimentado con la puesta en práctica de estrategias de marketing para desarrollar destrezas en técnicas de comunicación y venta."}]},{"descripcion":"Desarrolla un proyecto emprendedor de innovación social y/o tecnológica aplicada en colaboración con el entorno.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han analizado los conceptos básicos del emprendimiento y la innovación social."},{"letra":"b)","texto":"Se ha reflexionado sobre la necesidad del liderazgo ético y sostenible en las organizaciones."},{"letra":"c)","texto":"Se ha reflexionado sobre la tecnología como base para el cambio del modelo productivo."},{"letra":"d)","texto":"Se han puesto en marcha las estrategias propias del pensamiento de diseño para detectar necesidades sociales y medioambientales."},{"letra":"e)","texto":"Se han analizado los elementos del diseño de modelos de negocio ecosociales y/o de base tecnológica."},{"letra":"f)","texto":"Se uar ante fallos de seguridad."},{"letra":"b)","texto":"Se han clasificado los principales tipos de software malicioso."},{"letra":"c)","texto":"Se han realizado actualizaciones periódicas de los sistemas para corregir posibles vulnerabilidades."},{"letra":"d)","texto":"Se ha verificado el origen y la autenticidad de las aplicaciones que se instalan en los sistemas."},{"letra":"e)","texto":"Se han instalado, probado y actualizado aplicaciones específicas para la detección y eliminación de software malicioso."},{"letra":"f)","texto":"Se han aplicado técnicas de recuperación de datos."}]},{"descripcion":"Asegura la privacidad de la información transmitida en redes informáticas describiendo vulnerabilidades e instalando software especifico.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se ha identificado la necesidad de inventariar y controlar los servicios de red."},{"letra":"b)","texto":"Se ha contrastado la incidencia de las técnicas de ingeniería social en los fraudes informáticos y robos de información."},{"letra":"c)","texto":"Se ha deducido la importancia de minimizar el volumen de tráfico generado por la publicidad y el correo no deseado."},{"letra":"d)","texto":"Se han aplicado medidas para evitar la monitorización de redes cableadas."},{"letra":"e)","texto":"Se han clasificado y valorado las propiedades de seguridad de los protocolos usados en redes inalámbricas."},{"letra":"f)","texto":"Se han descrito sistemas de identificación como la firma electrónica, certificado digital, entre otros."},{"letra":"g)","texto":"Se han utilizado sistemas de identificación como la firma electrónica, certificado digital, entre otros."},{"letra":"h)","texto":"Se ha instalado y configurado un cortafuegos en un equipo o servidor."}]},{"descripcion":"Reconoce la legislación y normativa sobre seguridad y protección de datos analizando las repercusiones de su incumplimiento.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se ha descrito la legislación sobre protección de datos de carácter personal."},{"letra":"b)","texto":"Se ha determinado la necesidad de controlar el acceso a la información personal almacenada."},{"letra":"c)","texto":"Se han identificado las figuras legales que intervienen en el tratamiento y mantenimiento de los ficheros de datos."},{"letra":"d)","texto":"Se ha contrastado la obligación de poner a disposición de las personas los datos personales que les conciernen."},{"letra":"e)","texto":"Se ha descrito la legislación actual sobre los servicios de la sociedad de la información y comercio electrónico."},{"letra":"f)","texto":"Se han contrastado las normas sobre gestión de seguridad de la información."}]}]},{"cod":"0227","nombre":"Servicios en red","horasSem":"5","horasTotal":"167","ras":[{"descripcion":"Instala servicios de configuración dinámica, describiendo sus características y aplicaciones.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se ha reconocido el funcionamiento de los mecanismos automatizados de configuración de los parámetros de red."},{"letra":"b)","texto":"Se han identificado las ventajas que proporcionan."},{"letra":"c)","texto":"Se han ilustrado los procedimientos y pautas que intervienen en una solicitud de configuración de los parámetros de red."},{"letra":"d)","texto":"Se ha instalado un servicio de configuración dinámica de los parámetros de red."},{"letra":"e)","texto":"Se ha preparado el servicio para asignar la configuración básica a los sistemas de una red local."},{"letra":"f)","texto":"Se han realizado asignaciones dinámicas y estáticas."},{"letra":"g)","texto":"Se han integrado en el servicio opciones adicionales de configuración."},{"letra":"h)","texto":"Se ha verificando la correcta asignación de los parámetros."}]},{"descripcion":"Instala servicios de resolución de nombres, describiendo sus características y aplicaciones.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han identificado y descrito escenarios en los que surge la necesidad de un servicio de resolución de nombres."},{"letra":"b)","texto":"Se han clasificado los principales mecanismos de resolución de nombres."},{"letra":"c)","texto":"Se ha descrito la estructura, nomenclatura y funcionalidad de los sistemas de nombres jerárquicos."},{"letra":"d)","texto":"Se ha instalado un servicio jerárquico de resolución de nombres."},{"letra":"e)","texto":"Se ha preparado el servicio para almacenar las respuestas procedentes de servidores de redes públicas y servirlas a los equipos de la red local."},{"letra":"f)","texto":"Se han añadido registros de nombres correspondientes a una zona nueva, con opciones relativas a servidores de correo y alias."},{"letra":"g)","texto":"Se ha trabajado en grupo para realizar transferencias de zona entre dos o más servidores."},{"letra":"h)","texto":"Se ha comprobado el funcionamiento correcto del servidor."}]},{"descripcion":"Instala servicios de transferencia de ficheros, describiendo sus características y aplicaciones.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se ha establecido la utilidad y modo de operación del servicio de transferencia de ficheros."},{"letra":"b)","texto":"Se ha instalado un servicio de transferencia de ficheros."},{"letra":"c)","texto":"Se han creado usuarios y grupos para acceso remoto al servidor."},{"letra":"d)","texto":"Se ha configurado el acceso anónimo."},{"letra":"e)","texto":"Se han establecido límites en los distintos modos de acceso."},{"letra":"f)","texto":"Se ha comprobado el acceso al servidor, tanto en modo activo como en modo pasivo."},{"letra":"g)","texto":"Se han realizado pruebas con clientes en línea de comandos y en modo gráfico."}]},{"descripcion":"Gestiona servidores de correo electrónico identificando requerimientos de utilización y aplicando criterios de configuración.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han descrito los diferentes protocolos que intervienen en el envío y recogida del correo electrónico."},{"letra":"b)","texto":"Se ha instalado un servidor de correo electrónico."},{"letra":"c)","texto":"Se han creado cuentas de usuario y verificado el acceso de las mismas."},{"letra":"d)","texto":"Se han definido alias para las cuentas de correo."},{"letra":"e)","texto":"Se han aplicado métodos para impedir usos indebidos del servidor de correo electrónico."},{"letra":"f)","texto":"Se han instalado servicios para permitir la recogida remota del correo existente en los buzones de usuario."},{"letra":"g)","texto":"Se han usado clientes de correo electrónico para enviar y recibir correo."}]},{"descripcion":"Gestiona servidores web identificando requerimientos de utilización y aplicando criterios de configuración.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han descrito los fundamentos y protocolos en los que se basa el funcionamiento de un servidor web."},{"letra":"b)","texto":"Se ha instalado un servidor web."},{"letra":"c)","texto":"Se han creado sitios virtuales."},{"letra":"d)","texto":"Se han verificado las posibilidades existentes para discriminar el sitio destino del tráfico entrante al servidor."},{"letra":"e)","texto":"Se ha configurado la seguridad del servidor."},{"letra":"f)","texto":"Se ha comprobando el acceso de los usuarios al servidor."},{"letra":"g)","texto":"Se ha diferenciado y probado la ejecución de código en el servidor y en el cliente."},{"letra":"h)","texto":"Se han instalado módulos sobre el servidor."},{"letra":"i)","texto":"Se han establecido mecanismos para asegurar las comunicaciones entre el cliente y el servidor."}]},{"descripcion":"Gestiona métodos de acceso remoto describiendo sus características e instalando los servicios correspondientes.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han descrito métodos de acceso y administración remota de sistemas."},{"letra":"b)","texto":"Se ha instalado un servicio de acceso remoto en línea de comandos."},{"letra":"c)","texto":"Se ha instalado un servicio de acceso remoto en modo gráfico."},{"letra":"d)","texto":"Se ha comprobado el funcionamiento de ambos métodos."},{"letra":"e)","texto":"Se han identificado las principales ventajas y deficiencias de cada uno."},{"letra":"f)","texto":"Se han realizado pruebas de acceso remoto entre sistemas de distinta naturaleza."},{"letra":"g)","texto":"Se han realizado pruebas de administración remota entre sistemas de distinta naturaleza."}]},{"descripcion":"Despliega redes inalámbricas seguras justificando la configuración elegida y describiendo los procedimientos de implantación.","etiqueta":"(RA7)","ces":[{"letra":"a)","texto":"Se ha instalado un punto de acceso inalámbrico dentro de una red local."},{"letra":"b)","texto":"Se han reconocido los protocolos, modos de funcionamiento y principales parámetros de configuración del punto de acceso."},{"letra":"c)","texto":"Se ha seleccionado la configuración más idónea sobre distintos escenarios de prueba."},{"letra":"d)","texto":"Se ha establecido un mecanismo adecuado de seguridad para las comunicaciones inalámbricas."},{"letra":"e)","texto":"Se han usado diversos tipos de dispositivos y adaptadores inalámbricos para comprobar la cobertura."},{"letra":"f)","texto":"Se ha instalado un encaminador inalámbrico con conexión a red pública y servicios inalámbricos de red local."},{"letra":"g)","texto":"Se ha configurado y probado el encaminador desde los ordenadores de la red local."}]},{"descripcion":"Establece el acceso desde redes locales a redes públicas identificando posibles escenarios y aplicando software específico.","etiqueta":"(RA8)","ces":[{"letra":"a)","texto":"Se ha instalado y configurado el hardware de un sistema con acceso a una red privada local y a una red pública."},{"letra":"b)","texto":"Se ha instalado una aplicación que actúe de pasarela entre la red privada local y la red pública."},{"letra":"c)","texto":"Se han reconocido y diferenciado las principales características y posibilidades de la aplicación seleccionada."},{"letra":"d)","texto":"Se han configurado los sistemas de la red privada local para acceder a la red pública a través de la pasarela."},{"letra":"e)","texto":"Se han establecido los procedimientos de control de acceso para asegurar el tráfico que se transmite a través de la pasarela."},{"letra":"f)","texto":"Se han implementado mecanismos para acelerar las comunicaciones entre la red privada local y la pública."},{"letra":"g)","texto":"Se han identificado los posibles escenarios de aplicación de este tipo de mecanismos."},{"letra":"h)","texto":"Se ha establecido un mecanismo que permita reenviar tráfico de red entre dos o más interfaces de un mismo sistema."},{"letra":"i)","texto":"Se ha comprobado el acceso a una red determinada desde los sistemas conectados a otra red distinta."},{"letra":"j)","texto":"Se ha implantado y verificado la configuración para acceder desde una red pública a un servicio localizado en una máquina de una red privada local."}]}]},{"cod":"0224","nombre":"Sistemas operativos en red","horasSem":"6","horasTotal":"200","ras":[{"descripcion":"Instala sistemas operativos en red describiendo sus características e interpretando la documentación técnica.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se ha realizado el estudio de compatibilidad del sistema informático."},{"letra":"b)","texto":"Se han diferenciado los modos de instalación."},{"letra":"c)","texto":"Se ha planificado y realizado el particionado del disco del servidor."},{"letra":"d)","texto":"Se han seleccionado y aplicado los sistemas de archivos."},{"letra":"e)","texto":"Se han seleccionado los componentes a instalar."},{"letra":"f)","texto":"Se han aplicado procedimientos para la automatización de instalaciones."},{"letra":"g)","texto":"Se han aplicado preferencias en la configuración del entorno personal."},{"letra":"h)","texto":"Se ha actualizado el sistema operativo en red."},{"letra":"i)","texto":"Se ha comprobado la conectividad del servidor con los equipos cliente."}]},{"descripcion":"Gestiona usuarios y grupos de sistemas operativos en red, interpretando especificaciones y aplicando herramientas del sistema.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han configurado y gestionado cuentas de usuario."},{"letra":"b)","texto":"Se han configurado y gestionado perfiles de usuario."},{"letra":"c)","texto":"Se han configurado y gestionado cuentas de equipo."},{"letra":"d)","texto":"Se ha distinguido el propósito de los grupos, sus tipos y ámbitos."},{"letra":"e)","texto":"Se han configurado y gestionado grupos."},{"letra":"f)","texto":"Se ha gestionado la pertenencia de usuarios a grupos."},{"letra":"g)","texto":"Se han identificado las características de usuarios y grupos predeterminados y especiales."},{"letra":"h)","texto":"Se han planificado perfiles móviles de usuarios."},{"letra":"i)","texto":"Se han utilizado herramientas para la administración de usuarios y grupos, incluidas en el sistema operativo en red."}]},{"descripcion":"Realiza tareas de gestión sobre dominios identificando necesidades y aplicando herramientas de administración de dominios.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se ha identificado la función del servicio de directorio, sus elementos y nomenclatura."},{"letra":"b)","texto":"Se ha reconocido el concepto de dominio y sus funciones."},{"letra":"c)","texto":"Se han establecido relaciones de confianza entre dominios."},{"letra":"d)","texto":"Se ha realizado la instalación del servicio de directorio."},{"letra":"e)","texto":"Se ha realizado la configuración básica del servicio de directorio."},{"letra":"f)","texto":"Se han utilizado agrupaciones de elementos para la creación de modelos administrativos."},{"letra":"g)","texto":"Se ha analizado la estructura del servicio de directorio."},{"letra":"h)","texto":"Se han utilizado herramientas de administración de dominios."}]},{"descripcion":"Gestiona los recursos compartidos del sistema, interpretando especificaciones y determinando niveles de seguridad.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se ha reconocido la diferencia entre permiso y derecho."},{"letra":"b)","texto":"Se han identificado los recursos del sistema que se van a compartir y en qué condiciones."},{"letra":"c)","texto":"Se han asignado permisos a los recursos del sistema que se van a compartir."},{"letra":"d)","texto":"Se han compartido impresoras en red."},{"letra":"e)","texto":"Se ha utilizado el entorno gráfico para compartir recursos."},{"letra":"f)","texto":"Se han establecido niveles de seguridad para controlar el acceso del cliente a los recursos compartidos en red."},{"letra":"g)","texto":"Se ha trabajado en grupo para comprobar el acceso a los recursos compartidos del sistema."}]},{"descripcion":"Realiza tareas de monitorización y uso del sistema operativo en red, describiendo las herramientas utilizadas e identificando las principales incidencias.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han descrito las características de los programas de monitorización."},{"letra":"b)","texto":"Se han identificado problemas de rendimiento en los dispositivos de almacenamiento."},{"letra":"c)","texto":"Se ha observado la actividad del sistema operativo en red a partir de las trazas generadas por el propio sistema."},{"letra":"d)","texto":"Se han realizado tareas de mantenimiento del software instalado en el sistema."},{"letra":"e)","texto":"Se han ejecutado operaciones para la automatización de tareas del sistema."},{"letra":"f)","texto":"Se ha interpretado la información de configuración del sistema operativo en red."}]},{"descripcion":"Realiza tareas de integración de sistemas operativos libres y propietarios, describiendo las ventajas de compartir recursos e instalando software específico.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se ha identificado la necesidad de compartir recursos en red entre diferentes sistemas operativos."},{"letra":"b)","texto":"Se ha comprobado la conectividad de la red en un escenario heterogéneo."},{"letra":"c)","texto":"Se ha descrito la funcionalidad de los servicios que permiten compartir recursos en red."},{"letra":"d)","texto":"Se han instalado y configurado servicios para compartir recursos en red."},{"letra":"e)","texto":"Se ha accedido a sistemas de archivos en red desde equipos con diferentes sistemas operativos."},{"letra":"f)","texto":"Se ha accedido a impresoras desde equipos con diferentes sistemas operativos."},{"letra":"g)","texto":"Se ha trabajado en grupo."},{"letra":"h)","texto":"Se han establecido niveles de seguridad para controlar el acceso del usuario a los recursos compartidos en red."},{"letra":"i)","texto":"Se ha comprobado el funcionamiento de los servicios instalados."}]}]},{"cod":"1708","nombre":"Sostenibilidad aplicada al sistema productivo","horasSem":"1","horasTotal":"33","ras":[{"descripcion":"Identifica los aspectos ambientales, sociales y de gobernanza (ASG) relativos a la sostenibilidad teniendo en cuenta el concepto de desarrollo sostenible y los marcos internacionales que contribuyen a su consecución.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se ha descrito el concepto de sostenibilidad, estableciendo los marcos internacionales asociados al desarrollo sostenible."},{"letra":"b)","texto":"Se han identificado los asuntos ambientales, sociales y de gobernanza que influyen en el desarrollo sostenible de las organizaciones empresariales."},{"letra":"c)","texto":"Se han relacionado los Objetivos de Desarrollo Sostenible (ODS) con su importancia para la consecución de la Agenda 2030."},{"letra":"d)","texto":"Se ha analizado la importancia de identificar los aspectos ASG más relevantes para los grupos de interés de las organizaciones relacionándolos con los riesgos y oportunidades que suponen para la propia organización."},{"letra":"e)","texto":"Se han identificado los principales estándares de métricas para la evaluación del desempeño en sostenibilidad y su papel en la rendición de cuentas que marca la legislación vigente y las futuras regulaciones en desarrollo."},{"letra":"f)","texto":"Se ha descrito la inversión socialmente responsable y el papel de los analistas, inversores, agencias e índices de sostenibilidad en el fomento de la sostenibilidad."}]},{"descripcion":"Caracteriza los retos ambientales y sociales a los que se enfrenta la sociedad, describiendo los impactos sobre las personas y los sectores productivos y proponiendo acciones para minimizarlos.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han identificado los principales retos ambientales y sociales."},{"letra":"b)","texto":"Se han relacionado los retos ambientales y sociales con el desarrollo de la actividad económica."},{"letra":"c)","texto":"Se ha analizado el efecto de los impactos ambientales y sociales sobre las personas y los sectores productivos."},{"letra":"d)","texto":"Se han identificado las medidas y acciones encaminadas a minimizar los impactos ambientales y sociales."},{"letra":"e)","texto":"Se ha analizado la importancia de establecer alianzas y trabajar de manera transversal y coordinada para abordar con éxito los retos ambientales y sociales."}]},{"descripcion":"Establece la aplicación de criterios de sostenibilidad en el desempeño profesional y personal, identificando los elementos necesarios.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han identificado los ODS más relevantes para la actividad profesional que realiza."},{"letra":"b)","texto":"Se han analizado los riesgos y oportunidades que representan los ODS."},{"letra":"c)","texto":"Se han identificado las acciones necesarias para atender algunos de los retos ambientales y sociales desde la actividad profesional y el entorno personal."}]},{"descripcion":"Propón productos y servicios responsables teniendo en cuenta los principios de la economía circular.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se ha caracterizado el modelo de producción y consumo actual."},{"letra":"b)","texto":"Se han identificado los principios de la economía verde y circular."},{"letra":"c)","texto":"Se han contrastado los beneficios de la economía verde y circular frente al modelo clásico de producción."},{"letra":"d)","texto":"Se han aplicado principios de ecodiseño."},{"letra":"e)","texto":"Se ha analizado el ciclo de vida del producto."},{"letra":"f)","texto":"Se han identificado los procesos de producción y los criterios de sostenibilidad aplicados."}]},{"descripcion":"Realiza actividades sostenibles minimizando el impacto de las mismas en el medio ambiente.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se ha caracterizado el modelo de producción y consumo actual."},{"letra":"b)","texto":"Se han identificado los principios de la economía verde y circular."},{"letra":"c)","texto":"Se han contrastado los beneficios de la economía verde y circular frente al modelo clásico de producción."},{"letra":"d)","texto":"Se ha evaluado el impacto de las actividades personales y profesionales."},{"letra":"e)","texto":"Se han aplicado principios de ecodiseño."},{"letra":"f)","texto":"Se han aplicado estrategias sostenibles."},{"letra":"g)","texto":"Se ha analizado el ciclo de vida del producto."},{"letra":"h)","texto":"Se han identificado los procesos de producción y los criterios de sostenibilidad aplicados."},{"letra":"i)","texto":"Se ha aplicado la normativa ambiental."}]},{"descripcion":"Analiza un plan de sostenibilidad de una empresa del sector, identificando sus grupos de interés, los aspectos ASG materiales y justificando acciones para su gestión y medición.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han identificado los principales grupos de interés de la empresa."},{"letra":"b)","texto":"Se han analizado los aspectos ASG materiales, las expectativas de los grupos de interés y la importancia de los aspectos ASG en relación con los objetivos empresariales."},{"letra":"c)","texto":"Se han definido acciones encaminadas a minimizar los impactos negativos y aprovechar las oportunidades que plantean los principales aspectos ASG identificados."},{"letra":"d)","texto":"Se han determinado las métricas de evaluación del desempeño de la empresa de acuerdo con los estándares de sostenibilidad más ampliamente utilizados."},{"letra":"e)","texto":"Se ha elaborado un informe de sostenibilidad con el plan y los indicadores propuestos."}]}]},{"cod":"A996","nombre":"Tutoría II","horasSem":"1","horasTotal":"33","ras":[]}]}]},"IFC301":{"codigo":"IFC301","nombre":"Administración de Sistemas Informáticos en Red","categoria":"Ciclo Formativo de Grado Superior","cursos":[{"cursoNombre":"Curso 1º","modulos":[{"cod":"1665","nombre":"Digitalización aplicada a los sectores productivos (GS)","horasSem":"1","horasTotal":"33","ras":[{"descripcion":"Analiza el concepto de digitalización y su repercusión en los sectores productivos teniendo en cuenta la actividad de la empresa e identificando entornos IT (Information Technology: tecnología de la información) y OT (Operation Technology: tecnología de operación) característicos.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se ha descrito en qué consiste el concepto de digitalización."},{"letra":"b)","texto":"Se ha relacionado la implantación de la tecnología digital con la organización de las empresas."},{"letra":"c)","texto":"Se han establecido las diferencias y similitudes entre los entornos IT y OT."},{"letra":"d)","texto":"Se han identificado los departamentos típicos de las empresas que pueden constituir entornos IT."},{"letra":"e)","texto":"Se han seleccionado las tecnologías típicas de la digitalización en planta y en negocio."},{"letra":"f)","texto":"Se ha analizado la importancia de la conexión entre entornos IT y OT."},{"letra":"g)","texto":"Se han analizado las ventajas de digitalizar una empresa industrial de extremo a extremo."}]},{"descripcion":"Caracteriza las tecnologías habilitadoras digitales necesarias para la adecuación/transformación de las empresas a entornos digitales describiendo sus características y aplicaciones.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han identificado las principales tecnologías habilitadoras digitales."},{"letra":"b)","texto":"Se han relacionado las THD con el desarrollo de productos y servicios."},{"letra":"c)","texto":"Se ha relacionado la importancia de las THD con la economía sostenible y eficiente."},{"letra":"d)","texto":"Se han identificado nuevos mercados generados por las THD."},{"letra":"e)","texto":"Se ha analizado la implicación de THD tanto en la parte de negocio como en la parte de planta."},{"letra":"f)","texto":"Se han identificado las mejoras producidas debido a la implantación de las tecnologías habilitadoras en relación con los entornos IT y OT."},{"letra":"g)","texto":"Se ha elaborado un informe que relacione, las tecnologías con sus características y áreas de aplicación."}]},{"descripcion":"Identifica sistemas basados en cloud/nube y su influencia en el desarrollo de los sistemas digitales.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han identificado los diferentes niveles de la cloud/nube."},{"letra":"b)","texto":"Se han identificado las principales funciones de la cloud/nube (procesamiento de datos, intercambio de información, ejecución de aplicaciones, entre otros)."},{"letra":"c)","texto":"Se ha descrito el concepto de edge computing y su relación con la cloud/nube."},{"letra":"d)","texto":"Se han definido los conceptos de fog y mist y sus zonas de aplicación en el conjunto."},{"letra":"e)","texto":"Se han identificado las ventajas que proporciona la utilización de la cloud/nube en los sistemas conectados."}]},{"descripcion":"Identifica aplicaciones de la IA (inteligencia artificial) en entornos del sector donde está enmarcado el título describiendo las mejoras implícitas en su implementación.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se ha identificado la importancia de la IA en la automatización de procesos y su optimización."},{"letra":"b)","texto":"Se ha relacionado la IA con la recogida masiva de datos (Big Data) y su tratamiento (análisis) con la rentabilidad de las empresas."},{"letra":"c)","texto":"Se ha valorado la importancia presente y futura de la IA."},{"letra":"d)","texto":"Se han identificado los sectores con implantación más relevante de IA."},{"letra":"e)","texto":"Se han identificado los lenguajes de programación en IA."},{"letra":"f)","texto":"Se ha descrito como influye la IA en el sector del título."}]},{"descripcion":"Evalúa la importancia de los datos, así como su protección en una economía digital globalizada, definiendo sistemas de seguridad y ciberseguridad tanto a nivel de equipo/sistema, como globales.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se ha establecido la diferencia entre dato e información."},{"letra":"b)","texto":"Se ha descrito el ciclo de vida del dato."},{"letra":"c)","texto":"Se ha identificado la relación entre Big Data, análisis de datos, machine/ deep learning e inteligencia artificial."},{"letra":"d)","texto":"Se han descrito las características que definen Big Data."},{"letra":"e)","texto":"Se han descrito las etapas típicas de la ciencia de datos y su relación en el proceso."},{"letra":"f)","texto":"Se han descrito los procedimientos de almacenaje de datos en la cloud/nube."},{"letra":"g)","texto":"Se ha descrito la importancia del cloud computing."},{"letra":"h)","texto":"Se han identificado los principales objetivos de la ciencia de datos en las diferentes empresas."},{"letra":"i)","texto":"Se ha valorado la importancia de la seguridad y su regulación en relación con los datos."}]},{"descripcion":"Desarrolla un proyecto de transformación digital de una empresa de un sector relacionado con el título, teniendo en cuenta los cambios que se deben producir en función de los objetivos de la empresa.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han identificado los objetivos estratégicos de la empresa."},{"letra":"b)","texto":"Se han identificado y alineado las áreas de producción/negocio y de comunicaciones."},{"letra":"c)","texto":"Se han identificado las áreas susceptibles de ser digitalizadas."},{"letra":"d)","texto":"Se ha analizado el encaje de AD (áreas digitalizadas) entre sí y con las que no lo están."},{"letra":"e)","texto":"Se han tenido en cuenta las necesidades presentes y futuras de la empresa."},{"letra":"f)","texto":"Se han relacionado cada una de las áreas con la implantación de las tecnologías."},{"letra":"g)","texto":"Se han analizado las posibles brechas de seguridad en cada una de las áreas."},{"letra":"h)","texto":"Se ha definido el tratamiento de los datos y su análisis."},{"letra":"i)","texto":"Se ha tenido en cuenta la integración entre datos, aplicaciones, plataformas que los soportan, entre otros."},{"letra":"j)","texto":"Se han documentado los cambios realizados en función de la estrategia."},{"letra":"k)","texto":"Se han tenido en cuenta la idoneidad de los recursos humanos."}]}]},{"cod":"0371","nombre":"Fundamentos de hardware","horasSem":"4","horasTotal":"133","ras":[{"descripcion":"Configura equipos microinformáticos, componentes y periféricos, analizando sus características y relación con el conjunto.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han identificado y caracterizado los dispositivos que constituyen los bloques funcionales de un equipo microinformático."},{"letra":"b)","texto":"Se ha descrito el papel de los elementos físicos y lógicos que intervienen en el proceso de puesta en marcha de un equipo."},{"letra":"c)","texto":"Se ha analizado la arquitectura general de un equipo y los mecanismos de conexión entre dispositivos."},{"letra":"d)","texto":"Se han establecido los parámetros de configuración (hardware y software) de un equipo microinformático con las utilidades específicas."},{"letra":"e)","texto":"Se ha evaluado las prestaciones del equipo."},{"letra":"f)","texto":"Se han ejecutado utilidades de chequeo y diagnóstico."},{"letra":"g)","texto":"Se han identificado averías y sus causas."},{"letra":"h)","texto":"Se han clasificado los dispositivos periféricos y sus mecanismos de comunicación."},{"letra":"i)","texto":"Se han utilizado protocolos estándar de comunicación inalámbrica entre dispositivos."}]},{"descripcion":"Instala software de propósito general evaluando sus características y entornos de aplicación.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han catalogado los tipos de software según su licencia, distribución y propósito."},{"letra":"b)","texto":"Se han analizado las necesidades específicas de software asociadas al uso de sistemas informáticos en diferentes entornos productivos."},{"letra":"c)","texto":"Se han instalado y evaluado utilidades para la gestión de archivos, recuperación de datos, mantenimiento y optimización del sistema."},{"letra":"d)","texto":"Se han instalado y evaluado utilidades de seguridad básica."},{"letra":"e)","texto":"Se ha instalado y evaluado software ofimático y de utilidad general."},{"letra":"f)","texto":"Se ha consultado la documentación y las ayudas interactivas."},{"letra":"g)","texto":"Se ha verificado la repercusión de la eliminación, modificación y/o actualización de las utilidades instaladas en el sistema."},{"letra":"h)","texto":"Se han probado y comparado aplicaciones portables y no portables."},{"letra":"i)","texto":"Se han realizado inventarios del software instalado y las características de su licencia."}]},{"descripcion":"Ejecuta procedimientos para recuperar el software base de un equipo, analizándolos y utilizando imágenes almacenadas en memoria auxiliar.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han identificado los soportes de memoria auxiliar adecuados para el almacenaje y restauración de imágenes de software."},{"letra":"b)","texto":"Se ha reconocido la diferencia entre una instalación estándar y una preinstalación o imagen de software."},{"letra":"c)","texto":"Se han identificado y probado las distintas secuencias de arranque configurables en un equipo."},{"letra":"d)","texto":"Se han utilizado herramientas para el particionado de discos."},{"letra":"e)","texto":"Se han empleado distintas utilidades y soportes para realizar imágenes."},{"letra":"f)","texto":"Se han restaurado imágenes desde distintas ubicaciones."}]},{"descripcion":"Implanta hardware específico de centros de proceso de datos (CPD), analizando sus características y aplicaciones.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han reconocido las diferencias entre las configuraciones hardware de tipo personal y empresarial."},{"letra":"b)","texto":"Se han analizado entornos que requieren implantar soluciones hardware específicas."},{"letra":"c)","texto":"Se han detallado componentes hardware específicos para soluciones empresariales."},{"letra":"d)","texto":"Se han analizado los requerimientos básicos de seguridad física, organización y condiciones ambientales de un CPD."},{"letra":"e)","texto":"Se han implantado sistemas de alimentación ininterrumpida y estabilizadores de tensión."},{"letra":"f)","texto":"Se han manipulado correctamente dispositivos hardware para almacenamiento y alimentación con conexión en caliente."},{"letra":"g)","texto":"Se han documentado procedimientos, incidencias y parámetros utilizados en la instalación y configuración de dispositivos hardware."},{"letra":"h)","texto":"Se han utilizado herramientas de inventariado, registrando las características de los dispositivos hardware."},{"letra":"i)","texto":"Se ha clasificado y organizado la documentación técnica, controladores, utilidades y accesorios del hardware."}]},{"descripcion":"Cumple las normas de prevención de riesgos laborales y de protección ambiental, identificando los riesgos asociados, las medidas y equipos para prevenirlos.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han identificado los riesgos y el nivel de peligrosidad que suponen la manipulación de los materiales, herramientas, útiles, máquinas y medios de transporte."},{"letra":"b)","texto":"Se han operado las máquinas respetando las normas de seguridad."},{"letra":"c)","texto":"Se han identificado las causas más frecuentes de accidentes en la manipulación de materiales y herramientas, entre otras."},{"letra":"d)","texto":"Se han descrito los elementos de seguridad (protecciones, alarmas, y pasos de emergencia, entre otros) de las máquinas y los equipos de protección individual (calzado, protección ocular e indumentaria, entre otros) que se deben emplear en las distintas operaciones de montaje y mantenimiento."},{"letra":"e)","texto":"Se ha relacionado la manipulación de materiales, herramientas y máquinas con las medidas de seguridad y protección personal requeridos."},{"letra":"f)","texto":"Se han identificado las posibles fuentes de contaminación del entorno ambiental."},{"letra":"g)","texto":"Se han clasificado los residuos generados para su retirada selectiva."},{"letra":"h)","texto":"Se ha valorado el orden y la limpieza de instalaciones y equipos como primer factor de prevención de riesgos."}]}]},{"cod":"0372","nombre":"Gestión de bases de datos","horasSem":"5","horasTotal":"167","ras":[{"descripcion":"Reconoce los elementos de las bases de datos analizando sus funciones y valorando la utilidad de sistemas gestores.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han analizado los distintos sistemas lógicos de almacenamiento y sus funciones."},{"letra":"b)","texto":"Se han identificado los distintos tipos de bases de datos según el modelo de datos utilizado."},{"letra":"c)","texto":"Se han identificado los distintos tipos de bases de datos en función de la ubicación de la información."},{"letra":"d)","texto":"Se ha reconocido la utilidad de un sistema gestor de bases de datos."},{"letra":"e)","texto":"Se ha descrito la función de cada uno de los elementos de un sistema gestor de bases de datos."},{"letra":"f)","texto":"Se han clasificado los sistemas gestores de bases de datos."}]},{"descripcion":"Diseña modelos lógicos normalizados interpretando diagramas entidad/relación.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se ha identificado el significado de la simbología propia de los diagramas entidad/ relación."},{"letra":"b)","texto":"Se han utilizado herramientas gráficas para representar el diseño lógico."},{"letra":"c)","texto":"Se han identificado las tablas del diseño lógico."},{"letra":"d)","texto":"Se han identificado los campos que forman parte de las tablas del diseño lógico."},{"letra":"e)","texto":"Se han identificado las relaciones entre las tablas del diseño lógico."},{"letra":"f)","texto":"Se han definido los campos clave."},{"letra":"g)","texto":"Se han aplicado las reglas de integridad."},{"letra":"h)","texto":"Se han aplicado las reglas de normalización hasta un nivel adecuado."},{"letra":"i)","texto":"Se han identificado y documentado las restricciones que no pueden plasmarse en el diseño lógico."}]},{"descripcion":"Realiza el diseño físico de bases de datos utilizando asistentes, herramientas gráficas y el lenguaje de definición de datos.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han definido las estructuras físicas de almacenamiento."},{"letra":"b)","texto":"Se han creado tablas."},{"letra":"c)","texto":"Se han seleccionado los tipos de datos adecuados."},{"letra":"d)","texto":"Se han definido los campos clave en las tablas."},{"letra":"e)","texto":"Se han implantado todas las restricciones reflejadas en el diseño lógico."},{"letra":"f)","texto":"Se ha verificado mediante un conjunto de datos de prueba que la implementación se ajusta al modelo."},{"letra":"g)","texto":"Se han utilizado asistentes y herramientas gráficas."},{"letra":"h)","texto":"Se ha utilizado el lenguaje de definición de datos."},{"letra":"i)","texto":"Se ha definido y documentado el diccionario de datos."}]},{"descripcion":"Consulta la información almacenada manejando asistentes, herramientas gráficas y el lenguaje de manipulación de datos.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han identificado las herramientas y sentencias para realizar consultas."},{"letra":"b)","texto":"Se han realizado consultas simples sobre una tabla."},{"letra":"c)","texto":"Se han realizado consultas que generan valores de resumen."},{"letra":"d)","texto":"Se han realizado consultas sobre el contenido de varias tablas mediante composiciones internas."},{"letra":"e)","texto":"Se han realizado consultas sobre el contenido de varias tablas mediante composiciones externas."},{"letra":"f)","texto":"Se han realizado consultas con subconsultas."},{"letra":"g)","texto":"Se han valorado las ventajas e inconvenientes de las distintas opciones válidas para llevar a cabo una consulta determinada."}]},{"descripcion":"Modifica la información almacenada utilizando asistentes, herramientas gráficas y el lenguaje de manipulación de datos.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han identificado las herramientas y sentencias para modificar el contenido de la base de datos."},{"letra":"b)","texto":"Se han insertado, borrado y actualizado datos en las tablas."},{"letra":"c)","texto":"Se ha incluido en una tabla la información resultante de la ejecución de una consulta."},{"letra":"d)","texto":"Se han adoptado medidas para mantener la integridad y consistencia de la información."},{"letra":"e)","texto":"Se han diseñado guiones de sentencias para llevar a cabo tareas complejas."},{"letra":"f)","texto":"Se ha reconocido el funcionamiento de las transacciones."},{"letra":"g)","texto":"Se han anulado parcial o totalmente los cambios producidos por una transacción."},{"letra":"h)","texto":"Se han identificado los efectos de las distintas políticas de bloqueo de registros."}]},{"descripcion":"Ejecuta tareas de aseguramiento de la información, analizándolas y aplicando mecanismos de salvaguarda y transferencia.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han identificado herramientas gráficas y en línea de comandos para la administración de copias de seguridad."},{"letra":"b)","texto":"Se han realizado copias de seguridad."},{"letra":"c)","texto":"Se han restaurado copias de seguridad."},{"letra":"d)","texto":"Se han identificado las herramientas para importar y exportar datos."},{"letra":"e)","texto":"Se han exportado datos a diversos formatos."},{"letra":"f)","texto":"Se han importado datos con distintos formatos."},{"letra":"g)","texto":"Se ha interpretado correctamente la información suministrada por los mensajes de error y los ficheros de registro."},{"letra":"h)","texto":"Se ha transferido información entre sistemas gestores."}]}]},{"cod":"0369","nombre":"Implantación de sistemas operativos","horasSem":"6","horasTotal":"200","ras":[{"descripcion":"Instala sistemas operativos, analizando sus características e interpretando la documentación técnica.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han identificado los elementos funcionales de un sistema informático."},{"letra":"b)","texto":"Se han identificado las características, funciones y arquitectura de un sistema operativo."},{"letra":"c)","texto":"Se han comparado diferentes sistemas operativos, sus versiones y licencias de uso, en función de sus requisitos, características y campos de aplicación."},{"letra":"d)","texto":"Se han realizado instalaciones de diferentes sistemas operativos."},{"letra":"e)","texto":"Se han previsto y aplicado técnicas de actualización y recuperación del sistema."},{"letra":"f)","texto":"Se han solucionado incidencias del sistema y del proceso de inicio."},{"letra":"g)","texto":"Se han utilizado herramientas para conocer el software instalado en el sistema y su origen."},{"letra":"h)","texto":"Se ha elaborado documentación de soporte relativa a las instalaciones efectuadas y a las incidencias detectadas."}]},{"descripcion":"Configura el software de base, analizando las necesidades de explotación del sistema informático.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han planificado, creado y configurado cuentas de usuario, grupos, perfiles y políticas de contraseñas locales."},{"letra":"b)","texto":"Se ha asegurado el acceso al sistema mediante el uso de directivas de cuenta y directivas de contraseñas."},{"letra":"c)","texto":"Se ha actuado sobre los servicios y procesos en función de las necesidades del sistema."},{"letra":"d)","texto":"Se han instalado, configurado y verificado protocolos de red."},{"letra":"e)","texto":"Se han analizado y configurado los diferentes métodos de resolución de nombres."},{"letra":"f)","texto":"Se ha optimizado el uso de los sistemas operativos para sistemas portátiles."},{"letra":"g)","texto":"Se han utilizado máquinas virtuales para realizar tareas de configuración de sistemas operativos y analizar sus resultados."},{"letra":"h)","texto":"Se han documentado las tareas de configuración del software de base."}]},{"descripcion":"Asegura la información del sistema, describiendo los procedimientos y utilizando copias de seguridad y sistemas tolerantes a fallos.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han comparado diversos sistemas de archivos y analizado sus diferencias y ventajas de implementación."},{"letra":"b)","texto":"Se ha descrito la estructura de directorios del sistema operativo."},{"letra":"c)","texto":"Se han identificado los directorios contenedores de los archivos de configuración del sistema (binarios, órdenes y librerías)."},{"letra":"d)","texto":"Se han utilizado herramientas de administración de discos para crear particiones, unidades lógicas, volúmenes simples y volúmenes distribuidos."},{"letra":"e)","texto":"Se han implantado sistemas de almacenamiento redundante (RAID)."},{"letra":"f)","texto":"Se han implementado y automatizado planes de copias de seguridad."},{"letra":"g)","texto":"Se han administrado cuotas de disco."},{"letra":"h)","texto":"Se han documentado las operaciones realizadas y los métodos a seguir para la recuperación ante desastres."}]},{"descripcion":"Centraliza la información en servidores administrando estructuras de dominios y analizando sus ventajas.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han implementado dominios."},{"letra":"b)","texto":"Se han administrado cuentas de usuario y cuentas de equipo."},{"letra":"c)","texto":"Se ha centralizado la información personal de los usuarios del dominio mediante el uso de perfiles móviles y carpetas personales."},{"letra":"d)","texto":"Se han creado y administrado grupos de seguridad."},{"letra":"e)","texto":"Se han creado plantillas que faciliten la administración de usuarios con características similares."},{"letra":"f)","texto":"Se han organizado los objetos del dominio para facilitar su administración."},{"letra":"g)","texto":"Se han utilizado máquinas virtuales para administrar dominios y verificar su funcionamiento."},{"letra":"h)","texto":"Se ha documentado la estructura del dominio y las tareas realizadas."}]},{"descripcion":"Administra el acceso a dominios analizando y respetando requerimientos de seguridad.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han incorporado equipos al dominio."},{"letra":"b)","texto":"Se han previsto bloqueos de accesos no autorizados al dominio."},{"letra":"c)","texto":"Se ha administrado el acceso a recursos locales y recursos de red."},{"letra":"d)","texto":"Se han tenido en cuenta los requerimientos de seguridad."},{"letra":"e)","texto":"Se han implementado y verificado directivas de grupo."},{"letra":"f)","texto":"Se han asignado directivas de grupo."},{"letra":"g)","texto":"Se han documentado las tareas y las incidencias."}]},{"descripcion":"Detecta problemas de rendimiento, monitorizando el sistema con las herramientas adecuadas y documentando el procedimiento.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han identificado los objetos monitorizables en un sistema informático."},{"letra":"b)","texto":"Se han identificado los tipos de sucesos."},{"letra":"c)","texto":"Se han utilizado herramientas de monitorización en tiempo real."},{"letra":"d)","texto":"Se ha monitorizado el rendimiento mediante registros de contador y de seguimiento del sistema."},{"letra":"e)","texto":"Se han planificado y configurado alertas de rendimiento."},{"letra":"f)","texto":"Se han interpretado los registros de rendimiento almacenados."},{"letra":"g)","texto":"Se ha analizado el sistema mediante técnicas de simulación para optimizar el rendimiento."},{"letra":"h)","texto":"Se ha elaborado documentación de soporte y de incidencias."}]},{"descripcion":"Audita la utilización y acceso a recursos, identificando y respetando las necesidades de seguridad del sistema.","etiqueta":"(RA7)","ces":[{"letra":"a)","texto":"Se han administrado derechos de usuario y directivas de seguridad."},{"letra":"b)","texto":"Se han identificado los objetos y sucesos auditables."},{"letra":"c)","texto":"Se ha elaborado un plan de auditorías."},{"letra":"d)","texto":"Se han identificado las repercusiones de las auditorías en el rendimiento del sistema."},{"letra":"e)","texto":"Se han auditado sucesos correctos y erróneos."},{"letra":"f)","texto":"Se han auditado los intentos de acceso y los accesos a recursos del sistema."},{"letra":"g)","texto":"Se han gestionado los registros de auditoría."},{"letra":"h)","texto":"Se ha documentado el proceso de auditoría y sus resultados."}]},{"descripcion":"Implanta software específico con estructura cliente/servidor dando respuesta a los requisitos funcionales.","etiqueta":"(RA8)","ces":[{"letra":"a)","texto":"Se ha instalado software específico según la documentación técnica."},{"letra":"b)","texto":"Se han realizado instalaciones desatendidas."},{"letra":"c)","texto":"Se ha configurado y utilizado un servidor de actualizaciones."},{"letra":"d)","texto":"Se han planificado protocolos de actuación para resolver incidencias."},{"letra":"e)","texto":"Se han seguido los protocolos de actuación para resolver incidencias."},{"letra":"f)","texto":"Se ha dado asistencia técnica a través de la red documentando las incidencias."},{"letra":"g)","texto":"Se han elaborado guías visuales y manuales para instruir en el uso de sistemas operativos o aplicaciones."},{"letra":"h)","texto":"Se han documentado las tareas realizadas."}]}]},{"cod":"0179","nombre":"Inglés Profesional (GS)","horasSem":"2","horasTotal":"67","ras":[{"descripcion":"Comprende información, de índole profesional, académica y cotidiana, contenida en todo tipo de discursos orales, emitidos por cualquier medio de comunicación en lengua estándar, interpretando con precisión el contenido del mensaje.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se ha identificado la idea principal de mensajes en lengua estándar relacionados con la vida social, profesional o académica."},{"letra":"b)","texto":"Se ha reconocido la finalidad de mensajes directos o emitidos en cualquier soporte en lengua estándar."},{"letra":"c)","texto":"Se ha extraído información específica contenida en distintos discursos orales en lengua estándar, relacionada con la vida social, profesional o académica."},{"letra":"d)","texto":"Se ha identificado el punto de vista y la actitud del hablante."},{"letra":"e)","texto":"Se ha identificado el hilo argumental de mensajes orales y determinado los roles que aparecen en dichos mensajes."},{"letra":"f)","texto":"Se han comprendido adecuadamente mensajes en lengua estándar en ambientes con contaminación acústica."},{"letra":"g)","texto":"Se han extraído las ideas principales de conferencias, charlas e informes, y otras formas de presentación académica y profesional, lingüísticamente complejas."},{"letra":"h)","texto":"Se ha tomado conciencia de la importancia de comprender globalmente un mensaje sin entender todos y cada uno de los elementos del mismo."}]},{"descripcion":"Comprende mensajes escritos, de naturaleza profesional, académica y cotidiana, de relativa dificultad, analizando de forma comprensiva su contenido.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se ha identificado la idea principal de textos específicos de su ámbito social, profesional o académico."},{"letra":"b)","texto":"Se ha reconocido la finalidad de distintos textos escritos en cualquier soporte, en lengua estándar y relacionados con la actividad profesional."},{"letra":"c)","texto":"Se ha extraído información específica de textos, de diferente naturaleza, relativos a su profesión, y contenidos en distintos soportes."},{"letra":"d)","texto":"Se ha tomado conciencia de la importancia de comprender globalmente un texto sin entender todos y cada uno de los elementos del mismo."},{"letra":"e)","texto":"Se han leído y comprendido, de manera autónoma, textos relacionados con el sector con la velocidad y estilo de lectura propia del nivel competencial."},{"letra":"f)","texto":"Se ha interpretado la correspondencia relativa a su especialidad, captando fácilmente el significado esencial."},{"letra":"g)","texto":"Se han interpretado textos extensos, y de cierta complejidad, relacionados o no con su especialidad, pudiendo realizar varias lecturas del mismo."},{"letra":"h)","texto":"Se ha identificado con rapidez el contenido y la importancia de noticias, artículos e informes sobre una amplia serie de temas profesionales."},{"letra":"i)","texto":"Se han interpretado instrucciones, con distintos niveles de dificultad, y mensajes técnicos recibidos a través de soportes digitales."},{"letra":"j)","texto":"Se han traducido textos de cierta complejidad, utilizando material de apoyo en caso necesario."}]},{"descripcion":"Produce mensajes orales claros y bien estructurados, analizando el contenido de la situación y adaptándose al registro lingüístico del interlocutor.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han emitido mensajes generales propios de sector y de la vida cotidiana, utilizando nexos y estrategias de interacción."},{"letra":"b)","texto":"Se ha intercambiado con fluidez información específica y detallada utilizando estructuras de una complejidad acorde al nivel competencial."},{"letra":"c)","texto":"Se han seleccionado y aplicado los registros adecuados para la emisión del mensaje, así como protocolos y normas de relación social propios del país."},{"letra":"d)","texto":"Se han realizado presentaciones, bien estructuradas, sobre temas de su ámbito profesional, haciendo uso de los protocolos establecidos."},{"letra":"e)","texto":"Se ha utilizado correctamente la terminología de la profesión."},{"letra":"f)","texto":"Se ha descrito y secuenciado oralmente un proceso de trabajo de su competencia."},{"letra":"g)","texto":"Se ha solicitado la reformulación del discurso o parte del mismo cuando se ha considerado necesario."},{"letra":"h)","texto":"Se ha interaccionado espontáneamente, adoptando un nivel de formalidad adecuado a las circunstancias."},{"letra":"i)","texto":"Se ha expresado con fluidez, precisión y eficacia sobre una amplia serie de temas generales, académicos, profesionales o de ocio, marcando con claridad la relación entre las ideas."},{"letra":"j)","texto":"Se han expresado y defendido puntos de vista con claridad, proporcionando explicaciones y argumentos adecuados."},{"letra":"k)","texto":"Se ha respondido a preguntas relativas a su vida socio-profesional, incluidas las propias de una entrevista de trabajo."}]},{"descripcion":"Redacta documentos e informes, propios del sector o de la vida académica y cotidiana, relacionando los recursos lingüísticos con el propósito de los mismos.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han escrito textos claros y detallados sobre una variedad de temas relacionados con su profesión, sintetizando y evaluando información y argumentos procedentes de varias fuentes."},{"letra":"b)","texto":"Se ha cumplimentado documentación específica de su campo profesional, utilizando vocabulario específico y protocolos y normas de relación social propios del país."},{"letra":"c)","texto":"Se ha organizado la información con corrección, precisión, con cohesión y coherencia, solicitando y/o facilitando información de tipo general o detallada."},{"letra":"d)","texto":"Se han cumplimentado textos mediante apoyos visuales y claves lingüísticas."},{"letra":"e)","texto":"Se han elaborado informes, destacando los aspectos significativos y ofreciendo detalles relevantes que sirvan de apoyo."},{"letra":"f)","texto":"Se han escrito cartas, formales e informales, empleando las fórmulas de cortesía establecidas y el vocabulario específico para la elaboración de las mismas."},{"letra":"g)","texto":"Se han resumido diferentes tipos de documentos escritos, utilizando sus propios recursos lingüísticos."},{"letra":"h)","texto":"Se han utilizado las fórmulas de cortesía propias del documento que se va a elaborar."}]},{"descripcion":"Aplica actitudes y comportamientos profesionales en situaciones de comunicación, describiendo las relaciones típicas características del país de la lengua extranjera.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han definido los rasgos más significativos de las costumbres y usos de la comunidad donde se habla la lengua extranjera."},{"letra":"b)","texto":"Se han descrito los protocolos y normas de relación social propios del país."},{"letra":"c)","texto":"Se han identificado los valores y creencias propios de la comunidad donde se habla la lengua extranjera."},{"letra":"d)","texto":"Se ha identificado los aspectos socio-profesionales propios del sector, en cualquier tipo de texto."},{"letra":"e)","texto":"Se han aplicado los protocolos y normas de relación social propios del país de la lengua extranjera."},{"letra":"f)","texto":"Se han reconocido los marcadores lingüísticos de la procedencia regional."}]}]},{"cod":"1709","nombre":"Itinerario personal para la empleabilidad I","horasSem":"3","horasTotal":"100","ras":[{"descripcion":"Distingue las características del sector productivo y define los puestos de trabajo relacionándolos con las competencias profesionales expresadas en el título.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han analizado las principales oportunidades de empleo y de inserción laboral en el sector profesional, identificando las posibilidades de empleo y analizado sus requerimientos actuales para el perfil profesional."},{"letra":"b)","texto":"Se ha comparado los diferentes requerimientos exigidos por el mercado laboral con las exigencias para el trabajo en la función pública relacionados con el sector privado."},{"letra":"c)","texto":"Se ha reflexionado sobre las actitudes y aptitudes requeridas actualmente para la actividad profesional relacionadas con el título, así como las competencias personales y sociales más relevantes para el sector identificando nuestra zona de desarrollo próximo."}]},{"descripcion":"Adquiere las competencias necesarias para el desempeño de las funciones de nivel básico en Prevención de Riesgos Laborales.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se ha valorado la importancia de la cultura preventiva en todos los ámbitos actividades de la empresa u organismo equiparado relacionado las condiciones laborales con la salud de la persona trabajadora identificando y clasificando los factores de riesgo en la actividad y los daños derivados de los mismos, especialmente las situaciones de riesgo más habituales en los entornos de trabajo del sector profesional relacionado con el título."},{"letra":"b)","texto":"Se han clasificado y descrito los tipos de daños profesionales, con especial referencia a accidentes de trabajo y enfermedades profesionales, relacionados con el perfil profesional del título."},{"letra":"c)","texto":"Se ha determinado la evaluación de riesgos en la empresa u organismo equiparado y definido las técnicas de prevención y de protección que deben aplicarse para evitar los daños en su origen y minimizar sus consecuencias."},{"letra":"d)","texto":"Se han analizado los protocolos de actuación en caso de emergencia."},{"letra":"e)","texto":"Se han determinado los principales derechos y deberes en materia de prevención de riesgos laborales."},{"letra":"f)","texto":"Se han clasificado las distintas formas de gestión de la prevención en la empresa u organismo equiparado, en función de los distintos criterios establecidos en la normativa sobre prevención de riesgos laborales y determinado las formas de representación de las personas trabajadoras en la empresa u organismo equiparado en materia de prevención de riesgos."},{"letra":"g)","texto":"Se ha valorado la importancia de la existencia de un plan preventivo en la empresa u organismo equiparado que incluya la secuenciación de actuaciones a realizar en caso de emergencia y reflexionado sobre el contenido del mismo."},{"letra":"h)","texto":"Se han determinado los requisitos y condiciones para la vigilancia de la salud de la persona trabajadora y su importancia como medida de prevención."},{"letra":"i)","texto":"Se han identificado las técnicas básicas de primeros auxilios que han de ser aplicadas en el lugar del accidente ante distintos tipos de daños y la composición y uso del botiquín."}]},{"descripcion":"Analiza sus condiciones laborales como persona trabajadora por cuenta ajena identificándolas en los principales tipos de cambios y vicisitudes relevantes que se pueden presentar en la relación laboral en la normativa laboral y especialmente en el convenio colectivo del sector.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han analizado los derechos y obligaciones derivados de la relación laboral, así como las condiciones de trabajo pactadas en un convenio colectivo aplicable al sector profesional relacionado con el título."},{"letra":"b)","texto":"Se han comparado las principales modalidades de contratación, localizando los diferentes modelos en las fuentes oficiales."},{"letra":"c)","texto":"Se han identificado las características definitorias de los nuevos entornos de organización del trabajo y los derechos que conlleva."},{"letra":"d)","texto":"Se han identificado los diferentes componentes del recibo de salario."},{"letra":"e)","texto":"Se han identificado los recursos laborales existentes ante las diferentes vicisitudes que se pueden dar en la relación laboral."},{"letra":"f)","texto":"Se ha valorado el p fortalezas personales con valor para el empleo."}]},{"descripcion":"Aplica las estrategias para el aprendizaje autónomo reconociendo su valor profesionalizador, diseñando y optimizando su propio entorno de aprendizaje haciendo uso de las tecnologías digitales como herramientas de aprendizaje autónomo, siendo coherente con su identidad digital y sus propios objetivos profesionales planteados en su plan de desarrollo individual.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se ha tomado conciencia de la responsabilidad individual en el desarrollo profesional valorando la actitud de aprendizaje permanente para el desarrollo de propias y nuevas competencias."},{"letra":"b)","texto":"Se ha identificado la empleabilidad como capacidad de adaptación al entorno laboral."},{"letra":"c)","texto":"Se han conocido y utilizado herramientas, fuentes de información, conexiones y actividades para la configuración de un entorno personal de aprendizaje para la empleabilidad."},{"letra":"d)","texto":"Se ha puesto en práctica la competencia digital para configurar un entorno personal de aprendizaje para la empleabilidad."},{"letra":"e)","texto":"Se ha analizado el concepto de identidad digital y su impacto en la empleabilidad."},{"letra":"f)","texto":"Se ha justificado el diseño de su entorno de aprendizaje basado en cómo este mejora la empleabilidad."},{"letra":"g)","texto":"Se ha elaborado su plan de desarrollo individual como herramienta para la mejora de la empleabilidad."},{"letra":"h)","texto":"Se han aplicado las herramientas de aprendizaje autónomo para su desarrollo personal y profesional."},{"letra":"i)","texto":"Se ha diseñado el entorno de aprendizaje que permite alcanzar el plan de desarrollo individual."}]}]},{"cod":"0373","nombre":"Lenguajes de marcas y sistemas de gestión de información","horasSem":"2","horasTotal":"67","ras":[{"descripcion":"Reconoce las características de lenguajes de marcas analizando e interpretando fragmentos de código.","etiqueta":"(RA1)","ces

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciclos Formativos · Informática y Comunicaciones</title>
<style>
:root{
  --azul:#1f5c8b;
  --azul-osc:#154a70;
  --naranja:#c1610a;
  --gris-fondo:#f4f6f8;
  --gris-borde:#e0e4e8;
  --texto:#222;
  --texto-suave:#5a6570;
}
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--gris-fondo);color:var(--texto);text-align:center;}
html.bloqueado, html.bloqueado body{overflow:hidden !important;height:100%;}

header.cabecera{
  background:#fff;
  border-bottom:1px solid var(--gris-borde);
  padding:14px 24px;
  text-align:center;
}
.cabecera-contenido h1{
  font-size:16px;
  margin:0 0 4px 0;
  font-weight:600;
  color:var(--texto);
}
.cabecera-contenido a.enlace-oficial{
  font-size:12px;
  color:var(--azul);
  text-decoration:none;
}
.cabecera-contenido a.enlace-oficial:hover{text-decoration:underline;}

main{max-width:1100px;margin:0 auto;padding:20px 24px 60px;text-align:center;}

.buscador-wrap{
  display:flex;
  gap:10px;
  margin:0 auto 22px;
  flex-wrap:wrap;
  justify-content:center;
  max-width:700px;
}
#buscador{
  flex:1;
  min-width:240px;
  padding:10px 14px;
  border:1px solid var(--gris-borde);
  border-radius:8px;
  font-size:14px;
  text-align:center;
}
#filtroNivel{
  padding:10px 14px;
  border:1px solid var(--gris-borde);
  border-radius:8px;
  font-size:14px;
  background:#fff;
  text-align:center;
}

.categoria-titulo{
  font-size:15px;
  color:var(--azul-osc);
  margin:26px 0 10px 0;
  border-bottom:2px solid var(--azul);
  padding-bottom:6px;
  text-align:center;
}
.grid-ciclos{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:14px;
  text-align:center;
}
.tarjeta-ciclo{
  background:#fff;
  border:1px solid var(--gris-borde);
  border-radius:10px;
  padding:16px;
  cursor:pointer;
  transition:box-shadow .15s, transform .15s;
  text-align:center;
}
.tarjeta-ciclo:hover{
  box-shadow:0 4px 14px rgba(0,0,0,.08);
  transform:translateY(-2px);
}
.tarjeta-ciclo h3{
  font-size:14.5px;
  margin:0 0 6px 0;
  color:var(--texto);
}
.tarjeta-ciclo p{
  font-size:12px;
  color:var(--texto-suave);
  margin:0;
}

#resultadosModulos{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;text-align:center;}
.tarjeta-modulo{
  background:#fff;
  border:1px solid var(--gris-borde);
  border-radius:10px;
  padding:14px 16px;
  cursor:pointer;
  transition:box-shadow .15s, transform .15s;
  text-align:center;
}
.tarjeta-modulo:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-2px);}
.tarjeta-modulo .cod-badge{
  display:inline-block;
  background:var(--azul);
  color:#fff;
  font-size:11px;
  padding:2px 7px;
  border-radius:5px;
  margin-bottom:6px;
}
.tarjeta-modulo h4{font-size:14px;margin:0 0 6px 0;}
.tarjeta-modulo p{font-size:11.5px;color:var(--texto-suave);margin:0;}

.oculto{display:none !important;}

.sin-resultados{color:var(--texto-suave);font-size:13px;padding:20px 0;text-align:center;}

/* Vista de ciclo a pantalla completa */
.vista-ciclo{
  position:fixed;inset:0;
  background:#fff;
  z-index:1000;
  display:flex;
  flex-direction:column;
  text-align:center;
}
.vista-header{
  background:var(--azul);
  color:#fff;
  padding:14px 24px;
  flex-shrink:0;
  text-align:center;
}
.btn-volver{
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.4);
  color:#fff;
  padding:6px 14px;
  border-radius:6px;
  cursor:pointer;
  font-size:13px;
  margin-bottom:10px;
}
.btn-volver:hover{background:rgba(255,255,255,.28);}
.vista-header h2{margin:0 0 4px 0;font-size:19px;}
.vista-header .vista-meta{font-size:12.5px;opacity:.9;}

.vista-body{
  flex:1;
  overflow-y:auto;
  padding:22px 24px 60px;
  max-width:1000px;
  margin:0 auto;
  width:100%;
  text-align:center;
}
.curso-bloque{margin-bottom:28px;}
.curso-bloque h3{font-size:15px;color:var(--azul-osc);border-bottom:1px solid var(--gris-borde);padding-bottom:6px;text-align:center;}

table.tabla-modulos{width:100%;border-collapse:collapse;font-size:13.5px;text-align:center;}
table.tabla-modulos th{
  text-align:center;
  padding:8px 10px;
  background:#eef2f5;
  font-size:12px;
  color:var(--texto-suave);
}
table.tabla-modulos td{padding:9px 10px;border-bottom:1px solid var(--gris-borde);text-align:center;}
.fila-modulo{cursor:pointer;}
.fila-modulo:hover td{background:#f0f5f9;}
.fila-modulo.abierta td{
  background:var(--naranja) !important;
  color:#fff;
  font-weight:bold;
}
.cod-mod{color:var(--azul);font-weight:600;margin-right:2px;}
.fila-modulo.abierta .cod-mod{color:#fff;}

.fila-detalle td{background:#fbfbfb;padding:0;}
.fila-detalle .detalle-contenido{padding:16px 20px;text-align:center;}
.ra-card{
  border:1px solid var(--gris-borde);
  border-radius:8px;
  margin-bottom:12px;
  overflow:hidden;
  text-align:center;
}
.ra-header{
  background:#eef2f5;
  padding:9px 14px;
  font-size:13.5px;
  text-align:center;
}
.ra-header .etiqueta-ra{color:var(--texto-suave);font-size:12px;margin-left:6px;}
.ra-body{padding:10px 14px;text-align:center;}
.ce-list{list-style:none;margin:0;padding:0;text-align:center;}
.ce-item{
  font-size:13px;
  padding:5px 0;
  border-bottom:1px dashed var(--gris-borde);
  text-align:center;
}
.ce-item:last-child{border-bottom:none;}
.ce-letter{font-weight:600;color:var(--azul);margin-right:6px;}
.sin-ra{color:var(--texto-suave);font-size:13px;font-style:italic;text-align:center;}

footer.pie{
  text-align:center;
  font-size:11px;
  color:var(--texto-suave);
  padding:20px 24px 40px;
}
footer.pie a{color:var(--azul);}
</style>
</head>

ias con exponentes enteros): propiedades, relaciones entre ellas y aplicación en la resolución de problemas. Estrategias de cálculo: mental y con calculadora."},{"letra":"—","texto":"Divisores y múltiplos: relaciones y uso de la factorización en números primos en la resolución de problemas."},{"letra":"—","texto":"Razones, proporciones y porcentajes: comprensión y resolución de problemas. Utilización en contextos cotidianos y profesionales: aumentos y disminuciones porcentuales, rebajas, descuentos, impuestos, etc."},{"letra":"—","texto":"Proporcionalidad directa e inversa: comprensión y uso en la resolución de problemas de escalas, cambios de divisas, etc."},{"letra":"—","texto":"Toma de decisiones: consumo responsable, relaciones calidad-precio y valor-precio en contextos cotidianos y profesionales."}]},{"descripcion":"E. Sentido algebraico.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Patrones. Identificación y extensión determinando la regla de formación de diversas estructuras: numéricas, espaciales, gráficas o algebraicas."},{"letra":"—","texto":"Variable: comprensión y expresión de relaciones sencillas mediante lenguaje algebraico. Equivalencia entre expresiones algebraicas de primer grado."},{"letra":"—","texto":"Ecuaciones lineales: resolución algebraica y gráfica en contextos de resolución de problemas e interpretación de las soluciones."},{"letra":"—","texto":"Relaciones lineales y de proporcionalidad inversa: interpretación en situaciones contextualizadas descritas mediante un enunciado, tabla, gráfica o expresión analítica."},{"letra":"—","texto":"Herramientas tecnológicas: utilización en la resolución de problemas."},{"letra":"—","texto":"Estrategias para la interpretación y modificación de algoritmos. Formulación de problemas susceptibles de ser analizados utilizando programas y otras herramientas."}]},{"descripcion":"F. Sentido estocástico.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Diseño de estudios estadísticos: formulación de preguntas, organización de datos, realización de tablas y gráficos adecuados, cálculo e interpretación de medidas de localización y dispersión con calculadora y hoja de cálculo."},{"letra":"—","texto":"Análisis crítico e interpretación de información estadística en contextos cotidianos y obtención de conclusiones razonadas."},{"letra":"—","texto":"Fenómenos deterministas y aleatorios. Azar y aproximación a la probabilidad: frecuencias relativas. Regla de Laplace y técnicas de recuento. Toma de decisiones sobre experimentos simples en diferentes contextos."}]},{"descripcion":"G. La materia y sus cambios.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Teoría cinético-molecular: aplicación y explicación de las propiedades más importantes de los sistemas materiales."},{"letra":"—","texto":"Composición de la materia: descripción a partir de los conocimientos sobre la estructura de los átomos y de los compuestos."},{"letra":"—","texto":"Nomenclatura de sustancias químicas de mayor relevancia o relacionadas con la familia profesional correspondiente, según las normas de la IUPAC."},{"letra":"—","texto":"Experimentación con los sistemas materiales: conocimiento y descripción de sus propiedades, composición y clasificación."}]},{"descripcion":"I. El cuerpo humano y la salud.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"La función de nutrición y su importancia. Anatomía y fisiología de los aparatos digestivo, respiratorio, circulatorio y excretor. Relación entre ellos."},{"letra":"—","texto":"La función de reproducción y su relevancia biológica. El aparato reproductor: anatomía y fisiología."},{"letra":"—","texto":"Educación afectivo-sexual desde la perspectiva de la igualdad entre personas y el respeto a la diversidad sexual. La importancia de las prácticas sexuales responsables. La asertividad y el autocuidado. La prevención de infecciones de transmisión sexual (ITS) y de embarazos no deseados. El uso adecuado de métodos anticonceptivos y de métodos de prevención de ITS."},{"letra"  derechos y deberes democráticos. La ciudadanía democrática: la participación, la responsabilidad ética y ecosocial, participación en proyectos comunitarios."},{"letra":"—","texto":"La Declaración Universal de los Derechos Humanos: origen y justificación."},{"letra":"—","texto":"El problema de la desigualdad. La solidaridad con colectivos en situaciones de pobreza, vulnerabilidad y exclusión social."},{"letra":"—","texto":"La emergencia climática y los problemas ecosociales. La conciencia ambiental. Compromiso y acción ante los Objetivos de Desarrollo Sostenible. Los efectos de la globalización en las sociedades actuales."}]},{"descripcion":"B. Comunicación en lengua castellana.","etiqueta":"(SB)","ces":[{"letra":null,"texto":"Alfabetización mediática e informacional."},{"letra":"—","texto":"Aspectos básicos de la propiedad intelectual."},{"letra":"—","texto":"Estrategias de organización de la información: notas esquemas, mapas conceptuales, resúmenes, etc."},{"letra":"—","texto":"Tecnologías de la información. Dispositivos, aplicaciones informáticas y plataformas digitales de búsqueda de información."},{"letra":null,"texto":"Comunicación."},{"letra":"—","texto":"Contexto: grado de formalidad de la situación; carácter público o privado; propósitos comunicativos e interpretación de intenciones; canal de comunicación y elementos no verbales de la comunicación."},{"letra":"—","texto":"Mecanismos de coherencia, cohesión y adecuación textual."},{"letra":"—","texto":"Géneros discursivos propios del ámbito social. Redes sociales y medios de comunicación. Etiqueta digital y riesgos de desinformación, manipulación y vulneración de la privacidad. Análisis de la imagen y de los elementos paratextuales de los textos icónico-verbales y multimodales."},{"letra":"—","texto":"Interacción oral y escrita de carácter informal y formal. Cooperación conversacional, cortesía lingüística y etiqueta digital. Escucha activa, asertividad y resolución dialogada de los conflictos. Estrategias discursivas y dialógicas para la expresión de ideas, la confrontación y el consenso."},{"letra":"—","texto":"Comprensión oral: sentido global del texto. Selección de la información relevante. La intención del emisor. Producción oral formal. Adecuación a la audiencia y al tiempo de exposición. Elementos no verbales. Rasgos discursivos y lingüísticos de la oralidad formal. La deliberación oral argumentada."},{"letra":"—","texto":"Comprensión lectora: sentido global del texto. La intención del emisor."},{"letra":"—","texto":"Producción escrita. Planificación, redacción, revisión y edición en diferentes soportes."},{"letra":"—","texto":"Corrección gramatical y ortográfica. Los signos de puntuación como mecanismo organizador del texto escrito. Su relación con el significado. Uso de diccionarios, manuales de consulta y correctores ortográficos en soporte digital."},{"letra":"—","texto":"Autoconfianza: puesta en valor de los puntos fuertes. El error en la comunicación como oportunidad de mejora."},{"letra":"—","texto":"Lectura guiada de obras relevantes del patrimonio literario nacional y universal y de la literatura actual inscritas en un itinerario temático o de género."},{"letra":"—","texto":"Expresión, a través de modelos, de la experiencia lectora y de diferentes formas de apropiación y recreación de los textos leídos."},{"letra":"—","texto":"Lectura expresiva, dramatización y recitación de los textos atendiendo a los procesos de comprensión, apropiación y oralización implicados."},{"letra":null,"texto":"Reflexión sobre la lengua."},{"letra":"—","texto":"Reconocimiento de las lenguas de España y de las variedades dialectales del español. Las lenguas de signos. Exploración y cuestionamiento de prejuicios y estereotipos lingüísticos."},{"letra":"—","texto":"Aproximación a la lengua como sistema y a sus unidades básicas teniendo en cuenta los diferentes niveles: el sonido y sistema de escritura, las palabras (forma y significado) y su organización en el discurso (orden de las palabras y conexión entre los componentes oracionales)."}]},{"descripcion":"C. Comunicación en Lengua Extranjera.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Autoconfianza. El error como instrumento de mejora."},{"letra":"—","texto":"Funciones comunicativas básicas tanto del ámbito personal como del ámbito profesional de especialización: saludar, despedirse y presentarse; describir a personas, objetos y lugares; situar eventos en el tiempo; situar objetos, personas y lugares en el espacio; pedir e intercambiar información; dar instrucciones y órdenes; ofrecer, aceptar y rechazar ayuda, proposiciones o sugerencias; etc."},{"letra":"—","texto":"Unidades lingüísticas básicas y significados asociados a dichas unidades tales como la expresión de la entidad y sus propiedades; la cantidad y la cualidad; el espacio y las relaciones espaciales; el tiempo y las relaciones temporales; la afirmación; la negación; la interrogación y la exclamación; relaciones lógicas básicas."},{"letra":"—","texto":"Léxico, frases y expresiones de uso común en el ámbito personal y en el ámbito profesional de especialización."},{"letra":"—","texto":"Convenciones ortográficas básicas y significados e intenciones comunicativas asociados a los formatos, patrones y elementos gráficos."},{"letra":"—","texto":"Cortesía lingüística y etiqueta digital."},{"letra":"—","texto":"Aspectos socioculturales y sociolingüísticos básicos relativos a la vida cotidiana y a las situaciones propias del ámbito profesional de especialización."},{"letra":"—","texto":"Estrategias básicas para entender y apreciar la diversidad lingüística y cultural."}]}]},{"cod":"3159","nombre":"Itinerario personal para la empleabilidad","horasSem":"2","horasTotal":"67","ras":[{"descripcion":"Desarrolla actividades de autoconocimiento que le permiten orientarse a campos profesionales motivadores en los que puede desplegar todas sus capacidades.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han evaluado los propios intereses, motivaciones, habilidades y destrezas en el marco de un proceso de autoconocimiento."},{"letra":"b)","texto":"Se han determinado las competencias personales y sociales con valor para el empleo."},{"letra":"c)","texto":"Se ha valorado el concepto de autoestima en el proceso de búsqueda de empleo."},{"letra":"d)","texto":"Se han identificado las fortalezas, debilidades, amenazas y oportunidades propias para la inserción profesional, así como las estrategias para sacarles el mayor aprovechamiento."},{"letra":"e)","texto":"Se han identificado expectativas de futuro para la inserción profesional analizando competencias, intereses y destrezas personales."}]},{"descripcion":"Desarrolla habilidades sociales concretas que se han demostrado como fundamentales a la hora de encontrar un empleo y mantenerlo.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se ha valorado la importancia de las competencias personales y sociales en la empleabilidad."},{"letra":"b)","texto":"Se han aplicado estrategias para canalizar las emociones de manera asertiva en las relaciones con otras personas, diferenciándolas de conductas agresivas y/o pasivas."},{"letra":"c)","texto":"Se han puesto en práctica técnicas de presentación, orales y escritas, para una comunicación efectiva y afectiva valorando su importancia como recurso personal para la empleabilidad."},{"letra":"d)","texto":"Se han identificado los beneficios del trabajo en equipo, así como las diferentes formas de llevarlo a cabo."},{"letra":"e)","texto":"Se ha reaccionado de forma flexible y positiva ante conflictos y situaciones nuevas, aprovechando las oportunidades y gestionando las dificultades haciendo uso de estrategias relacionadas con la inteligencia emocional."}]},{"descripcion":"Accede a la información de los posibles itinerarios académicos y/o profesionales que tiene a su alcance a través de la investigación y la reflexión libre de estereotipos vocacionales.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se ha determinado la realidad del entorno sociolaboral actual."},{"letra":"b)","texto":"Se han identificado los itinerarios académicos y profesionales afines a sus intereses y se han valorado las opciones que mejor se ajustan a sus perfiles profesionales y sus preferencias."},{"letra":"c)","texto":"Se ha valorado la importancia de la formación permanente como factor clave para el empleo y la adaptación al cambio."}]},{"descripcion":"Pone en marcha un itinerario propio analizando las distintas opciones educativas y profesionales, valorando las ventajas e inconvenientes de cada una de ellas y examinando aquellas que mejor se ajustan a sus posibilidades y preferencias.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han valorado las ventajas e inconvenientes de cada una de las opciones posibles."},{"letra":"b)","texto":"Se han analizado y seleccionado las opciones que más se ajustan a sus perfiles profesionales."},{"letra":"c)","texto":"Se ha realizado un proceso de toma de decisiones identificando el itinerario académico y profesional personal, a partir de sus preferencias profesionales, intereses y metas en el marco de un proyecto profesional."}]},{"descripcion":"Conoce las estrategias de acceso al mercado de trabajo por cuenta ajena y utiliza las herramientas necesarias para el proceso de inserción laboral.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se ha analizado la búsqueda de empleo como un proceso."},{"letra":"b)","texto":"Se han identificado las diferentes fuentes de información de acceso al empleo."},{"letra":"c)","texto":"Se han analizado las distintas técnicas utilizadas para la búsqueda de empleo por cuenta ajena."},{"letra":"d)","texto":"Se han puesto en práctica las diferentes herramientas que permitan una búsqueda de empleo óptima."}]}]},{"cod":"3029","nombre":"Montaje y mantenimiento de sistemas y componentes informáticos","horasSem":"7","horasTotal":"233","ras":[{"descripcion":"Selecciona los componentes y herramientas para la realización del montaje y mantenimiento de sistemas microinformáticos, describiéndolos y relacionándolos con su función y aplicación en la instalación.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han descrito las características de los elementos eléctricos y electrónicos utilizados en el montaje de sistemas."},{"letra":"b)","texto":"Se han descrito las operaciones y comprobaciones previas a la manipulación segura de componentes eléctricos y/o electrónicos."},{"letra":"c)","texto":"Se han identificado los dispositivos y herramientas necesarios en la manipulación segura de sistemas electrónicos."},{"letra":"d)","texto":"Se han seleccionado las herramientas necesarias para el procedimiento de montaje, sustitución o conexión de componentes hardware de un sistema microinformático."},{"letra":"e)","texto":"Se han identificado funcionalmente los componentes hardware para el ensamblado y/o mantenimiento de un equipo microinformático."},{"letra":"f)","texto":"Se han descrito las características técnicas de cada uno de los componentes hardware (internos y externos) utilizados en el montaje y/o mantenimiento de un equipo microinformático."},{"letra":"g)","texto":"Se han localizado los bloques funcionales en placas bases utilizadas en los sistemas microinformáticos."},{"letra":"h)","texto":"Se han identificado los tipos de puertos, bahías internas y cables de conexión (de datos y eléctricos, entre otros) existentes de un equipo microinformático."},{"letra":"i)","texto":"Se han seguido las instrucciones recibidas."}]},{"descripcion":"Ensambla los componentes hardware de un equipo microinformático, interpretando guías e instrucciones y aplicando técnicas de montaje.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se ha comprobado cada componente antes de su utilización, siguiendo las normas de seguridad establecidas."},{"letra":"b)","texto":"Se han interpretado las guías de instrucciones referentes a los procedimientos de integración o ensamblado, sustitución y conexión del componente hardware de un sistema microinformático."},{"letra":"c)","texto":"Se han reconocido en distintas placas base cada uno de los zócalos de conexión de microprocesadores y los disipadores, entre otros."},{"letra":"d)","texto":"Se han ensamblado los componentes hardware internos (memoria, procesador, tarjeta de video, pila, entre otros) en la placa base del sistema microinformático."},{"letra":"e)","texto":"Se ha fijado cada dispositivo o tarjeta en la ranura o bahía correspondiente, según guías detalladas de instalación."},{"letra":"f)","texto":"Se han conectado adecuadamente aquellos componentes hardware internos (disco duro, DVD, CD-ROM, entre otros) que necesiten cables de conexión para su integración en el sistema microinformático."}]},{"descripcion":"Instala sistemas operativos monopuesto identificando las fases del proceso y relacionándolas con la funcionalidad de la instalación.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han descrito los pasos a seguir para la instalación o actualización."},{"letra":"b)","texto":"Se ha verificado la ausencia de errores durante el proceso de carga del sistema operativo."},{"letra":"c)","texto":"Se han utilizado las herramientas de control para la estructura de directorios y la gestión de permisos."},{"letra":"d)","texto":"Se han instalado actualizaciones y parches del sistema operativo según las instrucciones recibidas."},{"letra":"e)","texto":"Se han realizado copias de seguridad de los datos"},{"letra":"f)","texto":"Se han anotado los posibles fallos producidos en la fase de arranque del equipo microinformático."},{"letra":"g)","texto":"Se han descrito las funciones de replicación física (“clonación”) de discos y particiones en sistemas microinformáticos."},{"letra":"h)","texto":"Se han utilizado herramientas software para la instalación de imágenes de discos o particiones señalando las restricciones de aplicación de las mismas."},{"letra":"i)","texto":"Se ha verificado la funcionalidad de la imagen instalada, teniendo en cuenta el tipo de “clonación” realizada."}]},{"descripcion":"Comprueba la funcionalidad de los sistemas, soportes y periféricos instalados relacionando las intervenciones con los resultados a conseguir.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se ha aplicado a cada componente hardware y periférico el procedimiento de testeo adecuado."},{"letra":"b)","texto":"Se ha verificado que el equipo microinformático realiza el procedimiento de encendido y de POST (Power On Self Test), identificando el origen de los problemas, en su caso."},{"letra":"c)","texto":"Se ha comprobado la funcionalidad de los soportes para almacenamiento de información."},{"letra":"d)","texto":"Se ha verificado la funcionalidad en la conexión entre componentes del equipo microinformático y con los periféricos."},{"letra":"e)","texto":"Se han utilizado herramientas de configuración, testeo y comprobación para verificar el funcionamiento del sistema."},{"letra":"f)","texto":"Se han utilizado las herramientas y guías de uso para comprobar el estado de los soportes y de la información contenida en los mismos."},{"letra":"g)","texto":"Se han registrado los resultados y las incidencias producidas en los procesos de comprobación."}]},{"descripcion":"Realiza el mantenimiento básico de sistemas informáticos, soportes y periféricos, relacionando las intervenciones con los resultados que hay que conseguir.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se ha comprobado por medio de indicadores luminosos, que los periféricos conectados tienen alimentación eléctrica y las conexiones de datos."},{"letra":"b)","texto":"Se han descrito los elementos consumibles necesarios para ser utilizados en los periféricos de sistemas microinformáticos."},{"letra":"c)","texto":"Se han utilizado las guías técnicas detalladas para sustituir elementos consumibles."},{"letra":"d)","texto":"Se han descrito las características de los componentes, de los soportes y de los periféricos para conocer los aspectos que afecten a su mantenimiento."},{"letra":"e)","texto":"Se han utilizado las guías de los fabricantes para identificar los procedimientos de limpieza de componentes, soportes y periféricos."},{"letra":"f)","texto":"Se ha realizado la limpieza de componentes, soportes y periféricos respetando las disposiciones técnicas establecidas por el fabricante manteniendo su funcionalidad."},{"letra":"g)","texto":"Se han recogido los residuos y elementos desechables de manera adecuada para su eliminación o reciclaje."}]},{"descripcion":"Almacena equipos, periféricos y consumibles, describiendo las condiciones de conservación y etiquetado.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han descrito las condiciones para manipular, transportar y almacenar componentes y periféricos de un sistema microinformático."},{"letra":"b)","texto":"Se han identificado los tipos de embalaje para el transporte y/o almacenaje de cada dispositivo, periférico y consumible."},{"letra":"c)","texto":"Se han utilizado las herramientas necesarias para realizar las tareas de etiquetado previas al embalaje y/o almacenamiento de sistemas, periféricos y consumibles."},{"letra":"d)","texto":"Se han utilizado los medios auxiliares adecuados a los elementos a transportar."},{"letra":"e)","texto":"Se han aplicado las normas de seguridad en la manipulación y el transporte de elementos y equipos."},{"letra":"f)","texto":"Se ha comprobado que los componentes recepcionados se corresponden con el albarán de entrega y que se encuentran en buen estado."},{"letra":"g)","texto":"Se han registrado las operaciones realizadas siguiendo los formatos establecidos."},{"letra":"h)","texto":"Se han recogido los elementos desechables para su eliminación o reciclaje."}]}]},{"cod":"3031","nombre":"Ofimática y archivo de documentos","horasSem":"10","horasTotal":"333","ras":[{"descripcion":"Tramita información en línea aplicando herramientas de Internet, intranet y otras redes.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han identificado las distintas redes informáticas a las que podemos acceder."},{"letra":"b)","texto":"Se han diferenciado distintos métodos de búsqueda de información en redes informáticas."},{"letra":"c)","texto":"Se ha accedido a información a través de Internet, intranet y otras redes de área local."},{"letra":"d)","texto":"Se han localizado documentos utilizando herramientas de Internet."},{"letra":"e)","texto":"Se han situado y recuperado archivos almacenados en servicios de alojamiento de archivos compartidos (“la nube”)."},{"letra":"f)","texto":"Se ha comprobado la veracidad de la información localizada."},{"letra":"g)","texto":"Se ha valorado la utilidad de páginas institucionales y de Internet en general para la realización de trámites administrativos."}]},{"descripcion":"Realiza comunicaciones internas y externas mediante las utilidades de correo electrónico siguiendo las pautas marcadas.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han identificado los diferentes procedimientos de trasmisión y recepción de mensajes internos y externos."},{"letra":"b)","texto":"Se ha utilizado el correo electrónico para enviar y recibir mensajes, tanto internos como externos."},{"letra":"c)","texto":"Se han anexado documentos, vínculos, entre otros en mensajes de correo electrónico."},{"letra":"d)","texto":"Se han empleado las utilidades del correo electrónico para clasificar contactos y listas de distribución de información entre otras."},{"letra":"e)","texto":"Se han aplicado criterios de prioridad, importancia y seguimiento entre otros en el envío de mensajes siguiendo las instrucciones recibidas."},{"letra":"f)","texto":"Se han comprobado las medidas de seguridad y confidencialidad en la custodia o envío de información siguiendo pautas prefijadas."},{"letra":"g)","texto":"Se ha organizado la agenda incluyendo tareas, avisos y otras herramientas de planificación de trabajo."}]},{"descripcion":"Elabora documentos utilizando las funciones básicas del procesador de texto.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han identificado las funciones básicas, prestaciones y procedimientos simples de los procesadores de texto y autoedición."},{"letra":"b)","texto":"Se han identificado las funciones y utilidades que garanticen las normas de seguridad, integridad y confidencialidad de la información."},{"letra":"c)","texto":"Se ha localizado el documento, abierto y guardado posteriormente el documento en el formato y dirección facilitados, nombrándolos significativamente para su posterior acceso."},{"letra":"d)","texto":"Se han configurado las distintas páginas del documento ciñéndose a los originales o indicaciones propuestas: márgenes, dimensiones y orientación, tablas, encabezados y pies de página, encolumnados, bordes, sombreados u otros."},{"letra":"e)","texto":"Se ha trabajado con la opción de tablas han elaborado los documentos con exactitud y con la destreza adecuada, aplicando los formatos y estilos de texto, tablas indicadas, o sobre plantillas predefinidas."},{"letra":"f)","texto":"Se han corregido los posibles errores cometidos al reutilizar o introducir la información."},{"letra":"g)","texto":"Se han integrado objetos simples en el texto, en el lugar y forma adecuados."},{"letra":"h)","texto":"Se han configurado las diferentes opciones de impresión en función de la información facilitadas."},{"letra":"i)","texto":"Se ha realizado la impresión de los documentos elaborados."},{"letra":"j)","texto":"Se han utilizado las funciones y utilidades del procesador de textos que garanticen la seguridad, integridad y confidencialidad de la información de acuerdo con las indicaciones recibidas."}]},{"descripcion":"Elabora documentos utilizando las aplicaciones básicas de hojas de cálculo.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han utilizado los diversos tipos de datos y referencia para celdas, rangos, hojas y libros."},{"letra":"b)","texto":"Se han aplicado fórmulas y funciones básicas."},{"letra":"c)","texto":"Se han generado y modificado gráficos de diferentes tipos."},{"letra":"d)","texto":"Se ha utilizado la hoja de cálculo como base de datos sencillos."},{"letra":"e)","texto":"Se ha utilizado aplicaciones y periféricos para introducir textos, números, códigos e imágenes."},{"letra":"f)","texto":"Se han aplicado las reglas de ergonomía y salud en el desarrollo de las actividades."}]},{"descripcion":"Elabora presentaciones gráficas utilizando las aplicaciones informáticas.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han identificado las opciones básicas de las aplicaciones de presentaciones."},{"letra":"b)","texto":"Se reconocen los distintos tipos de vista asociados a una presentación."},{"letra":"c)","texto":"Se han aplicado y reconocido las distintas tipografías y normas básicas de composición, diseño y utilización del color."},{"letra":"d)","texto":"Se han creado presentaciones sencillas incorporando texto, gráficos, objetos y archivos multimedia."},{"letra":"e)","texto":"Se han diseñado plantillas de presentaciones."},{"letra":"f)","texto":"Se han utilizado periféricos para ejecutar presentaciones asegurando el correcto funcionamiento."}]},{"descripcion":"Utilizar los equipos de reproducción, informáticos y de encuadernación funcional, fotocopiadoras, impresoras, escáneres, reproductoras, perforadoras, encuadernadoras u otros en función del trabajo a realizar.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han identificado los principales componentes y necesidades de mantenimiento identificando las incidencias elementales, de acuerdo con los manuales de uso y sistemas de ayuda."},{"letra":"b)","texto":"Se ha descrito el funcionamiento de las fotocopiadoras, impresoras, escáneres, reproductoras, perforadoras, encuadernadoras u otros."},{"letra":"c)","texto":"Se han identificado las posibles incidencias básicas de equipos de reproducción e informáticos, describiendo posibles actuaciones."},{"letra":"d)","texto":"Se han realizado las tareas de limpieza y mantenimiento de útiles de encuadernación, y los ajustes pertinentes para un adecuado funcionamiento."},{"letra":"e)","texto":"Se han identificado los distintos recursos consumibles, tintas y líquidos, papel, cintas y cartuchos de impresión, tóner u otros relacionándoles con los equipos de reproducción e informáticos."},{"letra":"f)","texto":"Se ha manejado los equipos, asumiendo el compromiso de mantener y cuidar éstos, y obteniendo el máximo provecho a los medios utilizados en el proceso, evitando costes y desgastes innecesarios."},{"letra":"g)","texto":"Se ha realizado las siguientes consideraciones durante la actividad:\n− Poner a punto y limpiar las máquinas.\n− Detectar pequeñas averías mecánicas solucionando, si es posible, las contingencias observadas.\n− Aprovisionar con los materiales necesarios las máquinas.\n− Realizar las pruebas de funcionamiento básico de los equipos informáticos y de reproducción.\n− Realizar labores de mantenimiento básico de los equipos informáticos y de oficina.\n− Sustituir consumibles, de entre diversos tipos facilitados, en el equipo que corresponda.\n− Tomar las medidas de seguridad necesarias para comprobar el funcionamiento básico en modo seguro.\n− Utilizar los equipos de protección de acuerdo con los conectores y terminales implicados."}]},{"descripcion":"Obtener encuadernaciones funcionales utilizando los útiles y medios apropiados en función de las características de los documentos tipo.","etiqueta":"(RA7)","ces":[{"letra":"a)","texto":"Se ha identificado la documentación a encuadernar describiendo las características para su encuadernación y los criterios de ordenación más apropiados."},{"letra":"b)","texto":"Se han identificado los distintos útiles y herramientas empleados en las operaciones de encuadernación funcional –guillotina, máquinas de perforar de papel, cizalllas, u otras-, describiendo sus mecanismos, funciones y utilización."},{"letra":"c)","texto":"Se han identificado los distintos tipos de materiales – canutillos, grapas, espirales, anillas, cubiertas u otros- utilizados en la encuadernación funcional."},{"letra":"d)","texto":"Se han descrito los sistemas de reciclaje en función de la naturaleza de los residuos producidos en la encuadernación funcional."},{"letra":"e)","texto":"Se han identificado y descrito los riesgos profesionales derivados de la utilización de las máquinas y herramientas de encuadernación funcional y sus equipos de protección."},{"letra":"f)","texto":"Se ha identificado y comprobado el estado de funcionamiento de las herramientas de encuadernación funcional."},{"letra":"g)","texto":"Se ha organizado la documentación a encuadernar, ordenándola de acuerdo con los criterios establecidos y la correcta utilización de los medios disponibles."},{"letra":"h)","texto":"Se ha utilizado la cizalla u otros útiles análogos realizando distintos cortes de papel con precisión, observando las medidas de seguridad correspondientes."},{"letra":"i)","texto":"Se ha utilizado la máquina de perforar papel de forma correcta."},{"letra":"j)","texto":"Se han realizado encuadernaciones en sus diversas formas –encanutadas, grapadas, espiralado, anillado u otras- asignando el tipo de cubiertas en función de las características del documento y de acuerdo con la información facilitada."},{"letra":"k)","texto":"Se han desechado los residuos en distintos envases de reciclado conforme a su naturaleza."},{"letra":"l)","texto":"Se han aplicado las precauciones y equipos de protección necesarios para realizar con seguridad la encuadernación funcional."},{"letra":"m)","texto":"Se ha comprobado que la encuadernación funcional realizada cumple con los criterios de calidad facilitados e inherentes al tipo de encuadernación."}]}]},{"cod":"A123","nombre":"Prevención de riesgos laborales","horasSem":"1","horasTotal":"33","ras":[{"descripcion":"Conoce los conceptos básicos sobre seguridad y salud en el trabajo.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Diferencia entre los conceptos de prevención y protección."},{"letra":"b)","texto":"Conoce los conceptos de riesgo y daño profesional."},{"letra":"c)","texto":"Reconoce los factores que pueden provocar un riesgo."},{"letra":"d)","texto":"Conoce y diferencia los conceptos de accidente laboral y enfermedad profesional."},{"letra":"e)","texto":"Valora la importancia de la seguridad."},{"letra":"f)","texto":"Conoce sus derechos y obligaciones en materia de prevención de riesgos laborales."},{"letra":"g)","texto":"Conoce la importancia del orden y la limpieza en el trabajo como medida preventiva de accidentes y enfermedades laborales."},{"letra":"h)","texto":"Reconoce la importancia de un buen mantenimiento de los equipos para la eliminación de riesgos profesionales."}]},{"descripcion":"Conoce los aspectos básicos de la prevención y las técnicas generales de evaluación y control de riesgos.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Conoce los factores de riesgo inherentes a los lugares de trabajo."},{"letra":"b)","texto":"Reconoce los riesgos producidos por parámetros físicos (temperatura, ruido, iluminación), químicos y biológicos."},{"letra":"c)","texto":"Conoce el concepto de carga de trabajo y diferencia entre carga física y mental."},{"letra":"d)","texto":"Reconoce los organismos que establecen los planes de emergencia."}]},{"descripcion":"Identifica los riesgos específicos y aplica las medidas de seguridad correspondientes.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Identifica las causas, los riesgos y las medidas que hubieran evitado un accidente, a partir de casos reales."},{"letra":"b)","texto":"Conoce la señalización industrial y la importancia que tiene."},{"letra":"c)","texto":"Reconoce los sistemas de protección colectiva e individual."},{"letra":"d)","texto":"Identifica los equipos de protección individual más comunes que deberá utilizar en el desempeño de su trabajo."},{"letra":"e)","texto":"Detecta los puntos críticos que se deben vigilar en la puesta en marcha de los equipos."},{"letra":"f)","texto":"Identifica los sistemas de detección y extinción de un incendio."},{"letra":"g)","texto":"Identifica los riesgos asociados a contactos eléctricos no deseados."},{"letra":"h)","texto":"Identifica los riesgos asociados al trabajo con gases y recipientes a presión."},{"letra":"i)","texto":"Sabe cómo actuar en caso de accidente y en situaciones de emergencia."},{"letra":"j)","texto":"Conoce los primeros auxilios y cómo se realiza la respiración artificial."}]},{"descripcion":"Aplica las medidas de prevención y seguridad medioambientales correspondientes.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Reconoce la importancia de la recogida selectiva de residuos para el medio ambiente."},{"letra":"b)","texto":"Aplica las normas de prevención de riesgos laborales y protección ambiental requeridas."},{"letra":"c)","texto":"Aplica las medidas de seguridad en la limpieza, funcionamiento y mantenimiento básico de los equipos."}]}]},{"cod":"A998","nombre":"Tutoría I","horasSem":"2","horasTotal":"67","ras":[]}]},{"cursoNombre":"Curso 2º","modulos":[{"cod":"3164","nombre":"Ámbito de Ciencias Aplicadas II","horasSem":"4","horasTotal":"133","ras":[{"descripcion":"A. Destrezas científicas básicas.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Metodologías de la investigación científica: identificación y formulación de cuestiones, elaboración de hipótesis y comprobación mediante experimentación. Proyectos de investigación."},{"letra":"—","texto":"Entornos y recursos de aprendizaje científico (como el laboratorio y los entornos virtuales): utilización adecuada que asegure la conservación de la salud propia y la comunitaria, la seguridad y el respeto al medio ambiente."},{"letra":"—","texto":"Lenguaje científico: interpretación, producción y comunicación eficaz de información de carácter científico en el contexto escolar y profesional en diferentes formatos."},{"letra":"—","texto":"Valoración de la ciencia y de la actividad desarrollada por las personas que se dedican a ella y reconocimiento de su contribución a los distintos ámbitos del saber humano y en el avance y la mejora de la sociedad."},{"letra":"—","texto":"La medida y la expresión numérica de las magnitudes físicas: orden de magnitud, notación científica, indicadores de precisión de las mediciones y los resultados y relevancia de las unidades de medida."},{"letra":"—","texto":"Estrategias de resolución de problemas."}]},{"descripcion":"C. Sentido de la medida.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Estrategias de estimación o cálculo de medidas indirectas de formas planas y tridimensionales y objetos de la vida cotidiana y profesional."},{"letra":"—","texto":"Perímetros, áreas y volúmenes: interpretación, obtención de fórmulas y aplicación en formas planas y tridimensionales."},{"letra":"—","texto":"Representación plana de objetos tridimensionales: visualización y utilización en la resolución de problemas."},{"letra":"—","texto":"Instrumentos de dibujo y herramientas digitales: utilización, realización de dibujos de objetos geométricos con medidas fijadas."}]},{"descripcion":"D. Sentido espacial.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Formas geométricas de dos y tres dimensiones: descripción y clasificación en función de sus propiedades o características."},{"letra":"—","texto":"Objetos geométricos: construcción con instrumentos de dibujo, con herramientas manipulativas y digitales (programas de geometría dinámica, realidad aumentada...)."},{"letra":"—","texto":"Coordenadas cartesianas: localización y descripción de relaciones espaciales."}]},{"descripcion":"E. Sentido algebraico.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Variable: comprensión y expresión de relaciones sencillas mediante lenguaje algebraico. Equivalencia entre expresiones algebraicas de primer y segundo grado."},{"letra":"—","texto":"Ecuaciones lineales y cuadráticas: resolución algebraica y gráfica en contextos de resolución de problemas e interpretación de las soluciones."},{"letra":"—","texto":"Relaciones lineales, cuadráticas y de proporcionalidad inversa: interpretación en situaciones contextualizadas descritas mediante un enunciado, tabla, gráfica o expresión analítica."},{"letra":"—","texto":"Herramientas tecnológicas: utilización en la resolución de problemas."},{"letra":"—","texto":"Estrategias para la interpretación y modificación de algoritmos. Formulación de problemas susceptibles de ser analizados utilizando programas y otras herramientas."}]},{"descripcion":"G. La materia y sus cambios.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Nomenclatura de sustancias químicas de mayor relevancia o relacionadas con la familia profesional correspondiente, según las normas de la IUPAC."},{"letra":"—","texto":"Ecuaciones químicas sencillas: interpretación cualitativa y cuantitativa. Cálculos estequiométricos sencillos e interpretación de los factores que las afectan. Relevancia en el mundo cotidiano y profesional."}]},{"descripcion":"H. Las interacciones y la energía.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Movimiento de los cuerpos: descripción y uso de las magnitudes cinemáticas adecuadas a cada caso."},{"letra":"—","texto":"Relación de las fuerzas con los cambios que producen sobre los sistemas y aplicación a la resolución de problemas de la vida cotidiana y profesional relacionados con las fuerzas presentes en la naturaleza."},{"letra":"—","texto":"La energía: análisis y formulación de hipótesis, propiedades, transferencia y manifestaciones de la energía, relacionando la obtención y consumo de la energía con las repercusiones medioambientales que produce."},{"letra":"—","texto":"La electricidad: corriente eléctrica en circuitos simples. Obtención experimental de magnitudes y relación entre ellas. Medidas de seguridad y prevención."}]},{"descripcion":"K. Sentido socioafectivo.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Estrategias de reconocimiento de las emociones que intervienen en el aprendizaje y desarrollo de la curiosidad, la iniciativa, la perseverancia y la resiliencia, así como del placer de aprender y comprender la ciencia."},{"letra":"—","texto":"Estrategias que aumenten la flexibilidad cognitiva y la apertura a cambios y que ayuden a transformar el error en oportunidad de aprendizaje."},{"letra":"—","texto":"Técnicas cooperativas que optimicen el trabajo en equipo, despliegue de conductas empáticas y estrategias para la gestión de conflictos."},{"letra":"—","texto":"Actitudes inclusivas como la igualdad efectiva de género, la corresponsabilidad, el respeto por las minorías y la valoración de la diversidad presente en el aula y en la sociedad como una riqueza cultural."},{"letra":"—","texto":"Estrategias de identificación y prevención de abusos, de agresiones, de situaciones de violencia o de vulneración de la integridad física, psíquica y emocional."}]}]},{"cod":"3162","nombre":"Ámbito de Comunicación y ciencias sociales II","horasSem":"4","horasTotal":"133","ras":[{"descripcion":"A. Ciencias Sociales","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Riesgos del uso de las tecnologías de la información y de la comunicación. Uso ético de la información. El problema de la desinformación."},{"letra":"—","texto":"Principales hitos de la historia mundial, europea y nacional: causas y consecuencias sociales, políticas, económicas y culturales."},{"letra":"—","texto":"Las relaciones internacionales y el estudio de conflictos y violencias. El Holocausto."},{"letra":"—","texto":"Las formaciones identitarias (ideologías, nacionalismos y movimientos supranacionales)."},{"letra":"—","texto":"La huella humana y la conservación, protección y defensa del patrimonio histórico-artístico, cultural y natural. Significado y función de las expresiones artísticas y culturales en las distintas civilizaciones. La relación del ser humano y la naturaleza a lo largo de la historia."},{"letra":"—","texto":"La contribución del Estado y sus instituciones a la paz, a la seguridad integral ciudadana y a la convivencia social."},{"letra":"—","texto":"España en Europa y el mundo. La seguridad y la cooperación internacional. Los compromisos internacionales de España. La resolución pacífica de los conflictos."},{"letra":"—","texto":"El sistema democrático: su construcción, sus principios básicos y distintos modelos. Instituciones y organizaciones democráticas. La Constitución española y el ordenamiento normativo autonómico, nacional y supranacional."},{"letra":"—","texto":"Diversidad social, multiculturalidad e interculturalidad. El respeto por las minorías etnoculturales. La crítica al eurocentrismo."},{"letra":"—","texto":"El logro de una efectiva igualdad de género. Manifestaciones y conductas no sexistas. El reconocimiento de los derechos LGTBQ+."}]},{"descripcion":"B. Comunicación en Lengua Castellana.","etiqueta":"(SB)","ces":[{"letra":null,"texto":"Alfabetización mediática e informacional."},{"letra":"—","texto":"Estrategias de búsqueda y selección de información fiable, pertinente y de calidad."},{"letra":"—","texto":"Riesgos y consecuencias de la manipulación y la desinformación."},{"letra":"—","texto":"Tecnologías de la información. Dispositivos, aplicaciones informáticas y plataformas digitales de búsqueda de información."},{"letra":null,"texto":"Comunicación."},{"letra":"—","texto":"Secuencias textuales básicas, con especial atención a las expositivas y argumentativas."},{"letra":"—","texto":"Mecanismos de coherencia, cohesión y adecuación textual."},{"letra":"—","texto":"Géneros discursivos propios del ámbito personal: la conversación, con especial atención a los actos de habla que amenazan la imagen del interlocutor (la discrepancia, la queja, la orden, la reprobación)."},{"letra":"—","texto":"Géneros discursivos propios del ámbito profesional: el currículo vitae, la carta de motivación y la entrevista de trabajo."},{"letra":"—","texto":"Interacción oral y escrita de carácter informal y formal. Cooperación conversacional, cortesía lingüística y etiqueta digital. Escucha activa, asertividad y resolución dialogada de los conflictos. Estrategias discursivas y dialógicas para la expresión de ideas, la confrontación y el consenso."},{"letra":"—","texto":"Comprensión oral: sentido global del texto. Selección de la información relevante. La intención del emisor. Producción oral formal. Adecuación a la audiencia y al tiempo de exposición. Elementos no verbales. Rasgos discursivos y lingüísticos de la oralidad formal. La deliberación oral argumentada."},{"letra":"—","texto":"Comprensión lectora: sentido global del texto. La intención del emisor."},{"letra":"—","texto":"Producción escrita. Planificación, redacción, revisión y edición en diferentes soportes."},{"letra":"—","texto":"Corrección gramatical y ortográfica. Los signos de puntuación como mecanismo organizador del texto escrito. Su relación con el significado. Uso de diccionarios, manuales de consulta y correctores ortográficos en soporte digital."},{"letra":"—","texto":"Estrategias de construcción compartida de la interpretación de las obras. Discusiones o conversaciones literarias."},{"letra":"—","texto":"Construcción del sentido de la obra a partir del análisis de sus elementos formales y contextuales. Efectos de sus recursos expresivos en la recepción."},{"letra":"—","texto":"Estrategias de movilización de la experiencia personal, lectora y cultural para establecer vínculos de manera argumentada entre la obra leída y aspectos de la actualidad, así como con otros textos y manifestaciones artísticas."},{"letra":"—","texto":"Reflexión sobre la lengua."},{"letra":"—","texto":"Procedimientos de adquisición y formación de palabras. Reflexión sobre los cambios en su significado, las relaciones semánticas entre palabras y sus valores denotativos y connotativos en función del contexto y el propósito comunicativo."},{"letra":"—","texto":"Análisis de la diversidad lingüística del entorno. Biografía lingüística."}]},{"descripcion":"C. Comunicación en lengua extranjera.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Estrategias básicas para la planificación, ejecución, control y reparación de la comprensión, la producción y la coproducción de textos orales, escritos y multimodales."},{"letra":"—","texto":"Modelos contextuales y géneros discursivos comunes en la comprensión, producción y coproducción de textos orales, escritos y multimodales breves y sencillos tanto del ámbito personal como del ámbito profesional de especialización."},{"letra":"—","texto":"Patrones sonoros, acentuales, rítmicos y de entonación básicos, y significados e intenciones comunicativas generales asociadas a dichos patrones."},{"letra":"—","texto":"Herramientas analógicas y digitales básicas para la comprensión, producción y coproducción oral, escrita y multimodal; y plataformas virtuales de interacción y colaboración para el aprendizaje y la comunicación tanto en el ámbito personal como en el ámbito profesional de especialización."},{"letra":"—","texto":"Estrategias y técnicas para responder eficazmente a una necesidad comunicativa básica y concreta de forma comprensible, a pesar de las limitaciones derivadas del nivel de competencia en la lengua extranjera y en las demás lenguas del repertorio lingüístico propio."},{"letra":"—","texto":"Estrategias básicas para identificar, recuperar y utilizar unidades lingüísticas (léxico, morfosintaxis, patrones sonoros, etc.) a partir de la comparación de las lenguas y variedades que conforman el repertorio lingüístico personal."}]}]},{"cod":"3016","nombre":"Instalación y mantenimiento de redes para transmisión de datos","horasSem":"8","horasTotal":"267","ras":[{"descripcion":"Selecciona los elementos que configuran las redes para la transmisión de voz y datos, describiendo sus principales características y funcionalidad.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han identificado los tipos de instalaciones relacionados con las redes de transmisión de voz y datos."},{"letra":"b)","texto":"Se han identificado los elementos (canalizaciones, cableados, antenas, armarios, «racks» y cajas, entre otros) de una red de transmisión de datos."},{"letra":"c)","texto":"Se han clasificado los tipos de conductores (par de cobre, cable coaxial, fibra óptica, entre otros)."},{"letra":"d)","texto":"Se ha determinado la tipología de las diferentes cajas (registros, armarios, «racks», cajas de superficie, de empotrar, entre otros)."},{"letra":"e)","texto":"Se han descrito los tipos de fijaciones (tacos, bridas, tornillos, tuercas, grapas, entre otros) de canalizaciones y sistemas."},{"letra":"f)","texto":"Se han relacionado las fijaciones con el elemento a sujetar."}]},{"descripcion":"Monta canalizaciones, soportes y armarios en redes de transmisión de voz y datos, identificando los elementos en el plano de la instalación y aplicando técnicas de montaje.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han seleccionado las técnicas y herramientas empleadas para la instalación de canalizaciones y su adaptación."},{"letra":"b)","texto":"Se han tenido en cuenta las fases típicas para el montaje de un «rack»."},{"letra":"c)","texto":"Se han identificado en un croquis del edificio o parte del edificio los lugares de ubicación de los elementos de la instalación."},{"letra":"d)","texto":"Se ha preparado la ubicación de cajas y canalizaciones."},{"letra":"e)","texto":"Se han preparado y/o mecanizado las canalizaciones y cajas."},{"letra":"f)","texto":"Se han montado los armarios («racks») interpretando el plano."},{"letra":"g)","texto":"Se han montado canalizaciones, cajas y tubos, entre otros, asegurando su fijación mecánica."},{"letra":"h)","texto":"Se han aplicado normas de seguridad en el uso de herramientas y sistemas."}]},{"descripcion":"Despliega el cableado de una red de voz y datos analizando su trazado.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han diferenciado los medios de transmisión empleados para voz y datos."},{"letra":"b)","texto":"Se han reconocido los detalles del cableado de la instalación y su despliegue (categoría del cableado, espacios por los que discurre, soporte para las canalizaciones, entre otros)."},{"letra":"c)","texto":"Se han utilizado los tipos de guías pasacables, indicando la forma óptima de sujetar cables y guía."},{"letra":"d)","texto":"Se ha cortado y etiquetado el cable."},{"letra":"e)","texto":"Se han montado los armarios de comunicaciones y sus accesorios."},{"letra":"f)","texto":"Se han montado y conexionado las tomas de usuario y paneles de parcheo."},{"letra":"g)","texto":"Se ha trabajado con la calidad y seguridad requeridas."}]},{"descripcion":"Instala elementos y sistemas de transmisión de voz y datos, reconociendo y aplicando las diferentes técnicas de montaje.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han ensamblado los elementos que consten de varias piezas."},{"letra":"b)","texto":"Se han identificado el cableado en función de su etiquetado o colores."},{"letra":"c)","texto":"Se han colocado los sistemas o elementos (antenas, amplificadores, entre otros) en su lugar de ubicación."},{"letra":"d)","texto":"Se han seleccionado herramientas."},{"letra":"e)","texto":"Se han fijado los sistemas o elementos."},{"letra":"f)","texto":"Se ha conectado el cableado con los sistemas y elementos, asegurando un buen contacto."},{"letra":"g)","texto":"Se han colocado los embellecedores, tapas y elementos decorativos."},{"letra":"h)","texto":"Se han aplicado normas de seguridad, en el uso de herramientas y sistemas."}]},{"descripcion":"Realiza operaciones básicas de configuración en redes locales cableadas relacionándolas con sus aplicaciones.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han descrito los principios de funcionamiento de las redes locales."},{"letra":"b)","texto":"Se han identificado los distintos tipos de redes y sus estructuras alternativas."},{"letra":"c)","texto":"Se han reconocido los elementos de la red local identificándolos con su función."},{"letra":"d)","texto":"Se han descrito los medios de transmisión."},{"letra":"e)","texto":"Se ha interpretado el mapa físico de la red local."},{"letra":"f)","texto":"Se ha representado el mapa físico de la red local."},{"letra":"g)","texto":"Se han utilizado aplicaciones informáticas para representar el mapa físico de la red local."}]},{"descripcion":"Cumple las normas de prevención de riesgos laborales y de protección ambiental, identificando los riesgos asociados, las medidas y sistemas para prevenirlos.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han identificado los riesgos y el nivel de peligrosidad que suponen la manipulación de los materiales, herramientas, útiles, máquinas y medios de transporte."},{"letra":"b)","texto":"Se han operado las máquinas respetando las normas de seguridad."},{"letra":"c)","texto":"Se han identificado las causas más frecuentes de accidentes en la manipulación de materiales, herramientas, máquinas de corte y conformado, entre otras."},{"letra":"d)","texto":"Se han descrito los elementos de seguridad (protecciones, alarmas, pasos de emergencia, entre otros) de las máquinas y los sistemas de protección individual (calzado, protección ocular, indumentaria, entre otros) que se deben emplear en las operaciones de montaje y mantenimiento."},{"letra":"e)","texto":"Se ha relacionado la manipulación de materiales, herramientas y máquinas con las medidas de seguridad y protección personal requeridos."},{"letra":"f)","texto":"Se han identificado las posibles fuentes de contaminación del entorno ambiental."},{"letra":"g)","texto":"Se han clasificado los residuos generados para su retirada selectiva."},{"letra":"h)","texto":"Se ha valorado el orden y la limpieza de instalaciones y sistemas como primer factor de prevención de riesgos."}]}]},{"cod":"3030","nombre":"Operaciones auxiliares para la configuración y la explotación","horasSem":"10","horasTotal":"333","ras":[{"descripcion":"Configura equipos informáticos para su funcionamiento en un entorno monousuario, identificando la funcionalidad de la instalación.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han configurado los parámetros básicos de la instalación."},{"letra":"b)","texto":"Se han aplicado las preferencias en la configuración del entorno personal."},{"letra":"c)","texto":"Se han utilizado los elementos de la interfaz de usuario para preparar el entorno de trabajo."},{"letra":"d)","texto":"Se han reconocido los atributos y los permisos en el sistema de archivos y directorios."},{"letra":"e)","texto":"Se han identificado las funcionalidades para el manejo del sistema de archivos y periféricos"},{"letra":"f)","texto":"Se han utilizado las herramientas del sistema operativo para explorar los soportes de almacenamiento de datos."},{"letra":"g)","texto":"Se han realizado operaciones básicas de protección (instalación de antivirus, realización de copias de seguridad, entre otras)."}]},{"descripcion":"Configura equipos informáticos para su funcionamiento en un entorno de red, identificando los permisos del usuario.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han aplicado preferencias en la configuración del entorno personal."},{"letra":"b)","texto":"Se han configurado y gestionado cuentas de usuario."},{"letra":"c)","texto":"Se ha comprobado la conectividad del servidor con los equipos del cliente."},{"letra":"d)","texto":"Se han utilizado los servicios para compartir recurso."},{"letra":"e)","texto":"Se han asignado permisos a los recursos del sistema que se van a compartir."},{"letra":"f)","texto":"Se ha accedido a los recursos compartidos."},{"letra":"g)","texto":"Se han aplicado normas básicas de seguridad sobre recursos compartidos."}]},{"descripcion":"Utiliza aplicaciones de un paquete ofimático, relacionándolas con sus aplicaciones.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han descrito las funciones y características de un procesador de textos relacionándolas con los tipos de documentos a elaborar."},{"letra":"b)","texto":"Se han utilizado los procedimientos de creación, modificación y manipulación de documentos utilizando las herramientas del procesador de textos."},{"letra":"c)","texto":"Se ha formateado un texto mejorando su presentación utilizando distintos tipos de letras y alineaciones."},{"letra":"d)","texto":"Se han utilizado las funciones para guardar e imprimir documentos elaborados."},{"letra":"e)","texto":"Se han realizado operaciones básicas para el uso de aplicaciones ofimáticas de hoja de cálculo y base de datos, sobre documentos previamente elaborados."},{"letra":"f)","texto":"Se han identificado las funciones básicas una aplicación para presentaciones."},{"letra":"g)","texto":"Se han elaborado presentaciones multimedia aplicando normas básicas de composición y diseño."}]},{"descripcion":"Emplea utilidades proporcionadas por Internet, configurándolas e identificando su funcionalidad y restaciones.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han utilizado las herramientas para la navegación por páginas Web reconociendo la estructura de Internet."},{"letra":"b)","texto":"Se ha personalizado el navegador adecuándolo a las necesidades establecidas."},{"letra":"c)","texto":"Se ha transferido información utilizando los recursos de Internet para descargar, enviar y almacenar ficheros."},{"letra":"d)","texto":"Se han identificado los medios y procedimientos de seguridad durante el acceso a páginas web describiendo los riesgos y fraudes posibles."},{"letra":"e)","texto":"Se han descrito las funcionalidades que ofrecen las herramientas de correo electrónico."},{"letra":"f)","texto":"Se ha creado una cuenta de correo a través de un servidor web que proporcione el servicio."},{"letra":"g)","texto":"Se han utilizado otros servicios disponibles en Internet (foro, mensajería instantánea, redes p2p, videoconferencia; entre otros)."},{"letra":"h)","texto":"Se han configurado las opciones básicas de las aplicaciones."}]}]},{"cod":"3160","nombre":"Proyecto Intermodular de aprendizaje colaborativo","horasSem":"2","horasTotal":"67","ras":[{"descripcion":"Busca información en internet sobre empresas «tipo» del sector/es relacionados con los estándares (unidades) de competencia incluidos en el ámbito profesional del título, elaborando un mapa de las mismas y los servicios o productos que ofrecen.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se ha elaborado conjuntamente un esquema que contemple el conjunto de las empresas tipo del sector."},{"letra":"b)","texto":"Se han constituido equipos de trabajo y se han distribuido entre los grupos las empresas que se analizarán."},{"letra":"c)","texto":"Se ha identificado para la empresa seleccionada los productos o servicios que ofrece."},{"letra":"d)","texto":"Se han relacionado los productos o servicios ofertados con la consecución de los ODS (Objetivos de Desarrollo Sostenible)."},{"letra":"e)","texto":"Se ha realizado un diagrama de bloques de los posibles departamentos que conforman la empresa."},{"letra":"f)","texto":"Se han tenido en cuenta las áreas transversales y su relación con las demás."},{"letra":"g)","texto":"Se ha presentado al gran grupo la configuración de la empresa y productos que ofrece."},{"letra":"h)","texto":"Se ha hecho una valoración de los recursos necesarios para cada unidad."},{"letra":"i)","texto":"Se ha elaborado un informe en un formato establecido con la información recabada, indicando al menos: el sector en el que se encuadra, los principales países donde opera, y las áreas de las que se compone."}]},{"descripcion":"Selecciona un servicio o producto de una empresa del sector relacionándolo con su contribución a los ODS y sus destinatarios a nivel global.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se ha seleccionado un producto/servicio de la empresa a estudio."},{"letra":"b)","texto":"Se ha discutido en grupo con qué ODS pueda estar relacionado."},{"letra":"c)","texto":"Se han identificado las características del público objetivo al que está destinado."},{"letra":"d)","texto":"Se ha comparado el producto con otros de empresas similares."},{"letra":"e)","texto":"Se ha desarrollado una propuesta innovadora para potenciar el producto o servicio."}]},{"descripcion":"Hace una propuesta de una empresa tipo «spin off» indicando los aspectos diferenciales con la empresa de referencia y elaborando un dossier con sus características.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se ha planteado en el grupo el concepto de una empresa tipo «spin off», indicando sus ventajas e inconvenientes."},{"letra":"b)","texto":"Se ha discutido en grupo con qué ODS pueda estar relacionado."},{"letra":"c)","texto":"Se ha propuesto una posible organización de la empresa, atendiendo a una estructura lineal o circular."},{"letra":"d)","texto":"Se han indicado que tecnologías se incluirían para aumentar su competitividad."},{"letra":"e)","texto":"Se han propuesto aspectos innovadores sobre algún producto de la empresa de referencia."}]},{"descripcion":"Relaciona cada unidad de una empresa tipo con la prevención de riesgos profesionales identificando los equipos/sistemas de protección generales y los propios de cada actividad.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se ha analizado la responsabilidad de la empresa y los trabajadores en la consecución de entornos de trabajo seguros."},{"letra":"b)","texto":"Se han identificado los sistemas de protección generales e individuales de cada unidad en función de las actividades a realizar."},{"letra":"c)","texto":"Se ha estimado el coste de los elementos de protección individual."},{"letra":"d)","texto":"Se han propuesto posibles elementos de mejora en relación con la seguridad."}]},{"descripcion":"Transmite información con claridad de manera ordenada y estructurada.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se ha mantenido una actitud ordenada y metódica en la transmisión de la información."},{"letra":"b)","texto":"Se ha transmitido información verbal tanto horizontal como verticalmente."},{"letra":"c)","texto":"Se ha transmitido información entre los miembros del grupo utilizando medios informáticos."},{"letra":"d)","texto":"Se han conocido los términos técnicos en otras lenguas que sean estándares del sector."}]}]},{"cod":"A999","nombre":"Tutoría II","horasSem":"2","horasTotal":"67","ras":[]}]}]},"FPB104":{"codigo":"FPB104","nombre":"Informática y Comunicaciones","categoria":"Ciclo Formativo de Grado Básico","cursos":[{"cursoNombre":"Curso 1º","modulos":[{"cod":"3163","nombre":"Ámbito de Ciencias Aplicadas I","horasSem":"4","horasTotal":"133","ras":[{"descripcion":"A. Destrezas científicas básicas.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Metodologías de la investigación científica: identificación y formulación de cuestiones, elaboración de hipótesis y comprobación mediante experimentación. Proyectos de investigación."},{"letra":"—","texto":"Entornos y recursos de aprendizaje científico (como el laboratorio y los entornos virtuales): utilización adecuada que asegure la conservación de la salud propia y la comunitaria, la seguridad y el respeto al medio ambiente."},{"letra":"—","texto":"Lenguaje científico: interpretación, producción y comunicación eficaz de información de carácter científico en el contexto escolar y profesional en diferentes formatos."},{"letra":"—","texto":"Valoración de la ciencia y de la actividad desarrollada por las personas que se dedican a ella y reconocimiento de su contribución a los distintos ámbitos del saber humano y en el avance y la mejora de la sociedad."},{"letra":"—","texto":"La medida y la expresión numérica de las magnitudes físicas: orden de magnitud, notación científica, indicadores de precisión de las mediciones y los resultados y relevancia de las unidades de medida."},{"letra":"—","texto":"Estrategias de resolución de problemas."}]},{"descripcion":"B. Sentido numérico.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Números naturales, enteros, decimales, racionales e irracionales relevantes (raíces cuadradas, π…): interpretación, ordenación en la recta numérica y aplicación en la resolución de problemas de la vida cotidiana y profesional."},{"letra":"—","texto":"Operaciones o combinación de operaciones con números naturales, enteros, racionales o decimales (suma, resta, multiplicación, división y potencias con exponentes enteros): propiedades, relaciones entre ellas y aplicación en la resolución de problemas. Estrategias de cálculo: mental y con calculadora."},{"letra":"—","texto":"Divisores y múltiplos: relaciones y uso de la factorización en números primos en la resolución de problemas."},{"letra":"—","texto":"Razones, proporciones y porcentajes: comprensión y resolución de problemas. Utilización en contextos cotidianos y profesionales: aumentos y disminuciones porcentuales, rebajas, descuentos, impuestos, etc."},{"letra":"—","texto":"Proporcionalidad directa e inversa: comprensión y uso en la resolución de problemas de escalas, cambios de divisas, etc."},{"letra":"—","texto":"Toma de decisiones: consumo responsable, relaciones calidad-precio y valor-precio en contextos cotidianos y profesionales."}]},{"descripcion":"E. Sentido algebraico.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Patrones. Identificación y extensión determinando la regla de formación de diversas estructuras: numéricas, espaciales, gráficas o algebraicas."},{"letra":"—","texto":"Variable: comprensión y expresión de relaciones sencillas mediante lenguaje algebraico. Equivalencia entre expresiones algebraicas de primer grado."},{"letra":"—","texto":"Ecuaciones lineales: resolución algebraica y gráfica en contextos de resolución de problemas e interpretación de las soluciones."},{"letra":"—","texto":"Relaciones lineales y de proporcionalidad inversa: interpretación en situaciones contextualizadas descritas mediante un enunciado, tabla, gráfica o expresión analítica."},{"letra":"—","texto":"Herramientas tecnológicas: utilización en la resolución de problemas."},{"letra":"—","texto":"Estrategias para la interpretación y modificación de algoritmos. Formulación de problemas susceptibles de ser analizados utilizando programas y otras herramientas."}]},{"descripcion":"F. Sentido estocástico.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Diseño de estudios estadísticos: formulación de preguntas, organización de datos, realización de tablas y gráficos adecuados, cálculo e interpretación de medidas de localización y dispersión con calculadora y hoja de cálculo."},{"letra":"—","texto":"Análisis crítico e interpretación de información estadística en contextos cotidianos y obtención de conclusiones razonadas."},{"letra":"—","texto":"Fenómenos deterministas y aleatorios. Azar y aproximación a la probabilidad: frecuencias relativas. Regla de Laplace y técnicas de recuento. Toma de decisiones sobre experimentos simples en diferentes contextos."}]},{"descripcion":"G. La materia y sus cambios.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Teoría cinético-molecular: aplicación y explicación de las propiedades más importantes de los sistemas materiales."},{"letra":"—","texto":"Composición de la materia: descripción a partir de los conocimientos sobre la estructura de los átomos y de los compuestos."},{"letra":"—","texto":"Nomenclatura de sustancias químicas de mayor relevancia o relacionadas con la familia profesional correspondiente, según las normas de la IUPAC."},{"letra":"—","texto":"Experimentación con los sistemas materiales: conocimiento y descripción de sus propiedades, composición y clasificación."}]},{"descripcion":"I. El cuerpo humano y la salud.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"La función de nutrición y su importancia. Anatomía y fisiología de los aparatos digestivo, respiratorio, circulatorio y excretor. Relación entre ellos."},{"letra":"—","texto":"La función de reproducción y su relevancia biológica. El aparato reproductor: anatomía y fisiología."},{"letra":"—","texto":"Educación afectivo-sexual desde la perspectiva de la igualdad entre personas y el respeto a la diversidad sexual. La importancia de las prácticas sexuales responsables. La asertividad y el autocuidado. La prevención de infecciones de transmisión sexual (ITS) y de embarazos no deseados. El uso adecuado de métodos anticonceptivos y de métodos de prevención de ITS."},{"letra":"—","texto":"La función de relación y su importancia. Los receptores sensoriales, centros de coordinación y órganos efectores: funcionamiento general."},{"letra":"—","texto":"Los hábitos saludables (prevención del consumo de drogas legales e ilegales, postura adecuada, autorregulación emocional, dieta equilibrada, uso responsable de los dispositivos tecnológicos, ejercicio físico e higiene del sueño, entre otros): argumentación científica sobre su importancia."},{"letra":"—","texto":"El sistema inmune, los antibióticos y las vacunas: funcionamiento e importancia social en la prevención y superación de enfermedades infecciosas."},{"letra":"—","texto":"Los trasplantes: análisis de su importancia en el tratamiento de determinadas enfermedades y reflexión sobre la donación de órganos."}]},{"descripcion":"J. La Tierra como sistema y el desarrollo sostenible.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"La atmósfera y la hidrosfera: funciones, papel junto con la biosfera y la geosfera en la edafogénesis e importancia para la vida en la Tierra."},{"letra":"—","texto":"Los ecosistemas: sus componentes bióticos y abióticos y las relaciones intraespecíficas e interespecíficas."},{"letra":"—","texto":"Causas y consecuencias del cambio climático y del deterioro del medio ambiente: importancia de la conservación de los ecosistemas mediante hábitos sostenibles y reflexión sobre los efectos globales de las acciones individuales y colectivas."},{"letra":"—","texto":"Los fenómenos geológicos: diferenciación entre internos y externos, sus manifestaciones y la dinámica global del planeta a la luz de la teoría de la tectónica de placas."},{"letra":"—","texto":"Los riesgos naturales y su prevención: relación con los procesos geológicos y las actividades humanas."}]},{"descripcion":"K. Sentido socioafectivo.","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Estrategias de reconocimiento de las emociones que intervienen en el aprendizaje y de desarrollo de la curiosidad, la iniciativa, la perseverancia y la resiliencia, así como del placer de aprender y comprender la ciencia."},{"letra":"—","texto":"Estrategias que aumenten la flexibilidad cognitiva y la apertura a cambios y que ayuden a transformar el error en oportunidad de aprendizaje."},{"letra":"—","texto":"Técnicas cooperativas que optimicen el trabajo en equipo, despliegue de conductas empáticas y estrategias para la gestión de conflictos."},{"letra":"—","texto":"Actitudes inclusivas como la igualdad efectiva de género, la corresponsabilidad, el respeto por las minorías y la valoración de la diversidad presente en el aula y en la sociedad como una riqueza cultural."},{"letra":"—","texto":"Estrategias de identificación y prevención de abusos, de agresiones, de situaciones de violencia o de vulneración de la integridad física, psíquica y emocional."}]}]},{"cod":"3161","nombre":"Ámbito de Comunicación y ciencias sociales I","horasSem":"4","horasTotal":"133","ras":[{"descripcion":"A. Ciencias Sociales","etiqueta":"(SB)","ces":[{"letra":"—","texto":"Objetivos y estrategias de las Ciencias Sociales: procedimientos, términos y conceptos."},{"letra":"—","texto":"Fuentes históricas y arqueológicas del conocimiento histórico."},{"letra":"—","texto":"Las grandes migraciones humanas y el nacimiento de las primeras culturas."},{"letra":"—","texto":"Las raíces clásicas del mundo occidental: las instituciones, el pensamiento y el arte greco-latino."},{"letra":"—","texto":"La ciudad y el mundo rural a lo largo de la historia: polis, urbes, ciudades, villas y aldeas."},{"letra":"—","texto":"Organización social y política a lo largo de la historia: la transformación política del ser humano (desde la servidumbre a la ciudadanía). La ley como contrato social."},{"letra":"—","texto":"El proceso de construcción europea: integración económica, monetaria y ciudadana. Las instituciones europeas. Ciudadanía europea y global: ideas y actitudes para la formación de una identidad común."},{"letra":"—","texto":"Valores, derechos y deberes democráticos. La ciudadanía democrática: la participación, la responsabilidad ética y ecosocial, participación en proyectos comunitarios."},{"letra":"—","texto":"La Declaración Universal de los Derechos Humanos: origen y justificación."},{"letra":"—","texto":"El problema de la desigualdad. La solidaridad con colectivos en situaciones de pobreza, vulnerabilidad y exclusión social."},{"letra":"—","texto":"La emergencia climática y los problemas ecosociales. La conciencia ambiental. Compromiso y acción ante los Objetivos de Desarrollo Sostenible. Los efectos de la globalización en las sociedades actuales."}]},{"descripcion":"B. Comunicación en lengua castellana.","etiqueta":"(SB)","ces":[{"letra":null,"texto":"Alfabetización mediática e informacional."},{"letra":"—","texto":"Aspectos básicos de la propiedad intelectual."},{"letra":"—","texto":"Estrategias de organización de la información: notas esquemas, mapas conceptuales, resúmenes, etc."},{"letra":"—","texto":"Tecnologías de la información. Dispositivos, aplicaciones informáticas y plataformas digitales de búsqueda de información."},{"letra":null,"texto":"Comunicación."},{"letra":"—","texto":"Contexto: grado de formalidad de la situación; carácter público o privado; propósitos comunicativos e interpretación de intenciones; canal de comunicación y elementos no verbales de la comunicación."},{"letra":"—","texto":"Mecanismos de coherencia, cohesión y adecuación textual."},{"letra":"—","texto":"Géneros discursivos propios del ámbito social. Redes sociales y medios de comunicación. Etiqueta digital y riesgos de desinformación, manipulación y vulneración de la privacidad. Análisis de la imagen y

","ces":[{"letra":"a)","texto":"Se han identificado los principales retos ambientales y sociales."},{"letra":"b)","texto":"Se han relacionado los retos ambientales y sociales con el desarrollo de la actividad económica."},{"letra":"c)","texto":"Se ha analizado el efecto de los impactos ambientales y sociales sobre las personas y los sectores productivos."},{"letra":"d)","texto":"Se han identificado las medidas y acciones encaminadas a minimizar los impactos ambientales y sociales."},{"letra":"e)","texto":"Se ha analizado la importancia de establecer alianzas y trabajar de manera transversal y coordinada para abordar con éxito los retos ambientales y sociales."}]},{"descripcion":"Establece la aplicación de criterios de sostenibilidad en el desempeño profesional y personal, identificando los elementos necesarios.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han identificado los ODS más relevantes para la actividad profesional que realiza."},{"letra":"b)","texto":"Se han analizado los riesgos y oportunidades que representan los ODS."},{"letra":"c)","texto":"Se han identificado las acciones necesarias para atender algunos de los retos ambientales y sociales desde la actividad profesional y el entorno personal."}]},{"descripcion":"Propón productos y servicios responsables teniendo en cuenta los principios de la economía circular.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se ha caracterizado el modelo de producción y consumo actual."},{"letra":"b)","texto":"Se han identificado los principios de la economía verde y circular."},{"letra":"c)","texto":"Se han contrastado los beneficios de la economía verde y circular frente al modelo clásico de producción."},{"letra":"d)","texto":"Se han aplicado principios de ecodiseño."},{"letra":"e)","texto":"Se ha analizado el ciclo de vida del producto."},{"letra":"f)","texto":"Se han identificado los procesos de producción y los criterios de sostenibilidad aplicados."}]},{"descripcion":"Realiza actividades sostenibles minimizando el impacto de las mismas en el medio ambiente.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se ha caracterizado el modelo de producción y consumo actual."},{"letra":"b)","texto":"Se han identificado los principios de la economía verde y circular."},{"letra":"c)","texto":"Se han contrastado los beneficios de la economía verde y circular frente al modelo clásico de producción."},{"letra":"d)","texto":"Se ha evaluado el impacto de las actividades personales y profesionales."},{"letra":"e)","texto":"Se han aplicado principios de ecodiseño."},{"letra":"f)","texto":"Se han aplicado estrategias sostenibles."},{"letra":"g)","texto":"Se ha analizado el ciclo de vida del producto."},{"letra":"h)","texto":"Se han identificado los procesos de producción y los criterios de sostenibilidad aplicados."},{"letra":"i)","texto":"Se ha aplicado la normativa ambiental."}]},{"descripcion":"Analiza un plan de sostenibilidad de una empresa del sector, identificando sus grupos de interés, los aspectos ASG materiales y justificando acciones para su gestión y medición.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han identificado los principales grupos de interés de la empresa."},{"letra":"b)","texto":"Se han analizado los aspectos ASG materiales, las expectativas de los grupos de interés y la importancia de los aspectos ASG en relación con los objetivos empresariales."},{"letra":"c)","texto":"Se han definido acciones encaminadas a minimizar los impactos negativos y aprovechar las oportunidades que plantean los principales aspectos ASG identificados."},{"letra":"d)","texto":"Se han determinado las métricas de evaluación del desempeño de la empresa de acuerdo con los estándares de sostenibilidad más ampliamente utilizados."},{"letra":"e)","texto":"Se ha elaborado un informe de sostenibilidad con el plan y los indicadores propuestos."}]}]}]}]},"IFC303":{"codigo":"IFC303","nombre":"Desarrollo de Aplicaciones WEB","categoria":"Ciclo Formativo de Grado Superior","cursos":[{"cursoNombre":"Curso 1º","modulos":[{"cod":"0484","nombre":"Bases de datos","horasSem":"6","horasTotal":"200","ras":[{"descripcion":"Reconoce los elementos de las bases de datos analizando sus funciones y valorando la utilidad de los sistemas gestores.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han analizado los sistemas lógicos de almacenamiento y sus características."},{"letra":"b)","texto":"Se han identificado los distintos tipos de bases de datos según el modelo de datos utilizado."},{"letra":"c)","texto":"Se han identificado los distintos tipos de bases de datos en función de la ubicación de la información."},{"letra":"d)","texto":"Se ha evaluado la utilidad de un sistema gestor de bases de datos."},{"letra":"e)","texto":"Se ha reconocido la función de cada uno de los elementos de un sistema gestor de bases de datos."},{"letra":"f)","texto":"Se han clasificado los sistemas gestores de bases de datos."},{"letra":"g)","texto":"Se ha reconocido la utilidad de las bases de datos distribuidas."},{"letra":"h)","texto":"Se han analizado las políticas de fragmentación de la información."},{"letra":"i)","texto":"Se ha identificado la legislación vigente sobre protección de datos."},{"letra":"j)","texto":"Se han reconocido los conceptos de Big Data y de la inteligencia de negocios."}]},{"descripcion":"Crea bases de datos definiendo su estructura y las características de sus elementos según el modelo relacional.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se ha analizado el formato de almacenamiento de la información."},{"letra":"b)","texto":"Se han creado las tablas y las relaciones entre ellas."},{"letra":"c)","texto":"Se han seleccionado los tipos de datos adecuados."},{"letra":"d)","texto":"Se han definido los campos clave en las tablas."},{"letra":"e)","texto":"Se han implantado las restricciones reflejadas en el diseño lógico."},{"letra":"f)","texto":"Se han creado vistas."},{"letra":"g)","texto":"Se han creado los usuarios y se les han asignado privilegios."},{"letra":"h)","texto":"Se han utilizado asistentes, herramientas gráficas y los lenguajes de definición y control de datos."}]},{"descripcion":"Consulta la información almacenada en una base de datos empleando asistentes, herramientas gráficas y el lenguaje de manipulación de datos.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han identificado las herramientas y sentencias para realizar consultas."},{"letra":"b)","texto":"Se han realizado consultas simples sobre una tabla."},{"letra":"c)","texto":"Se han realizado consultas sobre el contenido de varias tablas mediante composiciones internas."},{"letra":"d)","texto":"Se han realizado consultas sobre el contenido de varias tablas mediante composiciones externas."},{"letra":"e)","texto":"Se han realizado consultas resumen."},{"letra":"f)","texto":"Se han realizado consultas con subconsultas."},{"letra":"g)","texto":"Se han realizado consultas que implican múltiples selecciones."},{"letra":"h)","texto":"Se han aplicado criterios de optimización de consultas."}]},{"descripcion":"Modifica la información almacenada en la base de datos utilizando asistentes, herramientas gráficas y el lenguaje de manipulación de datos.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han identificado las herramientas y sentencias para modificar el contenido de la base de datos."},{"letra":"b)","texto":"Se han insertado, borrado y actualizado datos en las tablas."},{"letra":"c)","texto":"Se ha incluido en una tabla la información resultante de la ejecución de una consulta."},{"letra":"d)","texto":"Se han diseñado guiones de sentencias para llevar a cabo tareas complejas."},{"letra":"e)","texto":"Se ha reconocido el funcionamiento de las transacciones."},{"letra":"f)","texto":"Se han anulado parcial o totalmente los cambios producidos por una transacción."},{"letra":"g)","texto":"Se han identificado los efectos de las distintas políticas de bloqueo de registros."},{"letra":"h)","texto":"Se han adoptado medidas para mantener la integridad y consistencia de la información."}]},{"descripcion":"Desarrolla procedimientos almacenados evaluando y utilizando las sentencias del lenguaje incorporado en el sistema gestor de bases de datos.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han identificado las diversas formas de automatizar tareas."},{"letra":"b)","texto":"Se han reconocido los métodos de ejecución de guiones."},{"letra":"c)","texto":"Se han identificado las herramientas disponibles para editar guiones."},{"letra":"d)","texto":"Se han definido y utilizado guiones para automatizar tareas."},{"letra":"e)","texto":"Se ha hecho uso de las funciones proporcionadas por el sistema gestor."},{"letra":"f)","texto":"Se han definido procedimientos y funciones de usuario."},{"letra":"g)","texto":"Se han utilizado estructuras de control de flujo."},{"letra":"h)","texto":"Se han definido eventos y disparadores."},{"letra":"i)","texto":"Se han utilizado cursores."},{"letra":"j)","texto":"Se han utilizado excepciones."}]},{"descripcion":"Diseña modelos relacionales normalizados interpretando diagramas entidad/relación.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han utilizado herramientas gráficas para representar el diseño lógico."},{"letra":"b)","texto":"Se han identificado las tablas del diseño lógico."},{"letra":"c)","texto":"Se han identificado los campos que forman parte de las tablas del diseño lógico."},{"letra":"d)","texto":"Se han analizado las relaciones entre las tablas del diseño lógico."},{"letra":"e)","texto":"Se han identificado los campos clave."},{"letra":"f)","texto":"Se han aplicado reglas de integridad."},{"letra":"g)","texto":"Se han aplicado reglas de normalización."},{"letra":"h)","texto":"Se han analizado y documentado las restricciones que no pueden plasmarse en el diseño lógico."}]},{"descripcion":"Gestiona la información almacenada en bases de datos no relacionales, evaluando y utilizando las posibilidades que proporciona el sistema gestor.","etiqueta":"(RA7)","ces":[{"letra":"a)","texto":"Se han caracterizado las bases de datos no relacionales."},{"letra":"b)","texto":"Se han evaluado los principales tipos de bases de datos no relacionales."},{"letra":"c)","texto":"Se han identificado los elementos utilizados en estas bases de datos."},{"letra":"d)","texto":"Se han identificado distintas formas de gestión de la información según el tipo de base de datos no relacionales."},{"letra":"e)","texto":"Se han utilizado las herramientas del sistema gestor para la gestión de la información almacenada."}]}]},{"cod":"1665","nombre":"Digitalización aplicada a los sectores productivos (GS)","horasSem":"1","horasTotal":"33","ras":[{"descripcion":"Analiza el concepto de digitalización y su repercusión en los sectores productivos teniendo en cuenta la actividad de la empresa e identificando entornos IT (Information Technology: tecnología de la información) y OT (Operation Technology: tecnología de operación) característicos.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se ha descrito en qué consiste el concepto de digitalización."},{"letra":"b)","texto":"Se ha relacionado la implantación de la tecnología digital con la organización de las empresas."},{"letra":"c)","texto":"Se han establecido las diferencias y similitudes entre los entornos IT y OT."},{"letra":"d)","texto":"Se han identificado los departamentos típicos de las empresas que pueden constituir entornos IT."},{"letra":"e)","texto":"Se han seleccionado las tecnologías típicas de la digitalización en planta y en negocio."},{"letra":"f)","texto":"Se ha analizado la importancia de la conexión entre entornos IT y OT."},{"letra":"g)","texto":"Se han analizado las ventajas de digitalizar una empresa industrial de extremo a extremo."}]},{"descripcion":"Caracteriza las tecnologías habilitadoras digitales necesarias para la adecuación/transformación de las empresas a entornos digitales describiendo sus características y aplicaciones.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han identificado las principales tecnologías habilitadoras digitales."},{"letra":"b)","texto":"Se han relacionado las THD con el desarrollo de productos y servicios."},{"letra":"c)","texto":"Se ha relacionado la importancia de las THD con la economía sostenible y eficiente."},{"letra":"d)","texto":"Se han identificado nuevos mercados generados por las THD."},{"letra":"e)","texto":"Se ha analizado la implicación de THD tanto en la parte de negocio como en la parte de planta."},{"letra":"f)","texto":"Se han identificado las mejoras producidas debido a la implantación de las tecnologías habilitadoras en relación con los entornos IT y OT."},{"letra":"g)","texto":"Se ha elaborado un informe que relacione, las tecnologías con sus características y áreas de aplicación."}]},{"descripcion":"Identifica sistemas basados en cloud/nube y su influencia en el desarrollo de los sistemas digitales.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han identificado los diferentes niveles de la cloud/nube."},{"letra":"b)","texto":"Se han identificado las principales funciones de la cloud/nube (procesamiento de datos, intercambio de información, ejecución de aplicaciones, entre otros)."},{"letra":"c)","texto":"Se ha descrito el concepto de edge computing y su relación con la cloud/nube."},{"letra":"d)","texto":"Se han definido los conceptos de fog y mist y sus zonas de aplicación en el conjunto."},{"letra":"e)","texto":"Se han identificado las ventajas que proporciona la utilización de la cloud/nube en los sistemas conectados."}]},{"descripcion":"Identifica aplicaciones de la IA (inteligencia artificial) en entornos del sector donde está enmarcado el título describiendo las mejoras implícitas en su implementación.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se ha identificado la importancia de la IA en la automatización de procesos y su optimización."},{"letra":"b)","texto":"Se ha relacionado la IA con la recogida masiva de datos (Big Data) y su tratamiento (análisis) con la rentabilidad de las empresas."},{"letra":"c)","texto":"Se ha valorado la importancia presente y futura de la IA."},{"letra":"d)","texto":"Se han identificado los sectores con implantación más relevante de IA."},{"letra":"e)","texto":"Se han identificado los lenguajes de programación en IA."},{"letra":"f)","texto":"Se ha descrito como influye la IA en el sector del título."}]},{"descripcion":"Evalúa la importancia de los datos, así como su protección en una economía digital globalizada, definiendo sistemas de seguridad y ciberseguridad tanto a nivel de equipo/sistema, como globales.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se ha establecido la diferencia entre dato e información."},{"letra":"b)","texto":"Se ha descrito el ciclo de vida del dato."},{"letra":"c)","texto":"Se ha identificado la relación entre Big Data, análisis de datos, machine/ deep learning e inteligencia artificial."},{"letra":"d)","texto":"Se han descrito las características que definen Big Data."},{"letra":"e)","texto":"Se han descrito las etapas típicas de la ciencia de datos y su relación en el proceso."},{"letra":"f)","texto":"Se han descrito los procedimientos de almacenaje de datos en la cloud/nube."},{"letra":"g)","texto":"Se ha descrito la importancia del cloud computing."},{"letra":"h)","texto":"Se han identificado los principales objetivos de la ciencia de datos en las diferentes empresas."},{"letra":"i)","texto":"Se ha valorado la importancia de la seguridad y su regulación en relación con los datos."}]},{"descripcion":"Desarrolla un proyecto de transformación digital de una empresa de un sector relacionado con el título, teniendo en cuenta los cambios que se deben producir en función de los objetivos de la empresa.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han identificado los objetivos estratégicos de la empresa."},{"letra":"b)","texto":"Se han identificado y alineado las áreas de producción/negocio y de comunicaciones."},{"letra":"c)","texto":"Se han identificado las áreas susceptibles de ser digitalizadas."},{"letra":"d)","texto":"Se ha analizado el encaje de AD (áreas digitalizadas) entre sí y con las que no lo están."},{"letra":"e)","texto":"Se han tenido en cuenta las necesidades presentes y futuras de la empresa."},{"letra":"f)","texto":"Se han relacionado cada una de las áreas con la implantación de las tecnologías."},{"letra":"g)","texto":"Se han analizado las posibles brechas de seguridad en cada una de las áreas."},{"letra":"h)","texto":"Se ha definido el tratamiento de los datos y su análisis."},{"letra":"i)","texto":"Se ha tenido en cuenta la integración entre datos, aplicaciones, plataformas que los soportan, entre otros."},{"letra":"j)","texto":"Se han documentado los cambios realizados en función de la estrategia."},{"letra":"k)","texto":"Se han tenido en cuenta la idoneidad de los recursos humanos."}]}]},{"cod":"0487","nombre":"Entornos de desarrollo","horasSem":"3","horasTotal":"100","ras":[{"descripcion":"Reconoce los elementos y herramientas que intervienen en el desarrollo de un programa informático, analizando sus características y las fases en las que actúan hasta llegar a su puesta en funcionamiento.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se ha reconocido la relación de los programas con los componentes del sistema informático: memoria, procesador, periféricos, entre otros."},{"letra":"b)","texto":"Se han identificado las fases de desarrollo de una aplicación informática."},{"letra":"c)","texto":"Se han diferenciado los conceptos de código fuente, objeto y ejecutable."},{"letra":"d)","texto":"Se han reconocido las características de la generación de código intermedio para su ejecución en máquinas virtuales."},{"letra":"e)","texto":"Se han clasificado los lenguajes de programación, identificando sus características."},{"letra":"f)","texto":"Se ha evaluado la funcionalidad ofrecida por las herramientas utilizadas en el desarrollo de software."},{"letra":"g)","texto":"Se han identificado las características y escenarios de uso de las metodologías ágiles de desarrollo de software."}]},{"descripcion":"Evalúa entornos integrados de desarrollo analizando sus características para editar código fuente y generar ejecutables.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han instalado entornos de desarrollo, propietarios y libres."},{"letra":"b)","texto":"Se han añadido y eliminado módulos en el entorno de desarrollo."},{"letra":"c)","texto":"Se ha personalizado y automatizado el entorno de desarrollo."},{"letra":"d)","texto":"Se ha configurado el sistema de actualización del entorno de desarrollo."},{"letra":"e)","texto":"Se han generado ejecutables a partir de código fuente de diferentes lenguajes en un mismo entorno de desarrollo."},{"letra":"f)","texto":"Se han generado ejecutables a partir de un mismo código fuente con varios entornos de desarrollo."},{"letra":"g)","texto":"Se han identificado las características comunes y específicas de diversos entornos de desarrollo."}]},{"descripcion":"Verifica el funcionamiento de programas diseñando y realizando pruebas.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han identificado los diferentes tipos de pruebas."},{"letra":"b)","texto":"Se han definido casos de prueba."},{"letra":"c)","texto":"Se han identificado las herramientas de depuración y prueba de aplicaciones"},{"letra":"d)","texto":"ofrecidas por el entorno de desarrollo."},{"letra":"e)","texto":"Se han utilizado herramientas de depuración para definir puntos de ruptura y seguimiento."},{"letra":"f)","texto":"Se han utilizado las herramientas de depuración para examinar y modificar el comportamiento de un programa en tiempo de ejecución."},{"letra":"g)","texto":"Se han efectuado pruebas unitarias de clases y funciones."},{"letra":"h)","texto":"Se han implementado pruebas automáticas."},{"letra":"i)","texto":"Se han documentado las incidencias detectadas."},{"letra":"j)","texto":"Se han utilizado dobles de prueba para aislar los componentes durante las pruebas."}]},{"descripcion":"Optimiza código empleando las herramientas disponibles en el entorno de desarrollo.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han identificado los patrones de refactorización más usuales."},{"letra":"b)","texto":"Se han elaborado las pruebas asociadas a la refactorización."},{"letra":"c)","texto":"Se ha revisado el código fuente usando un analizador de código."},{"letra":"d)","texto":"Se han identificado las posibilidades de configuración de un analizador de código."},{"letra":"e)","texto":"Se han aplicado patrones de refactorización con las herramientas que proporciona el entorno de desarrollo."},{"letra":"f)","texto":"Se ha realizado el control de versiones integrado en el entorno de desarrollo."},{"letra":"g)","texto":"Se han utilizado herramientas del entorno de desarrollo para documentar las clases."},{"letra":"h)","texto":"Se han utilizado repositorios remotos para el desarrollo de código colaborativo."},{"letra":"i)","texto":"Se han utilizado herramientas para la integración continua del código."}]},{"descripcion":"Genera diagramas de clases valorando su importancia en el desarrollo de aplicaciones y empleando herramientas específicas.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han identificado los conceptos básicos de la programación orientada a objetos."},{"letra":"b)","texto":"Se han utilizado herramientas para la elaboración de diagramas de clases."},{"letra":"c)","texto":"Se ha interpretado el significado de diagramas de clases."},{"letra":"d)","texto":"Se han trazado diagramas de clases a partir de las especificaciones de las mismas."},{"letra":"e)","texto":"Se ha generado código a partir de un diagrama de clases."},{"letra":"f)","texto":"Se ha generado un diagrama de clases mediante ingeniería inversa."}]},{"descripcion":"Genera diagramas de comportamiento valorando su importancia en el desarrollo de aplicaciones y empleando herramientas específicas.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han identificado los distintos tipos de diagramas de comportamiento."},{"letra":"b)","texto":"Se ha reconocido el significado de los diagramas de casos de uso."},{"letra":"c)","texto":"Se han interpretado diagramas de interacción."},{"letra":"d)","texto":"Se han elaborado diagramas de interacción sencillos."},{"letra":"e)","texto":"Se ha interpretado el significado de diagramas de actividades."},{"letra":"f)","texto":"Se han elaborado diagramas de actividades sencillos."},{"letra":"g)","texto":"Se han interpretado diagramas de estados."},{"letra":"h)","texto":"Se han planteado diagramas de estados sencillos."}]}]},{"cod":"0179","nombre":"Inglés Profesional (GS)","horasSem":"2","horasTotal":"67","ras":[{"descripcion":"Comprende información, de índole profesional, académica y cotidiana, contenida en todo tipo de discursos orales, emitidos por cualquier medio de comunicación en lengua estándar, interpretando con precisión el contenido del mensaje.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se ha identificado la idea principal de mensajes en lengua estándar relacionados con la vida social, profesional o académica."},{"letra":"b)","texto":"Se ha reconocido la finalidad de mensajes directos o emitidos en cualquier soporte en lengua estándar."},{"letra":"c)","texto":"Se ha extraído información específica contenida en distintos discursos orales en lengua estándar, relacionada con la vida social, profesional o académica."},{"letra":"d)","texto":"Se ha identificado el punto de vista y la actitud del hablante."},{"letra":"e)","texto":"Se ha identificado el hilo argumental de mensajes orales y determinado los roles que aparecen en dichos mensajes."},{"letra":"f)","texto":"Se han comprendido adecuadamente mensajes en lengua estándar en ambientes con contaminación acústica."},{"letra":"g)","texto":"Se han extraído las ideas principales de conferencias, charlas e informes, y otras formas de presentación académica y profesional, lingüísticamente complejas."},{"letra":"h)","texto":"Se ha tomado conciencia de la importancia de comprender globalmente un mensaje sin entender todos y cada uno de los elementos del mismo."}]},{"descripcion":"Comprende mensajes escritos, de naturaleza profesional, académica y cotidiana, de relativa dificultad, analizando de forma comprensiva su contenido.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se ha identificado la idea principal de textos específicos de su ámbito social, profesional o académico."},{"letra":"b)","texto":"Se ha reconocido la finalidad de distintos textos escritos en cualquier soporte, en lengua estándar y relacionados con la actividad profesional."},{"letra":"c)","texto":"Se ha extraído información específica de textos, de diferente naturaleza, relativos a su profesión, y contenidos en distintos soportes."},{"letra":"d)","texto":"Se ha tomado conciencia de la importancia de comprender globalmente un texto sin entender todos y cada uno de los elementos del mismo."},{"letra":"e)","texto":"Se han leído y comprendido, de manera autónoma, textos relacionados con el sector con la velocidad y estilo de lectura propia del nivel competencial."},{"letra":"f)","texto":"Se ha interpretado la correspondencia relativa a su especialidad, captando fácilmente el significado esencial."},{"letra":"g)","texto":"Se han interpretado textos extensos, y de cierta complejidad, relacionados o no con su especialidad, pudiendo realizar varias lecturas del mismo."},{"letra":"h)","texto":"Se ha identificado con rapidez el contenido y la importancia de noticias, artículos e informes sobre una amplia serie de temas profesionales."},{"letra":"i)","texto":"Se han interpretado instrucciones, con distintos niveles de dificultad, y mensajes técnicos recibidos a través de soportes digitales."},{"letra":"j)","texto":"Se han traducido textos de cierta complejidad, utilizando material de apoyo en caso necesario."}]},{"descripcion":"Produce mensajes orales claros y bien estructurados, analizando el conten cidente."},{"letra":"b)","texto":"Se ha conseguido identificar las causas, el alcance y el impacto real causado por el incidente."},{"letra":"c)","texto":"Se han realizado las fases del análisis forense en Cloud."},{"letra":"d)","texto":"Se han identificado las características intrínsecas de la nube (elasticidad, ubicuidad, abstracción, volatilidad y compartición de recursos)."},{"letra":"e)","texto":"Se han cumplido los requerimientos legales en vigor, RGPD (Reglamento general de protección de datos) y directiva NIS (Directiva de la UE sobre seguridad de redes y sistemas de información) o las que eventualmente pudieran sustituirlas."},{"letra":"f)","texto":"Se han presentado y expuesto las conclusiones del análisis forense realizado."}]},{"descripcion":"Realiza análisis forense en dispositivos del IoT, aplicando metodologías establecidas, actualizadas y reconocidas.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han identificado los dispositivos a analizar garantizando la preservación de las evidencias."},{"letra":"b)","texto":"Se han utilizado mecanismos y herramientas adecuadas para la adquisición y extracción de evidencias"},{"letra":"c)","texto":"Se ha garantizado la autenticidad, completitud, fiabilidad y legalidad de las evidencias extraídas."},{"letra":"d)","texto":"Se han realizado análisis de evidencias de manera manual y mediante herramientas."},{"letra":"e)","texto":"Se ha documentado el proceso de manera metódica y detallada."},{"letra":"f)","texto":"Se ha considerado la línea temporal de las evidencias."},{"letra":"g)","texto":"Se ha mantenido la cadena de custodia"},{"letra":"h)","texto":"Se ha elaborado un informe de conclusiones a nivel técnico y ejecutivo."},{"letra":"i)","texto":"Se han presentado y expuesto las conclusiones del análisis forense realizado."}]},{"descripcion":"Documenta análisis forenses elaborando informes que incluyan la normativa aplicable.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se ha definido el objetivo del informe pericial y su justificación."},{"letra":"b)","texto":"Se ha definido el ámbito de aplicación del informe pericial."},{"letra":"c)","texto":"Se han documentado los antecedentes."},{"letra":"d)","texto":"Se han recopilado las normas legales y reglamentos cumplidos en el análisis forense realizado."},{"letra":"e)","texto":"Se han recogido los requisitos establecidos por el cliente."},{"letra":"f)","texto":"Se han incluido las conclusiones y su justificación."}]}]},{"cod":"5022","nombre":"Bastionado de redes y sistemas","horasSem":"","horasTotal":"171","ras":[{"descripcion":"Diseña planes de securización incorporando buenas prácticas para el bastionado de sistemas y redes.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han identificado los activos, las amenazas y vulnerabilidades de la organización."},{"letra":"b)","texto":"Se ha evaluado las medidas de seguridad actuales."},{"letra":"c)","texto":"Se ha elaborado un análisis de riesgo de la situación actual en ciberseguridad de la organización"},{"letra":"d)","texto":"Se ha priorizado las medidas técnicas de seguridad a implantar en la organización teniendo también en cuenta los principios de la Economía Circular."},{"letra":"e)","texto":"Se ha diseñado y elaborado un plan de medidas técnicas de seguridad a implantar en la organización, apropiadas para garantizar un nivel de seguridad adecuado en función de los riesgos de la organización."},{"letra":"f)","texto":"Se han identificado las mejores prácticas en base a estándares, guías y políticas de securización adecuadas para el bastionado de los sistemas y redes de la organización."}]},{"descripcion":"Configura sistemas de control de acceso y autenticación de personas preservando la confidencialidad y privacidad de los datos.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han definido los mecanismos de autenticación en base a distintos / múltiples factores (físicos, inherentes y basados en el conocimiento), existentes."},{"letra":"b)","texto":"Se han definido protocolos y políticas de autenticación basados en contraseñas y frases de paso, en base a las principales vulnerabilidades y tipos de ataques."},{"letra":"c)","texto":"Se han definido protocolos y políticas de autenticación basados en certificados digitales y tarjetas inteligentes, en base a las principales vulnerabilidades y tipos de ataques."},{"letra":"d)","texto":"Se han definido protocolos y políticas de autenticación basados en tokens, OTPs, etc., en base a las principales vulnerabilidades y tipos de ataques."},{"letra":"e)","texto":"Se han definido protocolos y políticas de autenticación basados en características biométricas, según las principales vulnerabilidades y tipos de ataques."}]},{"descripcion":"Administra credenciales de acceso a sistemas informáticos aplicando los requisitos de funcionamiento y seguridad establecidos.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han identificado los tipos de credenciales más utilizados."},{"letra":"b)","texto":"Se han generado y utilizado diferentes certificados digitales como medio de acceso a un servidor remoto."},{"letra":"c)","texto":"Se ha comprobado la validez y la autenticidad de un certificado digital de un servicio web."},{"letra":"d)","texto":"Se han comparado certificados digitales válidos e inválidos por diferentes motivos."},{"letra":"e)","texto":"Se ha instalado y configurado un servidor seguro para la administración de credenciales (tipo RADIUS - Remote Access Dial In User Service)"}]},{"descripcion":"Diseña redes de computadores contemplando los requisitos de seguridad.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se ha incrementado el nivel de seguridad de una red local plana segmentándola físicamente y utilizando técnicas y dispositivos de enrutamiento."},{"letra":"b)","texto":"Se ha optimizado una red local plana utilizando técnicas de segmentación lógica (VLANs)."},{"letra":"c)","texto":"Se ha adaptado un segmento de una red local ya operativa utilizando técnicas de subnetting para incrementar su segmentación respetando los direccionamientos existentes."},{"letra":"d)","texto":"Se han configurado las medidas de seguridad adecuadas en los dispositivos que dan acceso a una red inalámbrica (routers, puntos de acceso, etc.)."},{"letra":"e)","texto":"Se ha establecido un túnel seguro de comunicaciones entre dos sedes geográficamente separadas."}]},{"descripcion":"Configura dispositivos y sistemas informáticos cumpliendo los requisitos de seguridad.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han configurado dispositivos de seguridad perimetral acorde a una serie de requisitos de seguridad."},{"letra":"b)","texto":"Se han detectado errores de configuración de dispositivos de red mediante el análisis de tráfico."},{"letra":"c)","texto":"Se han identificado comportamientos no deseados en una red a través del análisis de los registros (Logs), de un cortafuego."},{"letra":"d)","texto":"Se han implementado contramedidas frente a comportamientos no deseados en una red."},{"letra":"e)","texto":"Se han caracterizado, instalado y configurado diferentes herramientas de monitorización."}]},{"descripcion":"Configura dispositivos para la instalación de sistemas informáticos minimizando las probabilidades de exposición a ataques.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se ha configurado la BIOS para incrementar la seguridad del dispositivo y su contenido minimizando las probabilidades de exposición a ataques."},{"letra":"b)","texto":"Se ha preparado un sistema informático para su primera instalación teniendo en cuenta las medidas de seguridad necesarias."},{"letra":"c)","texto":"Se ha configurado un sistema informático para que un actor malicioso no pueda alterar la secuencia de arranque con fines de acceso ilegítimo."},{"letra":"d)","texto":"Se ha instalado un sistema informático utilizando sus capacidades de cifrado del sistema de ficheros para evitar la extracción física de datos."},{"letra":"e)","texto":"Se ha particionado el sistema de ficheros del sistema informático para minimizar riesgos de seguridad."}]},{"descripcion":"Configura sistemas informáticos minimizando las probabilidades de exposición a ataques.","etiqueta":"(RA7)","ces":[{"letra":"a)","texto":"Se han enumerado y eliminado los programas, servicios y protocolos innecesarios que hayan sido instalados por defecto en el sistema."},{"letra":"b)","texto":"Se han configurado las características propias del sistema informático para imposibilitar el acceso ilegítimo mediante técnicas de explotación de procesos."},{"letra":"c)","texto":"Se ha incrementado la seguridad del sistema de administración remoto SSH y otros."},{"letra":"d)","texto":"Se ha instalado y configurado un Sistema de detección de intrusos en un Host (HIDS) en el sistema informático."},{"letra":"e)","texto":"Se han instalado y configurado sistemas de copias de seguridad."}]}]},{"cod":"5025","nombre":"Hacking ético","horasSem":"","horasTotal":"117","ras":[{"descripcion":"Determina herramientas de monitorización para detectar vulnerabilidades aplicando técnicas de hacking ético.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se ha definido la terminología esencial del hacking ético."},{"letra":"b)","texto":"Se han identificado los conceptos éticos y legales frente al ciberdelito."},{"letra":"c)","texto":"Se ha definido el alcance y condiciones de un test de intrusión."},{"letra":"d)","texto":"Se han identificado los elementos esenciales de seguridad: confidencialidad, autenticidad, integridad y disponibilidad."},{"letra":"e)","texto":"Se han identificado las fases de un ataque seguidas por un atacante."},{"letra":"f)","texto":"Se han analizado y definido los tipos vulnerabilidades."},{"letra":"g)","texto":"Se han analizado y definido los tipos de ataque."},{"letra":"h)","texto":"Se han determinado y caracterizado las diferentes vulnerabilidades existentes."},{"letra":"i)","texto":"Se han determinado las herramientas de monitorización disponibles en el mercado adecuadas en función del tipo de organización."}]},{"descripcion":"Ataca y defiende en entornos de prueba, comunicaciones inalámbricas consiguiendo acceso a redes para demostrar sus vulnerabilidades.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han configurado los distintos modos de funcionamiento de las tarjetas de red inalámbricas."},{"letra":"b)","texto":"Se han descrito las técnicas de encriptación de las redes inalámbricas y sus puntos vulnerables."},{"letra":"c)","texto":"Se han detectado redes inalámbricas y se ha capturado tráfico de red como paso previo a su ataque."},{"letra":"d)","texto":"Se ha accedido a redes inalámbricas vulnerables."},{"letra":"e)","texto":"Se han caracterizado otros sistemas de comunicación inalámbricos y sus vulnerabilidades."},{"letra":"f)","texto":"Se han utilizado técnicas de “Equipo Rojo y Azul”."},{"letra":"g)","texto":"Se han realizado informes sobre las vulnerabilidades detectadas."}]},{"descripcion":"Ataca y defiende en entornos de prueba, redes y sistemas consiguiendo acceso a información y sistemas de terceros.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se ha recopilado información sobre la red y sistemas objetivo mediante técnicas pasivas."},{"letra":"b)","texto":"Se ha creado un inventario de equipos, cuentas de usuario y potenciales vulnerabilidades de la red y sistemas objetivo mediante técnicas activas."},{"letra":"c)","texto":"Se ha interceptado tráfico de red de terceros para buscar información sensible."},{"letra":"d)","texto":"Se ha realizado un ataque de intermediario, leyendo, insertando y modificando, a voluntad, el tráfico intercambiado por dos extremos remotos."},{"letra":"e)","texto":"Se han comprometido sistemas remotos explotando sus vulnerabilidades."}]},{"descripcion":"Consolida y utiliza sistemas comprometidos garantizando accesos futuros.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han administrado sistemas remotos a través de herramientas de línea de comandos."},{"letra":"b)","texto":"Se han comprometido contraseñas a través de ataques de diccionario, tablas rainbow y fuerza bruta contra sus versiones encriptadas."},{"letra":"c)","texto":"Se ha accedido a sistemas adicionales a través de sistemas comprometidos."},{"letra":"d)","texto":"Se han instalado puertas traseras para garantizar accesos futuros a los sistemas comprometidos."}]},{"descripcion":"Ataca y defiende en entornos de prueba, aplicaciones web consiguiendo acceso a datos o funcionalidades no autorizadas.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han identificado los distintos sistemas de autenticación web, destacando sus debilidades y fortalezas."},{"letra":"b)","texto":"Se ha realizado un inventario de equipos, protocolos, servicios y sistemas operativos que proporcionan el servicio de una aplicación web."},{"letra":"c)","texto":"Se ha analizado el flujo de las interacciones realizadas entre el navegador y la aplicación web durante su uso normal."},{"letra":"d)","texto":"Se han examinado manualmente aplicaciones web en busca de las vulnerabilidades más habituales."},{"letra":"e)","texto":"Se han usado herramientas de búsquedas y explotación de vulnerabilidades web."},{"letra":"f)","texto":"Se ha realizado la búsqueda y explotación de vulnerabilidades web mediante herramientas software."}]}]},{"cod":"5021","nombre":"Incidentes de ciberseguridad","horasSem":"","horasTotal":"144","ras":[{"descripcion":"Desarrolla planes de prevención y concienciación en ciberseguridad, estableciendo normas y medidas de protección.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han definido los principios generales de la organización en materia de ciberseguridad, que deben ser conocidos y apoyados por la dirección de la misma."},{"letra":"b)","texto":"Se ha establecido una normativa de protección del puesto de trabajo."},{"letra":"c)","texto":"Se ha definido un plan de concienciación de ciberseguridad dirigido a los empleados."},{"letra":"d)","texto":"Se ha desarrollado el material necesario para llevar a cabo las acciones de concienciación dirigidas a los empleados."},{"letra":"e)","texto":"Se ha realizado una auditoría para verificar el cumplimiento del plan de prevención y concienciación de la organización."}]},{"descripcion":"Analiza incidentes de ciberseguridad utilizando herramientas, mecanismos de detección y alertas de seguridad.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se ha clasificado y definido la taxonomía de incidentes de ciberseguridad que pueden afectar a la organización."},{"letra":"b)","texto":"Se han establecido controles, herramientas y mecanismos de monitorización, identificación, detección y alerta de incidentes"},{"letra":"c)","texto":"Se han establecido controles y mecanismos de detección e identificación de incidentes de seguridad física."},{"letra":"d)","texto":"Se han establecido controles, herramientas y mecanismos de monitorización, identificación, detección y alerta de incidentes a través de la investigación en fuentes abiertas (OSINT: Open Source Intelligence)."},{"letra":"e)","texto":"Se ha realizado una clasificación, valoración, documentación y seguimiento de los incidentes detectados dentro de la organización."}]},{"descripcion":"Investiga incidentes de ciberseguridad analizando los riesgos implicados y definiendo las posibles medidas a adoptar.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han recopilado y almacenado de forma segura evidencias de incidentes de ciberseguridad que afectan a la organización."},{"letra":"b)","texto":"Se ha realizado un análisis de evidencias."},{"letra":"c)","texto":"Se ha realizado la investigación de incidentes de ciberseguridad."},{"letra":"d)","texto":"Se ha intercambiado información de incidentes, con proveedores y/o organismos competentes que podrían hacer aportaciones al respecto."},{"letra":"e)","texto":"Se han iniciado las primeras medidas de contención de los incidentes para limitar los posibles daños causados."}]},{"descripcion":"Implementa medidas de ciberseguridad en redes y sistemas respondiendo a los incidentes detectados y aplicando las técnicas de protección adecuadas.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han desarrollado procedimientos de actuación detallados para dar respuesta, mitigar, eliminar o contener los tipos de incidentes de ciberseguridad más habituales."},{"letra":"b)","texto":"Se han preparado respuestas ciberresilientes ante incidentes que permitan seguir prestando los servicios de la organización y fortaleciendo las capacidades de identificación, detección, prevención, contención, recuperación y cooperación con terceros."},{"letra":"c)","texto":"Se ha establecido un flujo de toma de decisiones y escalado de incidentes interno y/o externo adecuados."},{"letra":"d)","texto":"Se han llevado a cabo las tareas de restablecimiento de los servicios afectados por un incidente hasta confirmar la vuelta a la normalidad."},{"letra":"e)","texto":"Se han documentado las acciones realizadas y las conclusiones que permitan mantener un registro de “lecciones aprendidas”."},{"letra":"f)","texto":"Se ha realizado un seguimiento adecuado del incidente para evitar que una situación similar se vuelva a repetir."}]},{"descripcion":"Detecta y documenta incidentes de ciberseguridad siguiendo procedimientos de actuación establecidos.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se ha desarrollado un procedimiento de actuación detallado para la notificación de incidentes de ciberseguridad en los tiempos adecuados."},{"letra":"b)","texto":"Se ha notificado el incidente de manera adecuada al personal interno de la organización responsable de la toma de decisiones."},{"letra":"c)","texto":"Se ha notificado el incidente de manera adecuada a las autoridades competentes en el ámbito de la gestión de incidentes de ciberseguridad en caso de ser necesario."},{"letra":"d)","texto":"Se ha notificado formalmente el incidente a los afectados, personal interno, clientes, proveedores, etc., en caso de ser necesario."}, los objetos."},{"letra":"d)","texto":"Se ha modificado la posición y rotación de los objetos."},{"letra":"e)","texto":"Se ha controlado la activación y desactivación mediante el adormecimiento y despertar de los objetos."},{"letra":"f)","texto":"Se ha dotado a los objetos de características similares a los materiales físicos y se han definido sus comportamientos."},{"letra":"g)","texto":"Se han configurado los disparadores de eventos según las interacciones de las colisiones."},{"letra":"h)","texto":"Se han utilizado y configurado las articulaciones asociadas a los objetos."},{"letra":"i)","texto":"Se han creado escenarios con objetos cuyas características y efectos son similares al mundo real."}]},{"descripcion":"Define el interfaz de usuario del videojuego teniendo en cuenta su rapidez y la facilidad de utilización.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se ha analizado el funcionamiento del contenedor que alberga todos los objetos del juego."},{"letra":"b)","texto":"Se ha determinado el orden de visualización de todos los objetos que contiene el juego."},{"letra":"c)","texto":"Se han ajustado los modos de renderizado de los objetos en la pantalla o contenedor del juego."},{"letra":"d)","texto":"Se han posicionado y establecido los tamaños y rotaciones de los elementos de la interfaz de usuario en la pantalla."},{"letra":"e)","texto":"Se han utilizado elementos visuales."},{"letra":"f)","texto":"Se ha proporcionado a los elementos del interfaz la interacción asociada a las acciones del videojuego."},{"letra":"g)","texto":"Se han configurado las animaciones del interfaz de usuario."},{"letra":"h)","texto":"Se han configurado los distintos tipos de fuentes de textos."}]}]},{"cod":"5051","nombre":"Realidad virtual y realidad aumentada","horasSem":"","horasTotal":"91","ras":[{"descripcion":"Reconoce los distintos modelos y dispositivos diferenciando los ecosistemas de Realidad Virtual (en adelante RV), Realidad Aumentada (en adelante RA), Realidad Mixta (en adelante RM) y Realidad Extendida (en adelante RX).","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han definido las características de cada una de los modelos de RV."},{"letra":"b)","texto":"Se ha controlado la aplicabilidad de cada uno de los modelos en diferentes sectores de videojuegos."},{"letra":"c)","texto":"Se han comparado y seleccionado los motores de desarrollo de proyectos."},{"letra":"d)","texto":"Se han identificado los tipos de dispositivos de RV, RA, RM, y RX."}]},{"descripcion":"Diseña y desarrolla proyectos de videojuegos teniendo en cuenta las características de programación propias de la RV.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han establecido las bases y fundamentos de programación para crear proyectos de videojuegos en RV."},{"letra":"b)","texto":"Se han identificado los requisitos de modelado para RV."},{"letra":"c)","texto":"Se han elaborado escenarios y experiencias en 360 grados."},{"letra":"d)","texto":"Se ha realizado la grabación de contenidos en 360 grados."},{"letra":"e)","texto":"Se han seleccionado técnicas de posicionamiento absoluto."},{"letra":"f)","texto":"Se han diseñado y determinado personajes."},{"letra":"g)","texto":"Se ha seleccionado la interfaz gráfica."},{"letra":"h)","texto":"Se ha desarrollado el diseño de niveles."},{"letra":"i)","texto":"Se ha definido la realidad virtual web."}]},{"descripcion":"Diseña y desarrolla proyectos de videojuegos teniendo en cuenta las características de programación propias de la RA.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han definido las bases y fundamentos de programación para crear proyectos en RA."},{"letra":"b)","texto":"Se ha establecido la vista de RA basada en geoposicionamiento."},{"letra":"c)","texto":"Se han empleado dispositivos móviles y tabletas."},{"letra":"d)","texto":"Se han reconocido conceptos de orientación mediante el magnetómetro y el giróscopo."},{"letra":"e)","texto":"Se ha utilizado la cámara integrada."},{"letra":"f)","texto":"Se han establecido marcadores."},{"letra":"g)","texto":"Se han previsto sensores de profundidad."},{"letra":"h)","texto":"Se han diseñado y definido objetos."},{"letra":"i)","texto":"Se ha definido la interfaz gráfica."},{"letra":"j)","texto":"Se ha determinado y controlado el diseño de niveles."},{"letra":"k)","texto":"Se han seleccionado los materiales aplicados a los objetos del juego."},{"letra":"l)","texto":"Se han integrado la RV y RA en una misma aplicación."}]},{"descripcion":"Diseña y desarrolla proyectos con RM combinando RA y RV.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han creado espacios de interacción de objetos reales y virtuales."},{"letra":"b)","texto":"Se han establecido dispositivos tales como cascos envolventes o gafas específicas para interactuar con la RM."},{"letra":"c)","texto":"Se han generado e incorporado objetos gráficos al mundo real."},{"letra":"d)","texto":"Se han utilizado objetos reales en mundo virtual."},{"letra":"e)","texto":"Se han generado prototipos en 3D para aplicaciones reales."}]},{"descripcion":"Define y desarrolla videojuegos para el aprendizaje mediante RV.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han reconocido conceptos y clasificaciones de videojuegos para el aprendizaje."},{"letra":"b)","texto":"Se han establecido objetivos formativos del videojuego para el aprendizaje."},{"letra":"c)","texto":"Se han definido funcionalidades e interacciones del videojuego."},{"letra":"d)","texto":"Se han desarrollado proyectos de videojuegos para el aprendizaje mediante RV."}]}]}]}]},"CESIFC02":{"codigo":"CESIFC02","nombre":"Inteligencia Artificial y Big Data","categoria":"Curso de Especialización de Grado Superior","cursos":[{"cursoNombre":"Curso 1º","modulos":[{"cod":"5075","nombre":"Big data aplicado","horasSem":"","horasTotal":"136","ras":[{"descripcion":"Gestiona soluciones a problemas propuestos, utilizando sistemas de almacenamiento y herramientas asociadas al centro de datos.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se ha caracterizado el proceso de diseño y construcción de soluciones en sistemas de almacenamiento de datos."},{"letra":"b)","texto":"Se han determinado los procedimientos y mecanismos para la ingestión de datos."},{"letra":"c)","texto":"Se ha determinado el formato de datos adecuado para el almacenamiento."},{"letra":"d)","texto":"Se han procesado los datos almacenados,"},{"letra":"e)","texto":"Se han presentado los resultados y las soluciones al cliente final en una forma fácil de interpretar."}]},{"descripcion":"Gestiona sistemas de almacenamiento y el amplio ecosistema alrededor de ellos facilitando el procesamiento de grandes cantidades de datos sin fallos y de forma rápida.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se ha determinado la importancia de los sistemas de almacenamiento para depositar y procesar grandes cantidades de cualquier tipo de datos rápidamente."},{"letra":"b)","texto":"Se ha comprobado el poder de procesamiento de su modelo de computación distribuida."},{"letra":"c)","texto":"Se ha probado la tolerancia a fallos de los sistemas."},{"letra":"d)","texto":"Se ha determinado que se pueden almacenar tantos datos como se desee y decidir cómo utilizarlos más tarde."},{"letra":"e)","texto":"Se ha visualizado que el sistema puede crecer fácilmente añadiendo módulos."}]},{"descripcion":"Genera mecanismos de integridad de los datos, comprobando su mantenimiento en los sistemas de ficheros distribuidos y valorando la sobrecarga que conlleva en el tratamiento de los datos.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se ha valorado la importancia de la calidad de los datos en los sistemas de ficheros distribuidos."},{"letra":"b)","texto":"Se ha valorado que a mayor volumen de tratamiento de datos corresponde un mayor peligro relacionado con la integridad de los datos."},{"letra":"c)","texto":"Se ha reconocido que los sistemas de ficheros distribuidos implementan una suma de verificación para la comprobación de los contenidos de los archivos."},{"letra":"d)","texto":"Se ha reconocido el papel del servidor en los procesos previos a la suma de verificación."}]},{"descripcion":"Realiza el seguimiento de la monitorización de un sistema, asegurando la fiabilidad y estabilidad de los servicios que se proveen.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han aplicado herramientas de monitorización eficiente de los recursos."},{"letra":"b)","texto":"Se han recogido métricas, procesamiento y visualización de los datos."},{"letra":"c)","texto":"Se han generado alertas para detectar un riesgo o mal funcionamiento."},{"letra":"d)","texto":"Se ha comprobado que las herramientas usadas ofrecen un rendimiento elevado con rapidez."},{"letra":"e)","texto":"Se ha comprobado la fiabilidad de los datos según respuestas."},{"letra":"f)","texto":"Se ha analizado la estabilidad de servicios."}]},{"descripcion":"Valida las técnicas de Big Data para transformar una gran cantidad de datos en información significativa, facilitando la toma de decisiones de negocios.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han seleccionado gran cantidad de datos estructurados y no estructurados para reforzar la función de BI."},{"letra":"b)","texto":"Se ha realizado la limpieza y transformación de datos en base a los objetivos predeterminados."},{"letra":"c)","texto":"Se ha comprobado que el Big Data multiplica la relevancia y la utilidad del BI para el negocio."},{"letra":"d)","texto":"Se han conjugado dentro de un modelo de empresa datos de clientes, financieros de ventas, de productos, de marketing, de redes sociales, de la competencia, entre otros, para extraer un análisis valioso y efectivo para el negocio."},{"letra":"e)","texto":"Se ha evaluado e interpretado la información extraída de los datos y su influencia en el triunfo de diferentes negocios."},{"letra":"f)","texto":"Se ha simulado la implantación de un modelo de Inteligencia de negocios BI."}]}]},{"cod":"5071","nombre":"Modelos de inteligencia artificial","horasSem":"","horasTotal":"72","ras":[{"descripcion":"Caracteriza sistemas de Inteligencia Artificial relacionándolos con la mejora de la eficiencia operativa de las organizaciones y empresas.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han identificado los principios fundamentales de los sistemas inteligentes."},{"letra":"b)","texto":"Se ha recopilado información sobre campos donde se aplica Inteligencia Artificial."},{"letra":"c)","texto":"Se han identificado las técnicas básicas a utilizar en el entorno de la IA."},{"letra":"d)","texto":"Se han identificado nuevas formas de interacciones en los negocios que mejore la eficiencia operativa."}]},{"descripcion":"Utiliza modelos de sistemas de Inteligencia Artificial implementando sistemas de resolución de problemas.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han determinado los requisitos básicos a implementar en un sistema de resolución de problemas."},{"letra":"b)","texto":"Se han clasificado modelos de Inteligencia Artificial."},{"letra":"c)","texto":"Se han caracterizado los modelos de automatización de tareas."},{"letra":"d)","texto":"Se han caracterizado los modelos de razonamiento impreciso."},{"letra":"e)","texto":"Se han caracterizado los modelos de sistemas basados en reglas."},{"letra":"f)","texto":"Se ha valorado la adecuación de los modelos a la implementación del sistema de resolución de problemas."}]},{"descripcion":"Relaciona el procesamiento de lenguaje natural con sus aplicaciones determinando su potencial e identificando sus limitaciones.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se ha caracterizado el procesamiento de lenguaje natural."},{"letra":"b)","texto":"Se ha justificado el papel del lingüista en un proyecto de inteligencia artificial."},{"letra":"c)","texto":"Se ha determinado el potencial de las técnicas existentes de procesamiento de lenguaje, así como sus limitaciones."},{"letra":"d)","texto":"Se ha considerado en qué casos es factible aplicar estas técnicas en la resolución de un problema."},{"letra":"e)","texto":"Se ha evaluado el trabajo cooperativo entre lingüistas e informáticos en el campo del procesamiento del lenguaje natural."},{"letra":"f)","texto":"Se ha descrito la formación teórica que precisa el investigador en procesamiento del lenguaje natural."},{"letra":"g)","texto":"Se ha elaborado un sistema de procesamiento de lenguaje orientado a una tarea específica."}]},{"descripcion":"Analiza sistemas robotizados, evaluando opciones de diseño e implementación.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han recopilado los problemas del modelado y control cinemático en robots manipuladores."},{"letra":"b)","texto":"Se han buscado soluciones a los problemas de los robots."},{"letra":"c)","texto":"Se han valorado las características diferenciadoras de las técnicas de programación de robots y de sistemas robotizados."},{"letra":"d)","texto":"Se han evaluado diferentes opciones en el diseño e implementación de sistemas robotizados."}]},{"descripcion":"Aplica sistemas expertos evaluando la influencia de los controladores inteligentes en el comportamiento del sistema.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se ha descrito la dinámica y las estructuras elementales de los sistemas expertos."},{"letra":"b)","texto":"Se han determinado las destrezas necesarias para representar y simular comportamientos básicos de sistemas de muy diversos ámbitos."},{"letra":"c)","texto":"Se ha razonado cómo influye la variación de las características de los sistemas en su dinámica de actuación."},{"letra":"d)","texto":"Se han desarrollado estrategias de control definiendo los objetivos y las especificaciones de la respuesta del sistema."},{"letra":"e)","texto":"Se han relacionado los controladores inteligentes con el comportamiento del sistema."}]},{"descripcion":"Aplica principios legales y éticos al desarrollo de la Inteligencia Artificial integrándolos como parte del proceso.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han argumentado los posibles riesgos legales y éticos de la aplicación de Inteligencia Artificial."},{"letra":"b)","texto":"Se ha reconocido la necesidad de respetar la privacidad de los datos."},{"letra":"c)","texto":"Se ha decidido el cumplimiento estricto de la legalidad en su aplicación."},{"letra":"d)","texto":"Se ha integrado como parte del proceso la protección frente a previsibles errores y ataques (security by design)."},{"letra":"e)","texto":"Se ha comprobado que se cumplen todas las normas legales y éticas en todas las áreas de la Inteligencia Artificial (privacy by design)."},{"letra":"f)","texto":"Se han identificado y corregido los posibles sesgos de género en el desarrollo y aplicaciones de Inteligencia Artificial y Big Data."}]}]},{"cod":"5073","nombre":"Programación de inteligencia artificial","horasSem":"","horasTotal":"200","ras":[{"descripcion":"Caracteriza lenguajes de programación valorando su idoneidad en el desarrollo de Inteligencia Artificial.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se ha identificado la estructura de un programa informático."},{"letra":"b)","texto":"Se han valorado características en los lenguajes de programación adecuadas al tipo de aplicaciones a implementar."},{"letra":"c)","texto":"Se ha determinado el lenguaje de programación más apropiado para el desarrollo de la aplicación."},{"letra":"d)","texto":"Se han valorado características de los lenguajes de programación para el desarrollo de Inteligencia Artificial."},{"letra":"e)","texto":"Se ha determinado el lenguaje de programación más apropiado para el desarrollo de la aplicación de Inteligencia Artificial."},{"letra":"f)","texto":"Se han caracterizado lenguajes de marcado destacando la información que contienen sus etiquetas."}]},{"descripcion":"Desarrolla aplicaciones de Inteligencia artificial utilizando entornos de modelado.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han evaluado plataformas de Inteligencia Artificial."},{"letra":"b)","texto":"Se han caracterizado entornos de modelo de aplicaciones de Inteligencia Artificial."},{"letra":"c)","texto":"Se ha definido el modelo que se quiere implementar según el problema planteado."},{"letra":"d)","texto":"Se ha implementado la aplicación de Inteligencia Artificial."},{"letra":"e)","texto":"Se han evaluado los resultados obtenidos."}]},{"descripcion":"Evalúa las mejoras en los negocios integrando convergencia tecnológica.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han identificado las ventajas que ofrece unificar procesos, servicios, herramientas, métodos y sectores."},{"letra":"b)","texto":"Se han identificado sistemas que facilitan la conexión tecnológica."},{"letra":"c)","texto":"Se han evaluado las características de dichos sistemas."},{"letra":"d)","texto":"Se ha evaluado como la convergencia tecnológica aporta seguridad en los negocios."},{"letra":"e)","texto":"Se ha evaluado la mejora en la capacidad de toma de decisiones estratégicas en un negocio conectado."}]},{"descripcion":"Evalúa modelos de automatización industrial y de negocio relacionándolos con los resultados esperados por las empresas.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han identificado las nuevas estrategias corporativas y modelos de negocio en las empresas."},{"letra":"b)","texto":"Se ha definido la relación entre empresas y clientes y su efecto en la forma en que las empresas organizan y gestionan sus activos y recursos."},{"letra":"c)","texto":"Se han evaluado modelos de automatización para los nuevos requerimientos industriales y de negocio."},{"letra":"d)","texto":"Se ha evaluado la conveniencia de cada modelo para conseguir los resultados esperados por las empresas."}]}]},{"cod":"5072","nombre":"Sistemas de aprendizaje automático","horasSem":"","horasTotal":"92","ras":[{"descripcion":"Caracteriza la Inteligencia Artificial fuerte y débil determinando usos y posibilidades.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han ":"(RA6)","ces":[{"letra":"a)","texto":"Se ha valorado la conveniencia de los algoritmos propuestos para dar solución a los problemas planteados."},{"letra":"b)","texto":"Se ha evaluado la aplicación práctica de los principios y técnicas básicas de los sistemas inteligentes."},{"letra":"c)","texto":"Se han integrado los principios fundamentales de la computación en la práctica para seleccionar, valorar y crear nuevos desarrollos tecnológicos."},{"letra":"d)","texto":"Se han desarrollado sistemas y aplicaciones informáticas que utilizan técnicas de los sistemas inteligentes."},{"letra":"e)","texto":"Se han desarrollado técnicas de aprendizaje computacional dedicadas a la extracción automática de información a partir de grandes volúmenes de datos."}]}]},{"cod":"5074","nombre":"Sistemas de big data","horasSem":"","horasTotal":"100","ras":[{"descripcion":"Aplica técnicas de análisis de datos que integran, procesan y analizan la información, adaptando e implementando sistemas que las utilicen.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han identificado conceptos básicos de matemática discreta, lógica algorítmica y complejidad computacional, y su aplicación para el tratamiento automático de la información por medio de sistemas computacionales."},{"letra":"b)","texto":"Se ha extraído de forma automática información y conocimiento a partir de grandes volúmenes de datos."},{"letra":"c)","texto":"Se han combinado diferentes fuentes y tipos de datos."},{"letra":"d)","texto":"Se ha construido un conjunto de datos complejos y se han relacionado entre sí."},{"letra":"e)","texto":"Se han establecido objetivos y prioridades, secuenciación y organización del tiempo de realización."},{"letra":"f)","texto":"Se han seleccionado e integrado sistemas de información que satisfacen las necesidades del problema."},{"letra":"g)","texto":"Se han determinado criterios de coste y calidad necesarios para la eficacia y eficiencia de la implementación de un sistema Big Data."}]},{"descripcion":"Configura cuadros de mando en diferentes entornos computacionales usando técnicas de análisis de datos.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han clasificado diferentes librerías e implementaciones de las técnicas de representación de la información."},{"letra":"b)","texto":"Se ha cruzado información sobre el objetivo a conseguir y la naturaleza de los datos."},{"letra":"c)","texto":"Se ha realizado un cuadro de mandos utilizando técnicas sencillas."},{"letra":"d)","texto":"Se han utilizado técnicas predictivas complejas para anticiparse a lo que ocurra."},{"letra":"e)","texto":"Se ha evaluado el impacto del análisis de datos en la consecución de los objetivos propuestos."}]},{"descripcion":"Gestiona y almacena datos facilitando la búsqueda de respuestas en grandes conjuntos de datos.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han extraído y almacenado datos de diversas fuentes, para ser tratados en distintos escenarios."},{"letra":"b)","texto":"Se ha fijado el objetivo de extraer valor de los datos para lo que es necesario contar con tecnologías eficientes."},{"letra":"c)","texto":"Se ha comprobado que la revolución digital exige poder almacenar y procesar ingentes cantidades de datos de distinto tipo y descubrir su valor."},{"letra":"d)","texto":"Se han desarrollado sistemas de gestión, almacenamiento y procesamiento de grandes volúmenes de datos de manera eficiente y segura, teniendo en cuenta la normativa existente."},{"letra":"e)","texto":"Se han utilizado habilidades científicas en entornos de trabajo multidisciplinares."}]},{"descripcion":"Aplica herramientas para la visualización de datos utilizadas en las soluciones Big Data facilitando las tareas de análisis y presentación de resultados.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han examinado distintos escenarios y tipologías de datos no estructurados."},{"letra":"b)","texto":"Se ha implantado la aplicación de la BI (Business Intelligence) para la extracción de valor."},{"letra":"c)","texto":"Se ha reconocido la importancia de almacenar grandes volúmenes de datos de forma distribuida y redundante en un clúster de máquinas."},{"letra":"d)","texto":"Se han determinado las diferencias en el entorno de aplicaciones relacionadas que facilitan el procesamiento de datos de manera rápida, eficiente y eficaz."},{"letra":"e)","texto":"Se ha comprobado la manera de programar y procesar automáticamente la estructura de datos."},{"letra":"f)","texto":"Se han valorado las diferentes formas de visualizar los datos que nos interese  representar gráficamente, facilitando así las tareas de análisis y presentación de resultados."}]}]}]}]},"CESIFC04":{"codigo":"CESIFC04","nombre":"Recursos y Servicios en la Nube","categoria":"Curso de Especialización de Grado Superior","cursos":[{"cursoNombre":"Curso 1º","modulos":[{"cod":"5162","nombre":"Administración de bases de datos y almacenamiento en la nube","horasSem":"5","horasTotal":"140","ras":[]},{"cod":"5161","nombre":"Administración de recursos de computación en la nube","horasSem":"3","horasTotal":"90","ras":[]},{"cod":"5163","nombre":"Administración de redes en la nube","horasSem":"3","horasTotal":"90","ras":[]},{"cod":"5164","nombre":"Despliegue de servicios administrados en la nube","horasSem":"2","horasTotal":"60","ras":[]},{"cod":"5160","nombre":"Fundamentos y configuración inicial de servicios en la nube","horasSem":"4","horasTotal":"120","ras":[]}]}]},"PEE02":{"codigo":"PEE02","nombre":"Transformación Digital, Internet de las Cosas","categoria":"Programa de Enriquecimiento Educativo (PEE)","cursos":[]}};

const CATEGORIAS_ORDEN = [
  "Ciclo Formativo de Grado Básico",
  "Ciclo Formativo de Grado Medio",
  "Ciclo Formativo de Grado Superior",
  "Curso de Especialización de Grado Superior",
  "Programa de Enriquecimiento Educativo (PEE)"
];

const MODULE_INDEX = [];
for (const cicloCod of Object.keys(DATA)) {
  const ciclo = DATA[cicloCod];
  ciclo.cursos.forEach(curso => {
    curso.modulos.forEach(modulo => {
      MODULE_INDEX.push({
        categoria: ciclo.categoria,
        ciclo: cicloCod,
        cicloNombre: ciclo.nombre,
        curso: curso.cursoNombre,
        modulo: modulo
      });
    });
  });
}

function normaliza(s){
  return (s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function nombreConCodigo(m){
  if (!m.cod || m.cod === "OPT") return m.nombre;
  return '<span class="cod-mod">'+m.cod+'.</span> '+m.nombre;
}

function renderCiclos(nivel){
  const listado = document.getElementById("listado");
  let html = "";
  CATEGORIAS_ORDEN.forEach(cat => {
    if (nivel && nivel !== cat) return;
    const ciclosDeCat = Object.keys(DATA).filter(k => DATA[k].categoria === cat);
    if (!ciclosDeCat.length) return;
    html += '<h2 class="categoria-titulo">'+cat+'</h2>';
    html += '<div class="grid-ciclos">';
    ciclosDeCat.forEach(cod => {
      const c = DATA[cod];
      const numModulos = c.cursos.reduce((acc,cu)=>acc+cu.modulos.length,0);
      html += '<div class="tarjeta-ciclo" data-ciclo="'+cod+'">'
        + '<h3>'+c.nombre+'</h3>'
        + '<p>'+(numModulos)+' módulos · '+(c.cursos.length)+' curso(s)</p>'
        + '</div>';
    });
    html += '</div>';
  });
  if (!html) html = '<p class="sin-resultados">No hay ciclos para este nivel.</p>';
  listado.innerHTML = html;
  listado.querySelectorAll(".tarjeta-ciclo").forEach(el => {
    el.addEventListener("click", () => abrirVistaCiclo(el.getAttribute("data-ciclo")));
  });
}

function renderModulos(texto, nivel){
  const cont = document.getElementById("resultadosModulos");
  const t = normaliza(texto);
  const filtrados = MODULE_INDEX.filter(item => {
    if (nivel && item.categoria !== nivel) return false;
    const nombre = normaliza(item.modulo.nombre);
    const cod = normaliza(item.modulo.cod);
    return nombre.includes(t) || cod.includes(t);
  });
  if (!filtrados.length){
    cont.innerHTML = '<p class="sin-resultados">No se han encontrado módulos que coincidan con la búsqueda.</p>';
    return;
  }
  let html = "";
  filtrados.forEach(item => {
    const codBadge = (item.modulo.cod && item.modulo.cod !== "OPT") ? item.modulo.cod : "—";
    html += '<div class="tarjeta-modulo" data-ciclo="'+item.ciclo+'" data-cod="'+item.modulo.cod+'">'
      + '<span class="cod-badge">'+codBadge+'</span>'
      + '<h4>'+item.modulo.nombre+'</h4>'
      + '<p>'+item.cicloNombre+' · '+item.curso+'<br>'+item.categoria+'</p>'
      + '</div>';
  });
  cont.innerHTML = html;
  cont.querySelectorAll(".tarjeta-modulo").forEach(el => {
    el.addEventListener("click", () => {
      abrirVistaCiclo(el.getAttribute("data-ciclo"), el.getAttribute("data-cod"));
    });
  });
}

function renderRaCe(modulo){
  if (!modulo.ras || !modulo.ras.length){
    return '<p class="sin-ra">No hay Resultados de Aprendizaje y Criterios de Evaluación publicados para este módulo.</p>';
  }
  let html = "";
  modulo.ras.forEach(ra => {
    html += '<div class="ra-card">'
      + '<div class="ra-header"><strong>'+ra.descripcion+'</strong><span class="etiqueta-ra">'+(ra.etiqueta||"")+'</span></div>'
      + '<div class="ra-body"><ul class="ce-list">';
    (ra.ces||[]).forEach(ce => {
      html += '<li class="ce-item"><span class="ce-letter">'+(ce.letra||"")+'</span>'+ce.texto+'</li>';
    });
    html += '</ul></div></div>';
  });
  return html;
}

function abrirVistaCiclo(cicloCod, focusCod){
  const ciclo = DATA[cicloCod];
  if (!ciclo) return;
  document.getElementById("vistaTitulo").textContent = ciclo.nombre;
  document.getElementById("vistaMeta").textContent = ciclo.categoria;
  const body = document.getElementById("vistaBody");
  if (!ciclo.cursos.length || ciclo.cursos.every(cu => !cu.modulos.length)){
    body.innerHTML = '<p class="sin-resultados">Todavía no hay módulos publicados para este curso.</p>';
  } else {
    let html = "";
    ciclo.cursos.forEach((curso, ci) => {
      html += '<div class="curso-bloque"><h3>'+curso.cursoNombre+'</h3>';
      html += '<table class="tabla-modulos"><thead><tr><th>Módulo</th><th>Horas/sem</th><th>Total</th></tr></thead><tbody>';
      curso.modulos.forEach((m, mi) => {
        const rowId = "fila-"+ci+"-"+mi;
        html += '<tr class="fila-modulo" data-cod="'+m.cod+'" data-target="'+rowId+'">'
          + '<td>'+nombreConCodigo(m)+'</td>'
          + '<td>'+(m.horasSem||"")+'</td>'
          + '<td>'+(m.horasTotal||"")+'</td>'
          + '</tr>';
        html += '<tr class="fila-detalle oculto" id="'+rowId+'"><td colspan="3"><div class="detalle-contenido">'+renderRaCe(m)+'</div></td></tr>';
      });
      html += '</tbody></table></div>';
    });
    body.innerHTML = html;
    body.querySelectorAll(".fila-modulo").forEach(fila => {
      fila.addEventListener("click", () => {
        const targetId = fila.getAttribute("data-target");
        const detalle = document.getElementById(targetId);
        const yaAbierta = fila.classList.contains("abierta");
        body.querySelectorAll(".fila-modulo.abierta").forEach(f => f.classList.remove("abierta"));
        body.querySelectorAll(".fila-detalle").forEach(f => f.classList.add("oculto"));
        if (!yaAbierta){
          fila.classList.add("abierta");
          detalle.classList.remove("oculto");
        }
      });
    });
  }
  document.getElementById("vistaCiclo").classList.remove("oculto");
  document.documentElement.classList.add("bloqueado");
  window.scrollTo(0,0);

  if (focusCod){
    setTimeout(() => {
      const fila = body.querySelector('.fila-modulo[data-cod="'+focusCod+'"]');
      if (fila){
        fila.click();
        fila.scrollIntoView({block:"center", behavior:"smooth"});
      }
    }, 60);
  }
}

function cerrarVistaCiclo(){
  document.getElementById("vistaCiclo").classList.add("oculto");
  document.documentElement.classList.remove("bloqueado");
}

document.getElementById("btnVolver").addEventListener("click", cerrarVistaCiclo);

function actualizarVista(){
  const texto = document.getElementById("buscador").value.trim();
  const nivel = document.getElementById("filtroNivel").value;
  if (texto){
    document.getElementById("listado").classList.add("oculto");
    document.getElementById("resultadosModulos").classList.remove("oculto");
    renderModulos(texto, nivel);
  } else {
    document.getElementById("resultadosModulos").classList.add("oculto");
    document.getElementById("listado").classList.remove("oculto");
    renderCiclos(nivel);
  }
}

document.getElementById("buscador").addEventListener("input", actualizarVista);
document.getElementById("filtroNivel").addEventListener("change", actualizarVista);

renderCiclos("");
</script>

ado distintos métodos para acceder al modo de configuración del conmutador."},{"letra":"d)","texto":"Se han identificado los archivos que guardan la configuración del conmutador."},{"letra":"e)","texto":"Se ha administrado la tabla de direcciones MAC del conmutador."},{"letra":"f)","texto":"Se ha configurado la seguridad del puerto."},{"letra":"g)","texto":"Se ha actualizado el sistema operativo del conmutador."},{"letra":"h)","texto":"Se han utilizado los comandos proporcionados por el sistema operativo del conmutador que permiten hacer el seguimiento de posibles incidencias."},{"letra":"i)","texto":"Se ha verificado el funcionamiento del Spanning Tree Protocol en un conmutador."},{"letra":"j)","texto":"Se han modificado los parámetros que determinan el proceso de selección del puente raíz."}]},{"descripcion":"Administra las funciones básicas de un «router» estableciendo opciones de configuración para su integración en la red.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se ha interpretado la información que proporcionan los «leds» del «router»."},{"letra":"b)","texto":"Se han utilizado distintos métodos para acceder al modo de configuración del «router»."},{"letra":"c)","texto":"Se han identificado las etapas de la secuencia de arranque del «router»."},{"letra":"d)","texto":"Se han utilizado los comandos para la configuración y administración básica del «router»."},{"letra":"e)","texto":"Se han identificado los archivos que guardan la configuración del «router» y se han gestionado mediante los comandos correspondientes."},{"letra":"f)","texto":"Se han configurado rutas estáticas."},{"letra":"g)","texto":"Se han utilizado los comandos proporcionados por el sistema operativo del «router» que permiten hacer el seguimiento de posibles incidencias."},{"letra":"h)","texto":"Se ha configurado el «router» como servidor de direcciones IP dinámicas."},{"letra":"i)","texto":"Se han descrito las capacidades de filtrado de tráfico del «router»."},{"letra":"j)","texto":"Se aptar e incorporar."},{"letra":"d)","texto":"Se han identificado los recursos afectados por las modificaciones."},{"letra":"e)","texto":"Se ha modificado el código de la aplicación para incorporar nuevas funcionalidades y adaptar otras existentes."},{"letra":"f)","texto":"Se ha verificado el correcto funcionamiento de los cambios realizados."},{"letra":"g)","texto":"Se han documentado los cambios realizados."}]}]},{"cod":"1710","nombre":"Itinerario personal para la empleabilidad II","horasSem":"2","horasTotal":"67","ras":[{"descripcion":"Planifica y pone en marcha estrategias en los diferentes procesos selectivos de empleo que le permiten mejorar sus posibilidades de inserción laboral.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han determinado las técnicas utilizadas actualmente en el sector para el proceso de selección de personal."},{"letra":"b)","texto":"Se han desarrollado estrategias para la búsqueda de empleo relacionadas con las técnicas actuales más utilizadas contextualizadas al sector."},{"letra":"c)","texto":"Se han valorado las actitudes y aptitudes que permiten superar procesos selectivos en el sector privado y en el sector público."},{"letra":"d)","texto":"Se ha construido una marca personal identificando las necesidades del mercado actual, sus habilidades, destrezas y su aporte de valor."}]},{"descripcion":"Aplica estrategias relacionadas con las competencias personales, sociales y emocionales para el empleo en búsqueda de la mejora de su empleabilidad.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se ha valorado la importancia de las competencias personales y sociales en la empleabilidad en el sector de referencia."},{"letra":"b)","texto":"Se ha participado activamente en el establecimiento de los objetivos del equipo y en la toma de decisiones del mismo y asumido la responsabilidad de las acciones y decisiones del grupo, participando activamente en el logro de unos objetivos compartidos cooperando con otras personas y compartiendo el liderazgo."},{"letra":"c)","texto":"Se han incorporado al propio proceso de aprendizaje las técnicas y recursos de presentación y comunicación, tanto orales como escritos, adecuados para una comunicación efectiva y afectiva siendo capaz de adaptarlos a cada situación y circunstancias, valorando las oportunidades y dificultades que ofrece cada una de ellas."},{"letra":"d)","texto":"Se han aplicado técnicas y estrategias para la gestión del tiempo disponible para alcanzar los objetivos tanto individuales como del equipo y programado las actividades necesarias."},{"letra":"e)","texto":"Se han aplicado estrategias para canalizar las emociones mostrando una actitud flexible en las relaciones con otras personas."},{"letra":"f)","texto":"Se han desarrollado estrategias para la programación de actividades atendiendo a criterios de organización eficiente y previendo las posibles dificultades."},{"letra":"g)","texto":"Se ha reaccionado de forma flexible y positiva ante conflictos y situaciones nuevas, aprovechando las oportunidades y gestionando las dificultades haciendo uso de estrategias relacionadas con la inteligencia emocional."}]},{"descripcion":"Pone en práctica las habilidades emprendedoras necesarias para el desarrollo de procesos de innovación e investigación aplicadas que promuevan la modernización del sector productivo hacia un modelo sostenible.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se ha identificado el concepto de innovación y su relación con la construcción de una sociedad más sostenible que mejore en el bienestar de los individuos."},{"letra":"b)","texto":"Se han analizado las distintas metodologías para emprender y su importancia para favorecer la innovación y como fuente de creación de empleo y bienestar social."},{"letra":"c)","texto":"Se han aplicado las habilidades emprendedoras necesarias para promover el emprendimiento y el intraemprendimiento."},{"letra":"d)","texto":"Se ha puesto en práctica el trabajo colaborativo como requisito para el d ntizar la calidad del proyecto."}]},{"descripcion":"Planifica la puesta en funcionamiento o ejecución del proyecto, determinando el plan de intervención y la documentación asociada.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han secuenciado las actividades, ordenándolas en función de las necesidades de implementación."},{"letra":"b)","texto":"Se han determinado los recursos y la logística necesaria para cada actividad."},{"letra":"c)","texto":"Se han identificado las necesidades de permisos y autorizaciones para llevar a cabo las actividades."},{"letra":"d)","texto":"Se han determinado los procedimientos de actuación o ejecución de las actividades."},{"letra":"e)","texto":"Se han identificado los riesgos inherentes a la ejecución, definiendo el plan de prevención de riesgos y los medios y equipos necesarios."},{"letra":"f)","texto":"Se han planificado la asignación de recursos materiales y humanos y los tiempos de ejecución."},{"letra":"g)","texto":"Se ha hecho la valoración económica que da respuesta a las condiciones de la ejecución."},{"letra":"h)","texto":"Se ha definido y elaborado la documentación necesaria para la ejecución."}]},{"descripcion":"Define los procedimientos para el seguimiento y control en la ejecución del proyecto, justificando la selección de variables e instrumentos empleados.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se ha definido el procedimiento de evaluación de las actividades o intervenciones."},{"letra":"b)","texto":"Se han definido los indicadores de calidad para realizar la evaluación."},{"letra":"c)","texto":"Se ha definido el procedimiento para la evaluación de las incidencias que puedan presentarse durante la realización de las actividades, su posible solución y registro."},{"letra":"d)","texto":"Se ha definido el procedimiento para gestionar los posibles cambios en los recursos y en las actividades, incluyendo el sistema de registro de los mismos."},{"letra":"e)","texto":"Se ha definido y elaborado la documentación necesaria para la evaluación de las actividades y del proyecto."},{"letra":"f)","texto":"Se ha establecido el procedimiento para la participación en la evaluación de los usuarios o clientes y se han elaborado los documentos específicos."},{"letra":"g)","texto":"Se ha establecido un sistema para garantizar el cumplimiento del pliego de condiciones del proyecto cuando este existe."}]}]},{"cod":"0378","nombre":"Seguridad y alta disponibilidad","horasSem":"5","horasTotal":"167","ras":[{"descripcion":"Adopta pautas y prácticas de tratamiento seguro de la información, reconociendo las vulnerabilidades de un sistema informático y la necesidad de asegurarlo.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se ha valorado la importancia de asegurar la privacidad, coherencia y disponibilidad de la información en los sistemas informáticos."},{"letra":"b)","texto":"Se han descrito las diferencias entre seguridad física y lógica."},{"letra":"c)","texto":"Se han clasificado las principales vulnerabilidades de un sistema informático, según su tipología y origen."},{"letra":"d)","texto":"Se ha contrastado la incidencia de las técnicas de ingeniería social en los fraudes informáticos."},{"letra":"e)","texto":"Se han adoptado políticas de contraseñas."},{"letra":"f)","texto":"Se han valorado las ventajas que supone la utilización de sistemas biométricos."},{"letra":"g)","texto":"Se han aplicado técnicas criptográficas en el almacenamiento y transmisión de la información."},{"letra":"h)","texto":"Se ha reconocido la necesidad de establecer un plan integral de protección perimetral, especialmente en sistemas conectados a redes públicas."},{"letra":"i)","texto":"Se han identificado las fases del análisis forense ante ataques a un sistema."}]},{"descripcion":"Implanta mecanismos de seguridad activa, seleccionando y ejecutando contramedidas ante amenazas o ataques al sistema.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han clasificado los principales tipos de amenazas lógicas contra un sistema informático."},{"letra":"b)","texto":"Se ha verificado el origen y la autenticidad de las aplicaciones instaladas en un equipo, así como el estado de actualización del sistema operativo."},{"letra":"c)","texto":"Se han identificado la anatomía de los ataques más habituales, así como las medidas preventivas y paliativas disponibles."},{"letra":"d)","texto":"Se han analizado diversos tipos de amenazas, ataques y software malicioso, en entornos de ejecución controlados."},{"letra":"e)","texto":"Se han implantado aplicaciones específicas para la detección de amenazas y la eliminación de software malicioso."},{"letra":"f)","texto":"Se han utilizado técnicas de cifrado, firmas y certificados digitales en un entorno de trabajo basado en el uso de redes públicas."},{"letra":"g)","texto":"Se han evaluado las medidas de seguridad de los protocolos usados en redes inalámbricas."},{"letra":"h)","texto":"Se ha reconocido la necesidad de inventariar y controlar los servicios de red que se ejecutan en un sistema."},{"letra":"i)","texto":"Se han descrito los tipos y características de los sistemas de detección de intrusiones."}]},{"descripcion":"Implanta técnicas seguras de acceso remoto a un sistema informático, interpretando y aplicando el plan de seguridad.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han descrito escenarios típicos de sistemas con conexión a redes públicas en los que se precisa fortificar la red interna."},{"letra":"b)","texto":"Se han clasificado las zonas de riesgo de un sistema, según criterios de seguridad perimetral."},{"letra":"c)","texto":"Se han identificado los protocolos seguros de comunicación y sus ámbitos de utilización."},{"letra":"d)","texto":"Se han configurado redes privadas virtuales mediante protocolos seguros a distintos niveles."},{"letra":"e)","texto":"Se ha implantado un servidor como pasarela de acceso a la red interna desde ubicaciones remotas."},{"letra":"f)","texto":"Se han identificado y configurado los posibles métodos de autenticación en el acceso de usuarios remotos a través de la pasarela."},{"letra":"g)","texto":"Se ha instalado, configurado e integrado en la pasarela un servidor remoto de autenticación."}]},{"descripcion":"Implanta cortafuegos para asegurar un sistema informático, analizando sus prestaciones y controlando el tráfico hacia la red interna.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han descrito las características, tipos y funciones de los cortafuegos."},{"letra":"b)","texto":"Se han clasificado los niveles en los que se realiza el filtrado de tráfico."},{"letra":"c)","texto":"Se ha planificado la instalación de cortafuegos para limitar los accesos a determinadas zonas de la red."},{"letra":"d)","texto":"Se han configurado filtros en un cortafuegos a partir de un listado de reglas de filtrado."},{"letra":"e)","texto":"Se han revisado los registros de sucesos de cortafuegos, para verificar que las reglas se aplican correctamente."},{"letra":"f)","texto":"Se han probado distintas opciones para implementar cortafuegos, tanto software como hardware."},{"letra":"g)","texto":"Se han diagnosticado problemas de conectividad en los clientes provocados por los cortafuegos."},{"letra":"h)","texto":"Se ha elaborado documentación relativa a la instalación, configuración y uso de cortafuegos."}]},{"descripcion":"Implanta servidores «proxy», aplicando criterios de configuración que garanticen el funcionamiento seguro del servicio.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han identificado los tipos de «proxy», sus características y funciones principales."},{"letra":"b)","texto":"Se ha instalado y configurado un servidor «proxy-cache»."},{"letra":"c)","texto":"Se han configurado los métodos de autenticación en el «proxy»."},{"letra":"d)","texto":"Se ha configurado un «proxy» en modo transparente."},{"letra":"e)","texto":"Se ha utilizado el servidor «proxy» para establecer restricciones de acceso Web."},{"letra":"f)","texto":"Se han solucionado problemas de acceso desde los clientes al «proxy»."},{"letra":"g)","texto":"Se han realizado pruebas de funcionamiento del «proxy», monitorizando su actividad con herramientas gráficas."},{"letra":"h)","texto":"Se ha configurado un servidor «proxy» en modo inverso."},{"letra":"i)","texto":"Se ha elaborado documentación relativa a la instalación, configuración y uso de servidores «proxy»."}]},{"descripcion":"Implanta soluciones de alta disponibilidad empleando técnicas de virtualización y configurando los entornos de prueba.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han analizado supuestos y situaciones en las que se hace necesario implementar soluciones de alta disponibilidad."},{"letra":"b)","texto":"Se han identificado soluciones hardware para asegurar la continuidad en el funcionamiento de un sistema."},{"letra":"c)","texto":"Se han evaluado las posibilidades de la virtualización de sistemas para implementar soluciones de alta disponibilidad."},{"letra":"d)","texto":"Se ha implantado un servidor redundante que garantice la continuidad de servicios en casos de caída del servidor principal."},{"letra":"e)","texto":"Se ha implantado un balanceador de carga a la entrada de la red interna."},{"letra":"f)","texto":"Se han implantado sistemas de almacenamiento redundante sobre servidores y dispositivos específicos."},{"letra":"g)","texto":"Se ha evaluado la utilidad de los sistemas de «clusters» para aumentar la fiabilidad y productividad del sistema."},{"letra":"h)","texto":"Se han analizado soluciones de futuro para un sistema con demanda creciente."},{"letra":"i)","texto":"Se han esquematizado y documentado soluciones para diferentes supuestos con necesidades de alta disponibilidad."}]},{"descripcion":"Reconoce la legislación y normativa sobre seguridad y protección de datos valorando su importancia.","etiqueta":"(RA7)","ces":[{"letra":"a)","texto":"Se ha descrito la legislación sobre protección de datos de carácter personal."},{"letra":"b)","texto":"Se ha determinado la necesidad de controlar el acceso a la información personal almacenada."},{"letra":"c)","texto":"Se han identificado las figuras legales que intervienen en el tratamiento y mantenimiento de los ficheros de datos."},{"letra":"d)","texto":"Se ha contrastado el deber de poner a disposición de las personas los datos personales que les conciernen."},{"letra":"e)","texto":"Se ha descrito la legislación actual sobre los servicios de la sociedad de la información y comercio electrónico."},{"letra":"f)","texto":"Se han contrastado las normas sobre gestión de seguridad de la información."},{"letra":"g)","texto":"Se ha comprendido la necesidad de conocer y respetar la normativa legal aplicable."}]}]},{"cod":"0375","nombre":"Servicios de red e internet","horasSem":"6","horasTotal":"200","ras":[{"descripcion":"Administra servicios de resolución de nombres, analizándolos y garantizando la seguridad del servicio.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han identificado y descrito escenarios en los que surge la necesidad de un servicio de resolución de nombres."},{"letra":"b)","texto":"Se han clasificado los principales mecanismos de resolución de nombres."},{"letra":"c)","texto":"Se ha descrito la estructura, nomenclatura y funcionalidad de los sistemas de nombres jerárquicos."},{"letra":"d)","texto":"Se han instalado y configurado servicios jerárquicos de resolución de nombres."},{"letra":"e)","texto":"Se ha preparado el servicio para reenviar consultas de recursos externos a otro servidor de nombres."},{"letra":"f)","texto":"Se ha preparado el servicio para almacenar y distribuir las respuestas procedentes de otros servidores."},{"letra":"g)","texto":"Se han añadido registros de nombres correspondientes a una zona nueva, con opciones relativas a servidores de correo y alias."},{"letra":"h)","texto":"Se han implementado soluciones de servidores de nombres en direcciones «ip» dinámicas."},{"letra":"i)","texto":"Se han realizado transferencias de zona entre dos o más servidores."},{"letra":"j)","texto":"Se han documentado los procedimientos de instalación y configuración."}]},{"descripcion":"Administra servicios de configuración automática, identificándolos y verificando la correcta asignación de los parámetros.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han reconocido los mecanismos automatizados de configuración de los parámetros de red y las ventajas que proporcionan."},{"letra":"b)","texto":"Se han ilustrado los procedimientos y pautas que intervienen en una solicitud de configuración de los parámetros de red."},{"letra":"c)","texto":"Se han instalado servidores de configuración de los parámetros de red."},{"letra":"d)","texto":"Se ha preparado el servicio para asignar la configuración básica a los equipos de una red local."},{"letra":"e)","texto":"Se han configurado asignaciones estáticas y dinámicas."},{"letra":"f)","texto":"Se han integrado en el servicio opciones adicionales de configuración."},{"letra":"g)","texto":"Se han documentado los procedimientos realizados."}]},{"descripcion":"Administra servidores Web aplicando criterios de configuración y asegurando el funcionamiento del servicio.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han descrito los fundamentos y protocolos en los que se basa el funcionamiento de un servidor Web."},{"letra":"b)","texto":"Se han instalado y configurado servidores Web."},{"letra":"c)","texto":"Se ha ampliado la funcionalidad del servidor mediante la activación y configuración de módulos."},{"letra":"d)","texto":"Se han creado y configurado sitios virtuales."},{"letra":"e)","texto":"Se han configurado los mecanismos de autenticación y control de acceso del servidor."},{"letra":"f)","texto":"Se han obtenido e instalado certificados digitales."},{"letra":"g)","texto":"Se han establecido mecanismos para asegurar las comunicaciones entre el cliente y el servidor."},{"letra":"h)","texto":"Se han realizado pruebas de monitorización del servicio."},{"letra":"i)","texto":"Se han analizado los registros del servicio para la elaboración de estadísticas y la resolución de incidencias."},{"letra":"j)","texto":"Se ha elaborado documentación relativa a la instalación, configuración y recomendaciones de uso del servicio."}]},{"descripcion":"Administra servicios de transferencia de archivos asegurando y limitando el acceso a la información.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se ha establecido la utilidad y modo de operación del servicio de transferencia de archivos."},{"letra":"b)","texto":"Se han instalado y configurado servidores de transferencia de archivos."},{"letra":"c)","texto":"Se han creado usuarios y grupos para acceso remoto al servidor."},{"letra":"d)","texto":"Se ha configurado el acceso anónimo."},{"letra":"e)","texto":"Se han establecido límites en los distintos modos de acceso."},{"letra":"f)","texto":"Se ha comprobado el acceso al servidor, tanto en modo activo como en modo pasivo."},{"letra":"g)","texto":"Se han realizado pruebas con clientes en línea de comandos y con clientes en modo gráfico."},{"letra":"h)","texto":"Se ha utilizado el navegador como cliente del servicio de transferencia de archivos."},{"letra":"i)","texto":"Se ha elaborado documentación relativa a la instalación, configuración y recomendaciones de uso del servicio."}]},{"descripcion":"Administra servidores de correo electrónico, aplicando criterios de configuración y garantizando la seguridad del servicio.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han descrito los diferentes protocolos que intervienen en el envío y recogida del correo electrónico."},{"letra":"b)","texto":"Se ha instalado y configurado un servidor de correo electrónico."},{"letra":"c)","texto":"Se han creado cuentas de usuario y verificado el acceso de las mismas."},{"letra":"d)","texto":"Se han establecido y aplicado métodos para impedir usos indebidos del servidor de correo electrónico."},{"letra":"e)","texto":"Se han instalado servicios para permitir la recogida remota del correo existente en los buzones de usuario."},{"letra":"f)","texto":"Se han usado clientes de correo electrónico para enviar y recibir correo desde las cuentas creadas en el servidor."},{"letra":"g)","texto":"Se han utilizado la firma digital y el correo cifrado."},{"letra":"h)","texto":"Se ha configurado el servidor de correo como un servicio seguro."},{"letra":"i)","texto":"Se ha elaborado documentación relativa a la instalación, configuración y recomendaciones de uso del servicio."}]},{"descripcion":"Administra servicios de mensajería instantánea, noticias y listas de distribución, verificando y asegurando el acceso de los usuarios.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han descrito los servicios de mensajería instantánea, noticias y listas de distribución."},{"letra":"b)","texto":"Se ha instalado y configurado el servicio de mensajería instantánea."},{"letra":"c)","texto":"Se han utilizado clientes gráficos y de texto de mensajería instantánea."},{"letra":"d)","texto":"Se ha instalado y configurado el servicio de noticias."},{"letra":"e)","texto":"Se ha instalado y configurado el servicio de listas de distribución."},{"letra":"f)","texto":"Se han determinado el tipo de lista y los modos de acceso permitidos."},{"letra":"g)","texto":"Se han creado cuentas de usuario y verificado el acceso a los servicios de mensajería instantánea, noticias y listas de distribución."},{"letra":"h)","texto":"Se ha elaborado documentación relativa a la instalación, configuración y recomendaciones de uso de los servicios de mensajería instantánea, noticias y listas de distribución."}]},{"descripcion":"Administra servicios de audio identificando las necesidades de distribución y adaptando los formatos.","etiqueta":"(RA7)","ces":[{"letra":"a)","texto":"Se ha descrito la funcionalidad del servicio de audio."},{"letra":"b)","texto":"Se ha instalado y configurado un servidor de distribución de audio."},{"letra":"c)","texto":"Se ha instalado y configurado el cliente para el acceso al servidor de audio."},{"letra":"d)","texto":"Se han reconocido y utilizado formatos de audio digital."},{"letra":"e)","texto":"Se han utilizado herramientas de reproducción de audio en el cliente."},{"letra":"f)","texto":"Se han utilizado servicios de audio a través del navegador."},{"letra":"g)","texto":"Se han utilizado técnicas de sindicación y suscripción de audio."},{"letra":"h)","texto":"Se ha elaborado documentación relativa a la instalación y administración del servidor de audio."}]},{"descripcion":"Administra servicios de vídeo identificando las necesidades de distribución y adaptando los formatos.","etiqueta":"(RA8)","ces":[{"letra":"a)","texto":"Se ha descrito la funcionalidad del servicio de vídeo."},{"letra":"b)","texto":"Se ha instalado y configurado un servidor de vídeo."},{"letra":"c)","texto":"Se ha configurado el cliente para el acceso al servidor de vídeo."},{"letra":"d)","texto":"Se han reconocido y utilizado formatos de compresión de vídeo digital."},{"letra":"e)","texto":"Se han utilizado técnicas de sindicación y suscripción de vídeo."},{"letra":"f)","texto":"Se han descrito las características y protocolos utilizados en el servicio de videoconferencia."},{"letra":"g)","texto":"Se han instalado y configurado herramientas gráficas para realizar videoconferencia."},{"letra":"h)","texto":"Se han utilizado herramientas gráficas y navegadores para realizar videoconferencias."},{"letra":"i)","texto":"Se ha elaborado documentación relativa a la instalación y administración del servidor de vídeo y del servicio de videoconferencia."}]}]},{"cod":"1708","nombre":"Sostenibilidad aplicada al sistema productivo","horasSem":"1","horasTotal":"33","ras":[{"descripcion":"Identifica los aspectos ambientales, sociales y de gobernanza (ASG) relativos a la sostenibilidad teniendo en cuenta el concepto de desarrollo sostenible y los marcos internacionales que contribuyen a su consecución.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se ha descrito el concepto de sostenibilidad, estableciendo los marcos internacionales asociados al desarrollo sostenible."},{"letra":"b)","texto":"Se han identificado los asuntos ambientales, sociales y de gobernanza que influyen en el desarrollo sostenible de las organizaciones empresariales."},{"letra":"c)","texto":"Se han relacionado los Objetivos de Desarrollo Sostenible (ODS) con su importancia para la consecución de la Agenda 2030."},{"letra":"d)","texto":"Se ha analizado la importancia de identificar los aspectos ASG más relevantes para los grupos de interés de las organizaciones relacionándolos con los riesgos y oportunidades que suponen para la propia organización."},{"letra":"e)","texto":"Se han identificado los principales estándares de métricas para la evaluación del desempeño en sostenibilidad y su papel en la rendición de cuentas que marca la legislación vigente y las futuras regulaciones en desarrollo."},{"letra":"f)","texto":"Se ha descrito la inversión socialmente responsable y el papel de los analistas, inversores, agencias e índices de sostenibilidad en el fomento de la sostenibilidad."}]},{"descripcion":"Caracteriza los retos ambientales y sociales a los que se enfrenta la sociedad, describiendo los impactos sobre las personas y los sectores productivos y proponiendo acciones para minimizarlos.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han identificado los principales retos ambientales y sociales."},{"letra":"b)","texto":"Se han relacionado los retos ambientales y sociales con el desarrollo de la actividad económica."},{"letra":"c)","texto":"Se ha analizado el efecto de los impactos ambientales y sociales sobre las personas y los sectores productivos."},{"letra":"d)","texto":"Se han identificado las medidas y acciones encaminadas a minimizar los impactos ambientales y sociales."},{"letra":"e)","texto":"Se ha analizado la importancia de establecer alianzas y trabajar de manera transversal y coordinada para abordar con éxito los retos ambientales y sociales."}]},{"descripcion":"Establece la aplicación de criterios de sostenibilidad en el desempeño profesional y personal, identificando los elementos necesarios.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han identificado los ODS más relevantes para la actividad profesional que realiza."},{"letra":"b)","texto":"Se han analizado los riesgos y oportunidades que representan los ODS."},{"letra":"c)","texto":"Se han identificado las acciones necesarias para atender algunos de los retos ambientales y sociales desde la actividad profesional y el entorno personal."}]},{"descripcion":"Propón productos y servicios responsables teniendo en cuenta los principios de la economía circular.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se ha caracterizado el modelo de producción y consumo actual."},{"letra":"b)","texto":"Se han identificado los principios de la economía verde y circular."},{"letra":"c)","texto":"Se han contrastado los beneficios de la economía verde y circular frente al modelo clásico de producción."},{"letra":"d)","texto":"Se han aplicado principios de ecodiseño."},{"letra":"e)","texto":"Se ha analizado el ciclo de vida del producto."},{"letra":"f)","texto":"Se han identificado los procesos de producción y los criterios de sostenibilidad aplicados."}]},{"descripcion":"Realiza actividades sostenibles minimizando el impacto de las mismas en el medio ambiente.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se ha caracterizado el modelo de producción y consumo actual."},{"letra":"b)","texto":"Se han identificado los principios de la economía verde y circular."},{"letra":"c)","texto":"Se han contrastado los beneficios de la economía verde y circular frente al modelo clásico de producción."},{"letra":"d)","texto":"Se ha evaluado el impacto de las actividades personales y profesionales."},{"letra":"e)","texto":"Se han aplicado principios de ecodiseño."},{"letra":"f)","texto":"Se han aplicado estrategias sostenibles."},{"letra":"g)","texto":"Se ha analizado el ciclo de vida del producto."},{"letra":"h)","texto":"Se han identificado los procesos de producción y los criterios de sostenibilidad aplicados."},{"letra":"i)","texto":"Se ha aplicado la normativa ambiental."}]},{"descripcion":"Analiza un plan de sostenibilidad de una empresa del sector, identificando sus grupos de interés, los aspectos ASG materiales y justificando acciones para su gestión y medición.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han identificado los principales grupos de interés de la empresa."},{"letra":"b)","texto":"Se han analizado los aspectos ASG materiales, las expectativas de los grupos de interés y la importancia de los aspectos ASG en relación con los objetivos empresariales."},{"letra":"c)","texto":"Se han definido acciones encaminadas a minimizar los impactos negativos y aprovechar las oportunidades que plantean los principales aspectos ASG identificados."},{"letra":"d)","texto":"Se han determinado las métricas de evaluación del desempeño de la empresa de acuerdo con los estándares de sostenibilidad más ampliamente utilizados."},{"letra":"e)","texto":"Se ha elaborado un informe de sostenibilidad con el plan y los indicadores propuestos."}]}]}]}]},"IFC302":{"codigo":"IFC302","nombre":"Desarrollo de Aplicaciones Multiplataforma","categoria":"Ciclo Formativo de Grado Superior","cursos":[{"cursoNombre":"Curso 1º","modulos":[{"cod":"0484","nombre":"Bases de datos","horasSem":"6","horasTotal":"200","ras":[{"descripcion":"Reconoce los elementos de las bases de datos analizando sus funciones y valorando la utilidad de los sistemas gestores.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han analizado los sistemas lógicos de almacenamiento y sus características."},{"letra":"b)","texto":"Se han identificado los distintos tipos de bases de datos según el modelo de datos utilizado."},{"letra":"c)","texto":"Se han identificado los distintos tipos de bases de datos en función de la ubicación de la información."},{"letra":"d)","texto":"Se ha evaluado la utilidad de un sistema gestor de bases de datos."},{"letra":"e)","texto":"Se ha reconocido la función de cada uno de los elementos de un sistema gestor de bases de datos."},{"letra":"f)","texto":"Se han clasificado los sistemas gestores de bases de datos."},{"letra":"g)","texto":"Se ha reconocido la utilidad de las bases de datos distribuidas."},{"letra":"h)","texto":"Se han analizado las políticas de fragmentación de la información."},{"letra":"i)","texto":"Se ha identificado la legislación vigente sobre protección de datos."},{"letra":"j)","texto":"Se han reconocido los conceptos de Big Data y de la inteligencia de negocios."}]},{"descripcion":"Crea bases de datos definiendo su estructura y las características de sus elementos según el modelo relacional.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se ha analizado el formato de almacenamiento de la información."},{"letra":"b)","texto":"Se han creado las tablas y las relaciones entre ellas."},{"letra":"c)","texto":"Se han seleccionado los tipos de datos adecuados."},{"letra":"d)","texto":"Se han definido los campos clave en las tablas."},{"letra":"e)","texto":"Se han implantado las restricciones reflejadas en el diseño lógico."},{"letra":"f)","texto":"Se han creado vistas."},{"letra":"g)","texto":"Se han creado los usuarios y se les han asignado privilegios."},{"letra":"h)","texto":"Se han utilizado asistentes, herramientas gráficas y los lenguajes de definición y control de datos."}]},{"descripcion":"Consulta la información almacenada en una base de datos empleando asistentes, herramientas gráficas y el lenguaje de manipulación de datos.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han identificado las herramientas y sentencias para realizar consultas."},{"letra":"b)","texto":"Se han realizado consultas simples sobre una tabla."},{"letra":"c)","texto":"Se han realizado consultas sobre el contenido de varias tablas mediante composiciones internas."},{"letra":"d)","texto":"Se han realizado consultas sobre el contenido de varias tablas mediante composiciones externas."},{"letra":"e)","texto":"Se han realizado consultas resumen."},{"letra":"f)","texto":"Se han realizado consultas con subconsultas."},{"letra":"g)","texto":"Se han realizado consultas que implican múltiples selecciones."},{"letra":"h)","texto":"Se han aplicado criterios de optimización de consultas."}]},{"descripcion":"Modifica la información almacenada en la base de datos utilizando asistentes, herramientas gráficas y el lenguaje de manipulación de datos.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han identificado las herramientas y sentencias para modificar el contenido de la base de datos."},{"letra":"b)","texto":"Se han insertado, borrado y actualizado datos en las tablas."},{"letra":"c)","texto":"Se ha incluido en una tabla la información resultante de la ejecución de una consulta."},{"letra":"d)","texto":"Se han diseñado guiones de sentencias para llevar a cabo tareas complejas."},{"letra":"e)","texto":"Se ha reconocido el funcionamiento de las transacciones."},{"letra":"f)","texto":"Se han anulado parcial o totalmente los cambios producidos por una transacción."},{"letra":"g)","texto":"Se han identificado los efectos de las distintas políticas de bloqueo de registros."},{"letra":"h)","texto":"Se han adoptado medidas para mantener la integridad y consistencia de la información."}]},{"descripcion":"Desarrolla procedimientos almacenados evaluando y utilizando las sentencias del lenguaje incorporado en el sistema gestor de bases de datos.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han identificado las diversas formas de automatizar tareas."},{"letra":"b)","texto":"Se han reconocido los métodos de ejecución de guiones."},{"letra":"c)","texto":"Se han identificado las herramientas disponibles para editar guiones."},{"letra":"d)","texto":"Se han definido y utilizado guiones para automatizar tareas."},{"letra":"e)","texto":"Se ha hecho uso de las funciones proporcionadas por el sistema gestor."},{"letra":"f)","texto":"Se han definido procedimientos y funciones de usuario."},{"letra":"g)","texto":"Se han utilizado estructuras de control de flujo."},{"letra":"h)","texto":"Se han definido eventos y disparadores."},{"letra":"i)","texto":"Se han utilizado cursores."},{"letra":"j)","texto":"Se han utilizado excepciones."}]},{"descripcion":"Diseña modelos relacionales normalizados interpretando diagramas entidad/relación.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han utilizado herramientas gráficas para representar el diseño lógico."},{"letra":"b)","texto":"Se han identificado las tablas del diseño lógico."},{"letra":"c)","texto":"Se han identificado los campos que forman parte de las tablas del diseño lógico."},{"letra":"d)","texto":"Se han analizado las relaciones entre las tablas del diseño lógico."},{"letra":"e)","texto":"Se han identificado los campos clave."},{"letra":"f)","texto":"Se han aplicado reglas de integridad."},{"letra":"g)","texto":"Se han aplicado reglas de normalización."},{"letra":"h)","texto":"Se han analizado y documentado las restricciones que no pueden plasmarse en el diseño lógico."}]},{"descripcion":"Gestiona la información almacenada en bases de datos no relacionales, evaluando y utilizando las posibilidades que proporciona el sistema gestor.","etiqueta":"(RA7)","ces":[{"letra":"a)","texto":"Se han caracterizado las bases de datos no relacionales."},{"letra":"b)","texto":"Se han evaluado los principales tipos de bases de datos no relacionales."},{"letra":"c)","texto":"Se han identificado los elementos utilizados en estas bases de datos."},{"letra":"d)","texto":"Se han identificado distintas formas de gestión de la información según el tipo de base de datos no relacionales."},{"letra":"e)","texto":"Se han utilizado las herramientas del sistema gestor para la gestión de la información almacenada."}]}]},{"cod":"1665","nombre":"Digitalización aplicada a los sectores productivos (GS)","horasSem":"1","horasTotal":"33","ras":[{"descripcion":"Analiza el concepto de digitalización y su repercusión en los sectores productivos teniendo en cuenta la actividad de la empresa e identificando entornos IT (Information Technology: tecnología de la información) y OT (Operation Technology: tecnología de operación) característicos.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se ha descrito en qué consiste el concepto de digitalización."},{"letra":"b)","texto":"Se ha relacionado la implantación de la tecnología digital con la organización de las empresas."},{"letra":"c)","texto":"Se han establecido las diferencias y similitudes entre los entornos IT y OT."},{"letra":"d)","texto":"Se han identificado los departamentos típicos de las empresas que pueden constituir entornos IT."},{"letra":"e)","texto":"Se han seleccionado las tecnologías típicas de la digitalización en planta y en negocio."},{"letra":"f)","texto":"Se ha analizado la importancia de la conexión entre entornos IT y OT."},{"letra":"g)","texto":"Se han analizado las ventajas de digitalizar una empresa industrial de extremo a extremo."}]},{"descripcion":"Caracteriza las tecnologías habilitadoras digitales necesarias para la adecuación/transformación de las empresas a entornos digitales describiendo sus características y aplicaciones.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han identificado las principales tecnologías habilitadoras digitales."},{"letra":"b)","texto":"Se han relacionado las THD con el desarrollo de productos y servicios."},{"letra":"c)","texto":"Se ha relacionado la importancia de las THD con la economía sostenible y eficiente."},{"letra":"d)","texto":"Se han identificado nuevos mercados generados por las THD."},{"letra":"e)","texto":"Se ha analizado la implicación de THD tanto en la parte de negocio como en la parte de planta."},{"letra":"f)","texto":"Se han identificado las mejoras producidas debido a la implantación de las tecnologías habilitadoras en relación con los entornos IT y OT."},{"letra":"g)","texto":"Se ha elaborado un informe que relacione, las tecnologías con sus características y áreas de aplicación."}]},{"descripcion":"Identifica sistemas basados en cloud/nube y su influencia en el desarrollo de los sistemas digitales.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han identificado los diferentes niveles de la cloud/nube."},{"letra":"b)","texto":"Se han identificado las principales funciones de la cloud/nube (procesamiento de datos, intercambio de información, ejecución de aplicaciones, entre otros)."},{"letra":"c)","texto":"Se ha descrito el concepto de edge computing y su relación con la cloud/nube."},{"letra":"d)","texto":"Se han definido los conceptos de fog y mist y sus zonas de aplicación en el conjunto."},{"letra":"e)","texto":"Se han identificado las ventajas que proporciona la utilización de la cloud/nube en los sistemas conectados."}]},{"descripcion":"Identifica aplicaciones de la IA (inteligencia artificial) en entornos del sector donde está enmarcado el título describiendo las mejoras implícitas en su implementación.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se ha identificado la importancia de la IA en la automatización de procesos y su optimización."},{"letra":"b)","texto":"Se ha relacionado la IA con la recogida masiva de datos (Big Data) y su tratamiento (análisis) con la rentabilidad de las empresas."},{"letra":"c)","texto":"Se ha valorado la importancia presente y futura de la IA."},{"letra":"d)","texto":"Se han identificado los sectores con implantación más relevante de IA."},{"letra":"e)","texto":"Se han identificado los lenguajes de programación en IA."},{"letra":"f)","texto":"Se ha descrito como influye la IA en el sector del título."}]},{"descripcion":"Evalúa la importancia de los datos, así como su protección en una economía digital globalizada, definiendo sistemas de seguridad y ciberseguridad tanto a nivel de equipo/sistema, como globales.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se ha establecido la diferencia entre dato e información."},{"letra":"b)","texto":"Se ha descrito el ciclo de vida del dato."},{"letra":"c)","texto":"Se ha identificado la relación entre Big Data, análisis de datos, machine/ deep learning e inteligencia artificial."},{"letra":"d)","texto":"Se han descrito las características que definen Big Data."},{"letra":"e)","texto":"Se han descrito las etapas típicas de la ciencia de datos y su relación en el proceso."},{"letra":"f)","texto":"Se han descrito los procedimientos de almacenaje de datos en la cloud/nube."},{"letra":"g)","texto":"Se ha descrito la importancia del cloud computing."},{"letra":"h)","texto":"Se han identificado los principales objetivos de la ciencia de datos en las diferentes empresas."},{"letra":"i)","texto":"Se ha valorado la importancia de la seguridad y su regulación en relación con los datos."}]},{"descripcion":"Desarrolla un proyecto de transformación digital de una empresa de un sector relacionado con el título, teniendo en cuenta los cambios que se deben producir en función de los objetivos de la empresa.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han identificado los objetivos estratégicos de la empresa."},{"letra":"b)","texto":"Se han identificado y alineado las áreas de producción/negocio y de comunicaciones."},{"letra":"c)","texto":"Se han identificado las áreas susceptibles de ser digitalizadas."},{"letra":"d)","texto":"Se ha analizado el encaje de AD (áreas digitalizadas) entre sí y con las que no lo están."},{"letra":"e)","texto":"Se han tenido en cuenta las necesidades presentes y futuras de la empresa."},{"letra":"f)","texto":"Se han relacionado cada una de las áreas con la implantación de las tecnologías."},{"letra":"g)","texto":"Se han analizado las posibles brechas de seguridad en cada una de las áreas."},{"letra":"h)","texto":"Se ha definido el tratamiento de los datos y su análisis."},{"letra":"i)","texto":"Se ha tenido en cuenta la integración entre datos, aplicaciones, plataformas que los soportan, entre otros."},{"letra":"j)","texto":"Se han documentado los cambios realizados en función de la estrategia."},{"letra":"k)","texto":"Se han tenido en cuenta la idoneidad de los recursos humanos."}]}]},{"cod":"0487","nombre":"Entornos de desarrollo","horasSem":"3","horasTotal":"100","ras":[{"descripcion":"Reconoce los elementos y herramientas que intervienen en el desarrollo de un programa informático, analizando sus características y las fases en las que actúan hasta llegar a su puesta en funcionamiento.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se ha reconocido la relación de los programas con los componentes del sistema informático: memoria, procesador, periféricos, entre otros."},{"letra":"b)","texto":"Se han identificado las fases de desarrollo de una aplicación informática."},{"letra":"c)","texto":"Se han diferenciado los conceptos de código fuente, objeto y ejecutable."},{"letra":"d)","texto":"Se han reconocido las características de la generación de código intermedio para su ejecución en máquinas virtuales."},{"letra":"e)","texto":"Se han clasificado los lenguajes de programación, identificando sus características."},{"letra":"f)","texto":"Se ha evaluado la funcionalidad ofrecida por las herramientas utilizadas en el desarrollo de software."},{"letra":"g)","texto":"Se han identificado las características y escenarios de uso de las metodologías ágiles de desarrollo de software."}]},{"descripcion":"Evalúa entornos integrados de desarrollo analizando sus características para editar código fuente y generar ejecutables.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se han instalado entornos de desarrollo, propietarios y libres."},{"letra":"b)","texto":"Se han añadido y eliminado módulos en el entorno de desarrollo."},{"letra":"c)","texto":"Se ha personalizado y automatizado el entorno de desarrollo."},{"letra":"d)","texto":"Se ha configurado el sistema de actualización del entorno de desarrollo."},{"letra":"e)","texto":"Se han generado ejecutables a partir de código fuente de diferentes lenguajes en un mismo entorno de desarrollo."},{"letra":"f)","texto":"Se han generado ejecutables a partir de un mismo código fuente con varios entornos de desarrollo."},{"letra":"g)","texto":"Se han identificado las características comunes y específicas de diversos entornos de desarrollo."}]},{"descripcion":"Verifica el funcionamiento de programas diseñando y realizando pruebas.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han identificado los diferentes tipos de pruebas."},{"letra":"b)","texto":"Se han definido casos de prueba."},{"letra":"c)","texto":"Se han identificado las herramientas de depuración y prueba de aplicaciones"},{"letra":"d)","texto":"ofrecidas por el entorno de desarrollo."},{"letra":"e)","texto":"Se han utilizado herramientas de depuración para definir puntos de ruptura y seguimiento."},{"letra":"f)","texto":"Se han utilizado las herramientas de depuración para examinar y modificar el comportamiento de un programa en tiempo de ejecución."},{"letra":"g)","texto":"Se han efectuado pruebas unitarias de clases y funciones."},{"letra":"h)","texto":"Se han implementado pruebas automáticas."},{"letra":"i)","texto":"Se han documentado las incidencias detectadas."},{"letra":"j)","texto":"Se han utilizado dobles de prueba para aislar los componentes durante las pruebas."}]},{"descripcion":"Optimiza código empleando las herramientas disponibles en el entorno de desarrollo.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han identificado los patrones de refactorización más usuales."},{"letra":"b)","texto":"Se han elaborado las pruebas asociadas a la refactorización."},{"letra":"c)","texto":"Se ha revisado el código fuente usando un analizador de código."},{"letra":"d)","texto":"Se han identificado las posibilidades de configuración de un analizador de código."},{"letra":"e)","texto":"Se han aplicado patrones de refactorización con las herramientas que proporciona el entorno de desarrollo."},{"letra":"f)","texto":"Se ha realizado el control de versiones integrado en el entorno de desarrollo."},{"letra":"g)","texto":"Se han utilizado herramientas del entorno de desarrollo para documentar las clases."},{"letra":"h)","texto":"Se han utilizado repositorios remotos para el desarrollo de código colaborativo."},{"letra":"i)","texto":"Se han utilizado herramientas para la integración continua del código."}]},{"descripcion":"Genera diagramas de clases valorando su importancia en el desarrollo de aplicaciones y empleando herramientas específicas.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han identificado los conceptos básicos de la programación orientada a objetos."},{"letra":"b)","texto":"Se han utilizado herramientas para la elaboración de diagramas de clases."},{"letra":"c)","texto":"Se ha interpretado el significado de diagramas de clases."},{"letra":"d)","texto":"Se han trazado diagramas de clases a partir de las especificaciones de las mismas."},{"letra":"e)","texto":"Se ha generado código a partir de un diagrama de clases."},{"letra":"f)","texto":"Se ha generado un diagrama de clases mediante ingeniería inversa."}]},{"descripcion":"Genera diagramas de comportamiento valorando su importancia en el desarrollo de aplicaciones y empleando herramientas específicas.","etiqueta":"(RA6)","ces":[{"letra":"a)","texto":"Se han identificado los distintos tipos de diagramas de comportamiento."},{"letra":"b)","texto":"Se ha reconocido el significado de los diagramas de casos de uso."},{"letra":"c)","texto":"Se han interpretado diagramas de interacción."},{"letra":"d)","texto":"Se han elaborado diagramas de interacción sencillos."},{"letra":"e)","texto":"Se ha interpretado el significado de diagramas de actividades."},{"letra":"f)","texto":"Se han elaborado diagramas de actividades sencillos."},{"letra":"g)","texto":"Se han interpretado diagramas de estados."},{"letra":"h)","texto":"Se han planteado diagramas de estados sencillos."}]}]},{"cod":"0179","nombre":"Inglés Profesional (GS)","horasSem":"2","horasTotal":"67","ras":[{"descripcion":"Comprende información, de índole profesional, académica y cotidiana, contenida en todo tipo de discursos orales, emitidos por cualquier medio de comunicación en lengua estándar, interpretando con precisión el contenido del mensaje.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se ha identificado la idea principal de mensajes en lengua estándar relacionados con la vida social, profesional o académica."},{"letra":"b)","texto":"Se ha reconocido la finalidad de mensajes directos o emitidos en cualquier soporte en lengua estándar."},{"letra":"c)","texto":"Se ha extraído información específica contenida en distintos discursos orales en lengua estándar, relacionada con la vida social, profesional o académica."},{"letra":"d)","texto":"Se ha identificado el punto de vista y la actitud del hablante."},{"letra":"e)","texto":"Se ha identificado el hilo argumental de mensajes orales y determinado los roles que aparecen en dichos mensajes."},{"letra":"f)","texto":"Se han comprendido adecuadamente mensajes en lengua estándar en ambientes con contaminación acústica."},{"letra":"g)","texto":"Se han extraído las ideas principales de conferencias, charlas e informes, y otras formas de presentación académica y profesional, lingüísticamente complejas."},{"letra":"h)","texto":"Se ha tomado conciencia de la importancia de comprender globalmente un mensaje sin entender todos y cada uno de los elementos del mismo."}]},{"descripcion":"Comprende mensajes escritos, de naturaleza profesional, académica y cotidiana, de relativa dificultad, analizando de forma comprensiva su contenido.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se ha identificado la idea principal de textos específicos de su ámbito social, profesional o académico."},{"letra":"b)","texto":"Se ha reconocido la finalidad de distintos textos escritos en cualquier soporte, en lengua estándar y relacionados con la actividad profesional."},{"letra":"c)","texto":"Se ha extraído información específica de textos, de diferente naturaleza, relativos a su profesión, y contenidos en distintos soportes."},{"letra":"d)","texto":"Se ha tomado conciencia de la importancia de comprender globalmente un texto sin entender todos y cada uno de los elementos del mismo."},{"letra":"e)","texto":"Se han leído y comprendido, de manera autónoma, textos relacionados con el sector con la velocidad y estilo de lectura propia del nivel competencial."},{"letra":"f)","texto":"Se ha interpretado la correspondencia relativa a su especialidad, captando fácilmente el significado esencial."},{"letra":"g)","texto":"Se han interpretado textos extensos, y de cierta complejidad, relacionados o no con su especialidad, pudiendo realizar varias lecturas del mismo."},{"letra":"h)","texto":"Se ha identificado con rapidez el contenido y la importancia de noticias, artículos e informes sobre una amplia serie de temas profesionales."},{"letra":"i)","texto":"Se han interpretado instrucciones, con distintos niveles de dificultad, y mensajes técnicos recibidos a través de soportes digitales."},{"letra":"j)","texto":"Se han traducido textos de cierta complejidad, utilizando material de apoyo en caso necesario."}]},{"descripcion":"Produce mensajes orales claros y bien estructurados, analizando el contenido de la situación y adaptándose al registro lingüístico del interlocutor.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han emitido mensajes generales propios de sector y de la vida cotidiana, utilizando nexos y estrategias de interacción."},{"letra":"b)","texto":"Se ha intercambiado con fluidez información específica y detallada utilizando estructuras de una complejidad acorde al nivel competencial."},{"letra":"c)","texto":"Se han seleccionado y aplicado los registros adecuados para la emisión del mensaje, así como protocolos y normas de relación social propios del país."},{"letra":"d)","texto":"Se han realizado presentaciones, bien estructuradas, sobre temas de su ámbito profesional, haciendo uso de los protocolos establecidos."},{"letra":"e)","texto":"Se ha utilizado correctamente la terminología de la profesión."},{"letra":"f)","texto":"Se ha descrito y secuenciado oralmente un proceso de trabajo de su competencia."},{"letra":"g)","texto":"Se ha solicitado la reformulación del discurso o parte del mismo cuando se ha considerado necesario."},{"letra":"h)","texto":"Se ha interaccionado espontáneamente, adoptando un nivel de formalidad adecuado a las circunstancias."},{"letra":"i)","texto":"Se ha expresado con fluidez, precisión y eficacia sobre una amplia serie de temas generales, académicos, profesionales o de ocio, marcando con claridad la relación entre las ideas."},{"letra":"j)","texto":"Se han expresado y defendido puntos de vista con claridad, proporcionando explicaciones y argumentos adecuados."},{"letra":"k)","texto":"Se ha respondido a preguntas relativas a su vida socio-profesional, incluidas las propias de una entrevista de trabajo."}]},{"descripcion":"Redacta documentos e informes, propios del sector o de la vida académica y cotidiana, relacionando los recursos lingüísticos con el propósito de los mismos.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han escrito textos claros y detallados sobre una variedad de temas relacionados con su profesión, sintetizando y evaluando información y argumentos procedentes de varias fuentes."},{"letra":"b)","texto":"Se ha cumplimentado documentación específica de su campo profesional, utilizando vocabulario específico y protocolos y normas de relación social propios del país."},{"letra":"c)","texto":"Se ha organizado la información con corrección, precisión, con cohesión y coherencia, solicitando y/o facilitando información de tipo general o detallada."},{"letra":"d)","texto":"Se han cumplimentado textos mediante apoyos visuales y claves lingüísticas."},{"letra":"e)","texto":"Se han elaborado informes, destacando los "},{"letra":"b)","texto":"Se ha comparado los diferentes requerimientos exigidos por el mercado laboral con las exigencias para el trabajo en la función pública relacionados con el sector privado."},{"letra":"c)","texto":"Se ha reflexionado sobre las actitudes y aptitudes requeridas actualmente para la actividad profesional relacionadas con el título, así como las competencias personales y sociales más relevantes para el sector identificando nuestra zona de desarrollo próximo."}]},{"descripcion":"Adquiere las competencias necesarias para el desempeño de las funciones de nivel básico en Prevención de Riesgos Laborales.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se ha valorado la importancia de la cultura preventiva en todos los ámbitos actividades de la empresa u organismo equiparado relacionado las condiciones laborales con la salud de la persona trabajadora identificando y clasificando los factores de riesgo en la actividad y los daños derivados de los mismos, especialmente las situaciones de riesgo más habituales en los entornos de trabajo del sector profesional relacionado con el título."},{"letra":"b)","texto":"Se han clasificado y descrito los tipos de daños profesionales, con especial referencia a accidentes de trabajo y enfermedades profesionales, relacionados con el perfil profesional del título."},{"letra":"c)","texto":"Se ha determinado la evaluación de riesgos en la empresa u organismo equiparado y definido las técnicas de prevención y de protección que deben aplicarse para evitar los daños en su origen y minimizar sus consecuencias."},{"letra":"d)","texto":"Se han analizado los protocolos de actuación en caso de emergencia."},{"letra":"e)","texto":"Se han determinado los principales derechos y deberes en materia de prevención de riesgos laborales."},{"letra":"f)","texto":"Se han clasificado las distintas formas de gestión de la prevención en la empresa u organismo equiparado, en función de los distintos criterios establecidos en la normativa sobre icado las tecnologías en que se basa la sindicación de contenidos."},{"letra":"j)","texto":"Se han reconocido los ámbitos de aplicación de la sindicación de contenidos."}]},{"descripcion":"Accede y manipula documentos web utilizando lenguajes de script de cliente.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se han identificado y clasificado los lenguajes de script de cliente relacionados con la web y sus diferentes versiones y estándares."},{"letra":"b)","texto":"Se ha identificado la sintaxis básica de los lenguajes de script de cliente."},{"letra":"c)","texto":"Se han utilizado métodos para la selección y acceso de los diferentes elementos de un documento web."},{"letra":"d)","texto":"Se han creado y modificado elementos de documentos web."},{"letra":"e)","texto":"Se han eliminado elementos de documentos web."},{"letra":"f)","texto":"Se han realizado modificaciones sobre los estilos de un documento web."}]},{"descripcion":"Establece mecanismos de validación de documentos para el intercambio de información utilizando métodos para definir su sintaxis y estructura.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se ha establecido la necesidad de describir la información transmitida en los documentos y sus reglas."},{"letra":"b)","texto":"Se han identificado las tecnologías relacionadas con la definición de documentos."},{"letra":"c)","texto":"Se ha analizado la estructura y sintaxis específica utilizada en la descripción."},{"letra":"d)","texto":"Se han creado descripciones de documentos."},{"letra":"e)","texto":"Se han utilizado descripciones en la elaboración y validación de documentos."},{"letra":"f)","texto":"Se han asociado las descripciones con los documentos."},{"letra":"g)","texto":"Se han utilizado herramientas específicas."}]},{"descripcion":"Realiza conversiones sobre documentos para el intercambio de información utilizando técnicas, lenguajes y herramientas de procesamiento.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se ha identificado la n ultados obtenidos."}]}]},{"cod":"1710","nombre":"Itinerario personal para la empleabilidad II","horasSem":"2","horasTotal":"67","ras":[{"descripcion":"Planifica y pone en marcha estrategias en los diferentes procesos selectivos de empleo que le permiten mejorar sus posibilidades de inserción laboral.","etiqueta":"(RA1)","ces":[{"letra":"a)","texto":"Se han determinado las técnicas utilizadas actualmente en el sector para el proceso de selección de personal."},{"letra":"b)","texto":"Se han desarrollado estrategias para la búsqueda de empleo relacionadas con las técnicas actuales más utilizadas contextualizadas al sector."},{"letra":"c)","texto":"Se han valorado las actitudes y aptitudes que permiten superar procesos selectivos en el sector privado y en el sector público."},{"letra":"d)","texto":"Se ha construido una marca personal identificando las necesidades del mercado actual, sus habilidades, destrezas y su aporte de valor."}]},{"descripcion":"Aplica estrategias relacionadas con las competencias personales, sociales y emocionales para el empleo en búsqueda de la mejora de su empleabilidad.","etiqueta":"(RA2)","ces":[{"letra":"a)","texto":"Se ha valorado la importancia de las competencias personales y sociales en la empleabilidad en el sector de referencia."},{"letra":"b)","texto":"Se ha participado activamente en el establecimiento de los objetivos del equipo y en la toma de decisiones del mismo y asumido la responsabilidad de las acciones y decisiones del grupo, participando activamente en el logro de unos objetivos compartidos cooperando con otras personas y compartiendo el liderazgo."},{"letra":"c)","texto":"Se han incorporado al propio proceso de aprendizaje las técnicas y recursos de presentación y comunicación, tanto orales como escritos, adecuados para una comunicación efectiva y afectiva siendo capaz de adaptarlos a cada situación y circunstancias, valorando las oportunidades y dificultades que ofrece cada una de ellas."},{"letra":"d)","texto":"Se han aplicado técnicas y estrategias para la gestión del tiempo disponible para alcanzar los objetivos tanto individuales como del equipo y programado las actividades necesarias."},{"letra":"e)","texto":"Se han aplicado estrategias para canalizar las emociones mostrando una actitud flexible en las relaciones con otras personas."},{"letra":"f)","texto":"Se han desarrollado estrategias para la programación de actividades atendiendo a criterios de organización eficiente y previendo las posibles dificultades."},{"letra":"g)","texto":"Se ha reaccionado de forma flexible y positiva ante conflictos y situaciones nuevas, aprovechando las oportunidades y gestionando las dificultades haciendo uso de estrategias relacionadas con la inteligencia emocional."}]},{"descripcion":"Pone en práctica las habilidades emprendedoras necesarias para el desarrollo de procesos de innovación e investigación aplicadas que promuevan la modernización del sector productivo hacia un modelo sostenible.","etiqueta":"(RA3)","ces":[{"letra":"a)","texto":"Se ha identificado el concepto de innovación y su relación con la construcción de una sociedad más sostenible que mejore en el bienestar de los individuos."},{"letra":"b)","texto":"Se han analizado las distintas metodologías para emprender y su importancia para favorecer la innovación y como fuente de creación de empleo y bienestar social."},{"letra":"c)","texto":"Se han aplicado las habilidades emprendedoras necesarias para promover el emprendimiento y el intraemprendimiento."},{"letra":"d)","texto":"Se ha puesto en práctica el trabajo colaborativo como requisito para el desarrollo de procesos de innovación."},{"letra":"e)","texto":"Se ha desarrollado la competencia digital necesaria para la mejora de los procesos de innovación e investigación aplicadas que promuevan la modernización del sector productivo."},{"letra":"f)","texto":"Se han incorporado los objetivos de las políticas e iniciativas relacionadas con la sostenibilidad y el medio ambiente a la estrategia empresarial enfocada al desarrollo de un modelo económico y social sostenible."}]},{"descripcion":"Identifica, define y valida ideas de emprendimiento generadoras de nuevas oportunidades a partir de estrategias de análisis del entorno socio productivo utilizando metodologías ágiles para el emprendimiento.","etiqueta":"(RA4)","ces":[{"letra":"a)","texto":"Se han identificado los problemas de las personas destinatarias potenciales del proyecto emprendedor como paso previo a la propuesta de soluciones que se conviertan en oportunidades."},{"letra":"b)","texto":"Se ha puesto en práctica el proceso creativo con el fin de conseguir una idea emprendedora que aporte valor económico, social y/o cultural."},{"letra":"c)","texto":"Se ha diseñado un modelo de negocio y/o gestión derivado de la idea emprendedora."},{"letra":"d)","texto":"Se han incorporado valores éticos y sociales a la idea emprendedora analizando modelos de balance social."},{"letra":"e)","texto":"Se ha analizado la contribución de la Economía Circular y la Economía del Bien Común al desarrollo de un modelo económico y social basado en la equidad, la justicia social y la sostenibilidad."},{"letra":"f)","texto":"Se han analizado los principales componentes del entorno general y específico, y su impacto en la idea emprendedora."},{"letra":"g)","texto":"Se han realizado entrevistas de problema para validar el perfil y el problema de las personas destinatarias de la idea emprendedora."},{"letra":"h)","texto":"Se ha validado la solución mediante la creación de prototipos buscando el encaje problema-solución."},{"letra":"i)","texto":"Se ha experimentado con la puesta en práctica de estrategias de marketing para desarrollar destrezas en técnicas de comunicación y venta."}]},{"descripcion":"Desarrolla un proyecto emprendedor de innovación social y/o tecnológica aplicada en colaboración con el entorno.","etiqueta":"(RA5)","ces":[{"letra":"a)","texto":"Se han analizado los conceptos básicos del emprendimiento y la
